function ruleHelp(code, label) {
  const txt = ruleHtml(code); if (!txt) return { btn: '', box: '' };
  const id = 'hp' + (++_hid);
  return { id, box: `<div class="help" id="${id}" hidden>${txt}</div>` };
}

let _hid = 0;
// Título curto (eyebrow) com ajuda, para cartões e totais
const eyeH = (key, label) => { const h = help(key, label); return `<div class="lab-row"><div class="eyebrow">${label}</div>${h.btn}</div>${h.box}`; };
const helpKey = p => String(p || '').replace(/^contracts\.\d+\./, 'contract.');
function helpFor(key) {
  const k = helpKey(key);
  const txt = HELP[k] || HELP[k.replace(/\.(on|val)$/, '')];
  return txt || '';
}
// Botão "?" + caixa de ajuda (fechada). Retorna { btn, box }
function help(key, label = '') {
  const txt = helpFor(key);
  if (!txt) return { btn: '', box: '' };
  const id = 'hp' + (++_hid);
  return { btn: `<button type="button" class="help-btn" data-help="${id}" aria-expanded="false" aria-controls="${id}" aria-label="Ajuda: ${esc(String(label).replace(/<[^>]+>/g, ''))}">?</button>`, box: `<div class="help" id="${id}" hidden>${txt}</div>` };
}
// Linha de rótulo com o botão de ajuda
function labRow(key, label, forId) {
  const h = help(key, label);
  return { row: `<div class="lab-row">${forId ? `<label for="${forId}">${label}</label>` : `<span class="lab">${label}</span>`}${h.btn}</div>`, box: h.box };
}

/* Componentes de formulário: campos ligados ao estado, blocos recolhíveis */
const getP = (path) => path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), S);
function setP(path, val) { const ks = path.split('.'); let o = S; ks.slice(0, -1).forEach(k => { if (o[k] == null) o[k] = {}; o = o[k]; }); o[ks.at(-1)] = val; }
const fid = p => 'f_' + p.replace(/[^a-z0-9]/gi, '_');
const F = {
  num: (path, label, o = {}) => { const L = labRow(o.help || path, label, fid(path)); return `<div class="field ${o.full ? 'full' : ''}">${L.row}<div class="${o.money ? 'money' : o.pct ? 'pctf' : ''}"><input id="${fid(path)}" type="number" inputmode="decimal" step="${o.step || 'any'}" data-bind="${path}" data-type="num" value="${esc(o.value !== undefined ? o.value : getP(path))}" ${o.disabled ? 'disabled' : ''}></div>${o.hint ? `<span class="muted" style="font-size:12px">${o.hint}</span>` : ''}${L.box}</div>`; },
  text: (path, label, o = {}) => { const L = labRow(path, label, fid(path)); return `<div class="field ${o.full ? 'full' : ''}">${L.row}<input id="${fid(path)}" type="text" data-bind="${path}" value="${esc(getP(path))}" placeholder="${esc(o.ph || '')}">${L.box}</div>`; },
  sel: (path, label, opts, o = {}) => { const L = labRow(path, label, fid(path)); return `<div class="field ${o.full ? 'full' : ''}">${L.row}<select id="${fid(path)}" data-bind="${path}" data-type="${o.num ? 'num' : 'str'}" data-rerender>${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(getP(path)) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>${L.box}</div>`; },
  chk: (path, label, hkey = path) => { const h = help(hkey, label); return `<span class="chk-row"><label class="inline-opt"><input type="checkbox" id="${fid(path)}" data-bind="${path}" data-type="bool" data-rerender ${getP(path) ? 'checked' : ''}> ${label}</label>${h.btn}</span>${h.box}`; }
};
const sw = (path, label) => `<span class="switch"><input type="checkbox" id="${fid(path)}" aria-label="${esc(label)}" data-bind="${path}" data-type="bool" data-rerender ${getP(path) ? 'checked' : ''}><span></span></span>`;
// Blocos recolhíveis: fechados mostram um resumo; o estado aberto sobrevive ao re-render
const openMods = new Set(['Dados pessoais']);
const mod = (title, desc, path, body, sum = '') => {
  const open = openMods.has(title), on = !path || getP(path);
  const line = !open && sum ? sum : desc;
  const hb = path ? help(path, title) : { btn: '', box: '' };
  return `<section class="mod ${path && !on ? 'off' : ''}"><div class="mod-h"><button type="button" class="mod-t" data-modt="${esc(title)}" aria-expanded="${open}" data-desc="${esc(desc)}" data-sum="${esc(sum)}"><span class="t"><h3>${title}</h3><p>${esc(line)}</p></span><span class="caret" aria-hidden="true"></span></button>${hb.btn}${path ? sw(path, title) : ''}</div>${hb.box ? `<div style="padding:0 14px 10px">${hb.box}</div>` : ''}<div class="mod-b" ${open ? '' : 'hidden'}>${body}</div></section>`;
};
const costField = (key, label, hint) => `<div class="field">${F.chk(`settings.costs.${key}.on`, label)}<div class="money"><input id="${fid('settings.costs.' + key + '.val')}" aria-label="${label} (valor)" type="number" inputmode="decimal" step="any" data-bind="settings.costs.${key}.val" data-type="num" value="${getP('settings.costs.' + key + '.val')}" ${getP('settings.costs.' + key + '.on') ? '' : 'disabled'}></div><span class="muted" style="font-size:12px">${hint}</span></div>`;

const PAY_FORMS = [['weekly', 'Pagamento fixo semanal + comissão'], ['hourly', 'Por hora (Hourly Pay) + comissão'], ['cpm', 'Por milha (Cents Per Mile)'], ['percent', 'Percentual do frete (sem fixo)']];
const PAY_HELP = {
  weekly: 'Recebe o valor fixo toda semana fechada, mais a comissão sobre o frete de cada viagem de caminhão.',
  hourly: 'Cada viagem informa as horas de serviço. Paga horas × valor, respeitando o limite diário e o semanal, mais a comissão.',
  cpm: 'Cada viagem paga milhas × valor. Espera nas docas acima das horas livres e paradas extras somam à parte.',
  percent: 'Sem salário fixo. O motorista fica com um percentual do frete de cada viagem. É o modelo típico de lease e owner-operator.'
};
const toggleNum = (onPath, valPath, label, o = {}) => `<div class="field ${o.full ? 'full' : ''}">${F.chk(onPath, label, valPath)}<div class="${o.money ? 'money' : o.pct ? 'pctf' : ''}"><input id="${fid(valPath)}" aria-label="${esc(label)}" type="number" inputmode="decimal" step="any" data-bind="${valPath}" data-type="num" value="${esc(getP(valPath))}" ${getP(onPath) ? '' : 'disabled'}></div>${o.hint ? `<span class="muted" style="font-size:12px">${o.hint}</span>` : ''}</div>`;
const hint = txt => `<p class="full muted" style="margin:0;font-size:13px">${txt}</p>`;
const yes = (v, a, b = '') => v ? a : b;
function listEditor(key, label, ph) {
  const items = S.settings.lists[key];
  const LR = labRow('lists.' + key, label);
  return `<div class="full field">${LR.row}${LR.box}<div class="cities">${items.map((c, i) => `<span class="chip">${esc(c)}<button type="button" data-dellist="${key}:${i}" aria-label="Remover ${esc(c)}">×</button></span>`).join('')}</div>
    <div class="row" style="flex-wrap:nowrap"><input id="new_${key}" type="text" placeholder="${esc(ph)}" style="flex:1;min-width:0;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:8px 10px;min-height:40px"><button class="btn" data-addlist="${key}">Adicionar</button></div></div>`;
}

// Ajustes = regras gerais do jogo. Tudo que depende do empregador fica no contrato (aba Carreira).
function carModule() {
  const s = S.settings, b = s.borrowed;
  // Comparação por viagem: uma viagem de carro típica (distância e frete médios das suas viagens de carro)
  // contra o salário bruto médio por viagem de caminhão da semana atual.
  const carTrips = [...H.flatMap(w => w.trips || []), ...S.week.trips].filter(t => t.type === 'borrowed' && E.n(t.miles) > 0);
  const mi = carTrips.length ? Math.round(carTrips.reduce((a, t) => a + E.n(t.miles), 0) / carTrips.length) : 200;
  const gpm = carTrips.length ? carTrips.reduce((a, t) => a + E.n(t.freight), 0) / carTrips.reduce((a, t) => a + E.n(t.miles), 0) : 3.7;
  const mkt = mi * gpm * E.n(b.factor);
  const lent = mkt * E.n(b.pct) / 100, own = mkt - mi * E.n(b.costPerMile) - mi * 0.2;
  const wk = E.dre(S.week.trips.filter(t => t.type !== 'borrowed'), SS());
  const truckTrip = wk.counts.company ? wk.revenue / wk.counts.company : null;
  const cmp = v => truckTrip ? ` (${fmtN(v / truckTrip * 100)}% de uma viagem de caminhão)` : '';
  return mod('Viagens de carro', 'Fretes fora do contrato. Emprestado: % do frete, sem custos do veículo. Próprio: 100% do frete, com todos os custos.', 'settings.borrowed.on',
    F.num('settings.borrowed.factor', 'Fator sobre o frete do jogo', { hint: `Frete de mercado do carro = frete do jogo × ${fmtN(b.factor)}.` }) +
    `<div class="field">${F.chk('settings.borrowed.bonusFactor', 'Aplicar o fator também ao bônus')}</div>` +
    F.num('settings.borrowed.pct', 'Emprestado: comissão do motorista', { pct: true, hint: 'O dono do carro paga combustível, pedágio e danos.' }) +
    `<div class="field">${F.chk('settings.borrowed.personal', 'Emprestado: refeições, hotel e multas continuam com o motorista')}</div>` +
    `<div class="field">${F.chk('settings.borrowed.ownOn', 'Tenho carro próprio')}</div>` +
    (b.ownOn ? F.num('settings.borrowed.costPerMile', 'Próprio: custo do carro por milha', { money: true, hint: 'Manutenção, pneus, seguro e depreciação. Combustível e pedágio são lançados na viagem.' }) : '') +
    F.sel('settings.borrowed.settle', 'Quando o resultado cai no saldo', [['immediate', 'Na hora do lançamento'], ['payroll', 'Junto com o holerite da semana']]) +
    hint(`<b>Viagem de carro típica</b> (${mi} mi, frete do jogo ${fmt(gpm)}/mi, sem bônus): emprestado ${fmt(lent)}${cmp(lent)}${b.ownOn ? ` · próprio ${fmt(own)} com combustível estimado em $0,20/mi${cmp(own)}` : ''}.${truckTrip ? ` Caminhão na semana atual: ${fmt(truckTrip)} de salário bruto por viagem.` : ''} Alvo: carro emprestado entre 35% e 50% e próprio entre 55% e 75% de uma viagem de caminhão.`),
    `Emprestado ${fmtN(b.pct)}% · ${b.ownOn ? `próprio ${fmt(b.costPerMile)}/mi · ` : ''}frete × ${fmtN(b.factor)}`);
}

function carreira() {
  const TC = help('tab.carreira', 'Carreira');
  const tabs = [['motorista', 'Motorista'], ['contratos', 'Contrato'], ['empresas', 'Empresas']];
  return `<div class="sec-head"><div><div class="eyebrow">Carreira</div><h2 class="hrow">${({ motorista: 'Cadastro do motorista', contratos: 'Contrato de trabalho', empresas: 'Empresas' })[ctab]}${TC.btn}</h2></div></div>${TC.box}
    <div class="seg3" role="tablist" aria-label="Seções da carreira">${tabs.map(([k, l]) => `<button type="button" role="tab" data-ctab="${k}" aria-selected="${ctab === k}">${l}</button>`).join('')}</div>
    ${({ motorista: motoristaView, contratos: contratosView, empresas: empresasView })[ctab]()}`;
}

function motoristaView() {
  const P = S.profile, c = activeContract();
  const allTrips = [...H.flatMap(w => w.trips || []), ...S.week.trips].filter(t => t.type !== 'borrowed');
  const miles = allTrips.reduce((a, t) => a + E.n(t.miles), 0);
  const exp = EXPERIENCE.find(e => e[0] === P.experience) || EXPERIENCE[0];
  const timeline = S.contracts.slice().sort((a, b) => b.startDay - a.startDay).map(k => `<div class="li"><div><div><b>${esc(companyName(k))}</b> · ${esc(shortCls(k.classification))}</div><div class="muted" style="font-size:12.5px">${contractPeriod(k)} · ${esc(payFormShort(k.terms))} · ${tripsOfContract(k.id).length} viagens</div></div>${k.id === S.currentContractId ? '<span class="chip ok">Atual</span>' : `<span class="chip">${esc(k.endReason || 'Encerrado')}</span>`}</div>`).join('');
  return `
  <div class="stats">
    <div class="panel stat"><div class="eyebrow">Empregador atual</div><div class="v" style="font-size:22px">${esc(companyName(c))}</div><div class="s">${c ? 'Desde o dia ' + c.startDay + ' · ' + esc(shortCls(c.classification)) : ''}</div></div>
    <div class="panel stat"><div class="eyebrow">Milhas na carreira</div><div class="v">${fmtN(miles)} mi</div><div class="s">${allTrips.length} viagens de caminhão</div></div>
    <div class="panel stat"><div class="eyebrow">Empresas</div><div class="v">${new Set(S.contracts.map(k => k.companyId)).size}</div><div class="s">${S.contracts.length} contrato${S.contracts.length === 1 ? '' : 's'}</div></div>
  </div>
  ${mod('Dados pessoais', 'Quem é o motorista. Empresa e salário ficam no contrato; saldo no Holerite.', null,
    F.text('profile.name', 'Nome do motorista') + F.text('profile.nationality', 'Nacionalidade') + F.num('profile.level', 'Nível no jogo', { step: 1 }) +
    F.sel('profile.experience', 'Experiência como motorista', EXPERIENCE.map(e => [e[0], e[1]])) +
    hint(`Faixa de CPM para ${esc(exp[1].toLowerCase())}: ${fmt(exp[2])}–${fmt(exp[3])} por milha.`) +
    F.sel('profile.visa', 'Status migratório / CDL', VISAS, { full: true }) +
    hint(P.visa === 'other' ? '<b>Atenção:</b> desde 15/03/2026 a CDL não-domiciliada só é emitida para vistos H-2A, H-2B e E-2.' : 'Desde 15/03/2026, motorista estrangeiro sem residência permanente precisa de visto H-2A, H-2B ou E-2 para ter CDL não-domiciliada.'),
    `${P.name || 'Sem nome'} · ${exp[1]}`)}
  ${(() => {
    const rv = recentViolations(), h = help('ui.registro', 'Registro de segurança');
    const st = rv.length === 0 ? ['ok', 'Limpo'] : rv.length < 3 ? ['warn', 'Atenção'] : ['bad', 'Em risco'];
    return `<section class="panel pad" style="display:flex;flex-direction:column;gap:6px">
      <div class="sec-head"><h3 class="hrow">Registro de segurança${h.btn}</h3><span class="chip ${st[0]}">${st[1]} · ${rv.length} infraç${rv.length === 1 ? 'ão' : 'ões'} em 8 semanas</span></div>${h.box}
      ${rv.length ? `<div class="ledger">${rv.slice().reverse().map(v => `<div class="li"><div><div>${esc(v.text)}</div><div class="muted" style="font-size:12.5px">Dia ${v.day}${v.caught ? ` · pega na fiscalização · multa ${fmt(v.fine)}` : ' · não fiscalizada'}</div></div><span class="chip ${v.caught ? 'bad' : 'warn'}">${v.caught ? 'Multada' : 'Registrada'}</span></div>`).join('')}</div>` : '<p class="muted" style="margin:0;font-size:13px">Nenhuma infração de jornada nas últimas 8 semanas.</p>'}
      ${rv.length >= 3 ? '<p style="margin:0;font-size:13px"><b>Em risco:</b> na vida real, várias infrações seguidas levam a advertência, perda de bônus e até demissão. Respeite as horas nas próximas semanas para limpar o registro.</p>' : ''}
    </section>`;
  })()}
  <section class="panel pad" style="display:flex;flex-direction:column;gap:6px">
    <div class="sec-head"><h3>Histórico de empresas</h3><button class="btn sm" data-act="new-contract">Trocar de contrato</button></div>
    <div class="ledger">${timeline}</div>
  </section>`;
}

function empresasView() {
  const cur = activeContract();
  const list = S.companies.map(co => {
    const ks = S.contracts.filter(k => k.companyId === co.id);
    const isCur = cur && cur.companyId === co.id;
    return `<div class="panel pad" style="display:flex;flex-direction:column;gap:6px">
      <div class="row between"><div><h3>${esc(co.name)}</h3><div class="muted" style="font-size:13px">${[co.hq, co.dot].filter(Boolean).map(esc).join(' · ') || 'Sem sede cadastrada'}</div></div>${isCur ? '<span class="chip ok">Empregador atual</span>' : ks.length ? `<span class="chip">${ks.length} contrato${ks.length === 1 ? '' : 's'} anterior${ks.length === 1 ? '' : 'es'}</span>` : '<span class="chip">Sem contrato</span>'}</div>
      ${co.notes ? `<p class="muted" style="margin:0;font-size:13px">${esc(co.notes)}</p>` : ''}
      <div class="row"><button class="btn sm" data-editco="${esc(co.id)}">Editar</button>${!ks.length ? `<button class="btn sm danger" data-delco="${esc(co.id)}">Excluir</button>` : ''}${!isCur ? `<button class="btn sm" data-act="new-contract" data-co="${esc(co.id)}">Contratar por esta empresa</button>` : ''}</div>
    </div>`;
  }).join('');
  return `<div class="row between"><p class="muted" style="margin:0;font-size:13.5px">Empresas cadastradas aparecem como opção nos contratos.</p><button class="btn primary sm" data-editco="">Cadastrar empresa</button></div>${list}`;
}

function contratosView() {
  const c = activeContract();
  const past = S.contracts.filter(k => k.id !== S.currentContractId).sort((a, b) => b.startDay - a.startDay);
  return `<div class="panel pad row between">
      <div><div class="eyebrow">Contrato ativo</div><h3>${esc(companyName(c))}</h3><div class="muted" style="font-size:13px">${esc(shortCls(c.classification))} · ${contractPeriod(c)} · ${tripsOfContract(c.id).length} viagens</div></div>
      <button class="btn sm" data-act="new-contract">Trocar de contrato</button>
    </div>
    ${hint('Cada viagem de caminhão usa este contrato no lançamento e guarda as condições. Mudar algo aqui vale para as próximas viagens.')}
    ${contractEditor(c)}
    ${past.length ? `<div class="sec-head"><h3>Contratos anteriores</h3></div>${past.map(k => `<details class="week"><summary><div><b>${esc(companyName(k))}</b><div class="muted" style="font-size:13px">${contractPeriod(k)} · ${esc(shortCls(k.classification))}</div></div><span class="chip">${esc(k.endReason || 'Encerrado')}</span></summary>
      <div class="body"><table class="bk"><tbody>
        <tr><td>Classificação</td><td>${esc(k.classification)}</td></tr><tr><td>Operação</td><td>${esc(k.operation)}</td></tr>
        <tr><td>Remuneração</td><td>${esc(payFormShort(k.terms))}</td></tr><tr><td>Tipo fiscal</td><td>${taxTypeFor(k.classification) === '1099' ? '1099 (autônomo)' : 'W-2 (empregado)'}</td></tr>
        <tr><td>Combustível / pedágio / hotel</td><td>${['fuel', 'tolls', 'hotel'].map(x => k.terms.expenses[x] === 'company' ? 'empresa' : 'motorista').join(' / ')}</td></tr>
        <tr><td>Caminhão</td><td>${esc(k.truck || '—')}</td></tr><tr><td>Viagens</td><td>${tripsOfContract(k.id).length}</td></tr>
      </tbody></table>${tripsOfContract(k.id).length ? '' : `<div class="row"><button class="btn sm danger" data-delct="${esc(k.id)}">Excluir contrato</button></div>`}</div></details>`).join('')}` : ''}`;
}

function contractEditor(c) {
  const i = S.contracts.indexOf(c), P = `contracts.${i}`, T = `${P}.terms`, tm = c.terms, k = tm.contract, X = k.extras, L = S.settings.lists;
  const pk = E.presetKeyFor(c.classification), w2 = taxTypeFor(c.classification) === 'w2';
  const exp = EXPERIENCE.find(e => e[0] === S.profile.experience) || EXPERIENCE[0];
  const payer = (key, label) => F.sel(`${T}.expenses.${key}`, label, [['company', 'Empresa paga'], ['driver', 'Motorista paga']]);
  const ex = tm.expenses, who = x => ex[x] === 'company' ? 'empresa' : 'motorista';
  const extras = [X.layoverOn && `layover ${fmt(X.layoverRate)}/dia`, X.breakdownOn && `quebra ${fmt(X.breakdownRate)}/h`, X.tarpOn && `lona ${fmt(X.tarpRate)}`].filter(Boolean);
  const B = tm.benefits;
  return `
  ${mod('Vínculo', 'Com quem e como o motorista trabalha.', null,
    F.sel(`${P}.companyId`, 'Empresa contratante', S.companies.map(co => [co.id, co.name]), { full: true }) +
    F.sel(`${P}.classification`, 'Classificação do vínculo', CLASSIFICATIONS.map(x => [x, x]), { full: true }) +
    F.sel(`${P}.operation`, 'Especificação da operação', L.operation.map(x => [x, x])) +
    hint(`Tipo fiscal: <b>${w2 ? 'W-2, empregado' : '1099, autônomo'}</b>, definido pela classificação.`) +
    F.num(`${P}.startDay`, 'Início do contrato (dia do jogo)', { step: 1 }) + F.num(`${P}.renomeLevel`, 'Renome na empresa', { step: 1 }) +
    F.text(`${P}.truck`, 'Caminhão', { ph: 'Modelo do caminhão' }) + F.text(`${P}.trailer`, 'Trailer', { ph: 'Modelo do trailer' }) +
    `<div class="full row"><button class="btn" data-ctpreset="${pk}">Restaurar condições padrão de ${esc(E.PRESETS[pk])}</button></div>`,
    `${shortCls(c.classification)} · ${c.operation}`)}
  ${mod('Remuneração', PAY_HELP[k.mode] || '', null,
    F.sel(`${T}.contract.mode`, 'Forma de pagamento', PAY_FORMS, { full: true }) +
    (k.mode === 'weekly' ? F.num(`${T}.contract.weekly.value`, 'Valor fixo por semana', { money: true }) +
      toggleNum(`${T}.contract.weekly.commissionOn`, `${T}.contract.weekly.commission`, 'Comissão sobre o frete', { pct: true }) : '') +
    (k.mode === 'hourly' ? F.num(`${T}.contract.hourly.rate`, 'Valor por hora', { money: true, hint: 'Mercado local 2026: $22–32/h.' }) +
      toggleNum(`${T}.contract.hourly.commissionOn`, `${T}.contract.hourly.commission`, 'Comissão sobre o frete', { pct: true }) +
      toggleNum(`${T}.contract.hourly.dailyCapOn`, `${T}.contract.hourly.dailyCap`, 'Máximo de horas pagas por dia', { hint: 'Padrão local: 10h (FMCSA permite até 14h de jornada).' }) +
      toggleNum(`${T}.contract.hourly.weeklyCapOn`, `${T}.contract.hours`, 'Máximo de horas pagas por semana', { hint: 'Contrato padrão: 50h.' }) +
      toggleNum(`${T}.contract.hourly.overtimeOn`, `${T}.contract.hourly.otAfter`, 'Hora extra após (horas na semana)', { hint: 'Motoristas são isentos de hora extra pela FLSA; ligue só se a empresa paga.' }) +
      (k.hourly.overtimeOn ? F.num(`${T}.contract.hourly.otMult`, 'Multiplicador da hora extra') : '') : '') +
    (k.mode === 'cpm' ? F.num(`${T}.contract.cpm.rate`, 'Valor por milha', { money: true, hint: `Faixa para ${esc(exp[1].toLowerCase())}: ${fmt(exp[2])}–${fmt(exp[3])}/mi.` }) +
      `<div class="field" style="justify-content:end"><button class="btn" data-act="suggest-cpm">Usar CPM da experiência (${fmt((exp[2] + exp[3]) / 2)})</button></div>` +
      toggleNum(`${T}.contract.cpm.detentionOn`, `${T}.contract.cpm.detentionRate`, 'Detention: por hora de espera', { money: true, hint: 'Mercado: $15–25/h.' }) +
      (k.cpm.detentionOn ? F.num(`${T}.contract.cpm.detentionFree`, 'Horas livres antes do detention') : '') +
      toggleNum(`${T}.contract.cpm.stopOn`, `${T}.contract.cpm.stopRate`, 'Stop pay: por parada extra', { money: true, hint: 'Mercado: $25–75.' }) +
      toggleNum(`${T}.contract.cpm.commissionOn`, `${T}.contract.cpm.commission`, 'Comissão sobre o frete', { pct: true }) : '') +
    (k.mode === 'percent' ? F.num(`${T}.contract.percent.commission`, 'Percentual do frete para o motorista', { pct: true, hint: 'Empresa: 25–30%. Lease e owner-operator recebem a maior parte, mas pagam o caminhão.' }) : '') +
    (k.mode !== 'weekly' ? toggleNum(`${T}.contract.minimum.on`, `${T}.contract.minimum.value`, 'Mínimo garantido por semana', { money: true, hint: 'Comum: $1.100–1.500.' }) : ''),
    payFormShort(tm) + (k.mode !== 'weekly' && k.minimum.on ? ` · mínimo ${fmt(k.minimum.value)}` : ''))}
  ${mod('Pagamentos extras', 'Acessoriais pagos pela empresa, lançados em cada viagem.', null,
    toggleNum(`${T}.contract.extras.layoverOn`, `${T}.contract.extras.layoverRate`, 'Layover: por dia parado', { money: true, hint: 'Mercado: $75–300/dia.' }) +
    toggleNum(`${T}.contract.extras.breakdownOn`, `${T}.contract.extras.breakdownRate`, 'Breakdown: por hora de quebra', { money: true }) +
    toggleNum(`${T}.contract.extras.tarpOn`, `${T}.contract.extras.tarpRate`, 'Tarp pay: por carga com lona', { money: true, hint: 'Só em flatbed: $50–100.' }),
    extras.join(' · ') || 'Nenhum')}
  ${mod('Bônus da empresa', 'Renome e programa de segurança.', null,
    toggleNum(`${T}.renome.on`, `${T}.renome.perLevel`, 'Bônus por nível de renome', { pct: true, hint: `Nível ${c.renomeLevel || 1} × ${fmtN(tm.renome.perLevel)}% = ${fmtN(E.n(tm.renome.perLevel) * Math.max(1, E.n(c.renomeLevel) || 1))}% sobre salário base e comissão.` }) +
    (toggleNum(`${T}.safety.on`, `${T}.safety.amount`, 'Bônus de segurança', { money: true, hint: 'Pago ao completar as semanas seguidas sem multa nem dano.' }) +
      (tm.safety.on ? F.num(`${T}.safety.weeks`, 'Semanas seguidas', { step: 1, hint: '13 semanas = um trimestre.' }) : '')),
    [tm.renome.on && `renome ${fmtN(E.n(tm.renome.perLevel) * Math.max(1, E.n(c.renomeLevel) || 1))}%`, tm.safety.on && `segurança ${fmt(tm.safety.amount)} a cada ${tm.safety.weeks} semanas`].filter(Boolean).join(' · ') || 'Nenhum')}
  ${`
  ${mod('Quem paga cada despesa', 'Despesas das viagens de caminhão neste contrato.', null,
    payer('fuel', 'Combustível') + payer('tolls', 'Pedágios') + payer('hotel', 'Hotel') + payer('fines', 'Multas de trânsito') +
    F.sel(`${T}.expenses.damage`, 'Danos à carga e ao caminhão', [['deductible', 'Motorista paga a franquia'], ['driver', 'Motorista paga tudo'], ['company', 'Empresa paga']]) +
    (ex.damage === 'deductible' ? F.num(`${T}.expenses.deductible`, 'Franquia por ocorrência', { money: true, hint: 'Comum: $500–1.000.' }) : ''),
    `Combustível: ${who('fuel')} · pedágio: ${who('tolls')} · hotel: ${who('hotel')} · danos: ${ex.damage === 'deductible' ? 'franquia ' + fmt(ex.deductible) : ex.damage === 'company' ? 'empresa' : 'motorista'}`)}
  ${mod('Benefícios e per diem', 'Descontados do contracheque ou pagos sem imposto.', null,
    toggleNum(`${T}.benefits.healthOn`, `${T}.benefits.health`, 'Plano de saúde por semana', { money: true }) +
    toggleNum(`${T}.benefits.k401On`, `${T}.benefits.k401Pct`, '401(k) · aposentadoria', { pct: true }) +
    toggleNum(`${T}.perDiem.on`, `${T}.perDiem.rate`, 'Per diem por noite fora de casa', { money: true, hint: 'IRS 2026: $80/dia. Marque "Dormiu fora de casa" na viagem.' }),
    [B.healthOn && `saúde ${fmt(B.health)}/sem`, B.k401On && `401(k) ${fmtN(B.k401Pct)}%`, tm.perDiem.on && `per diem ${fmt(tm.perDiem.rate)}`].filter(Boolean).join(' · ') || 'Nenhum')}
  ${mod('Custos operacionais do caminhão', 'Para lease e owner-operator, que pagam o próprio caminhão.', `${T}.opCosts.on`,
    F.num(`${T}.opCosts.maintenance`, 'Manutenção por milha', { money: true, hint: 'ATRI 2025: $0,404/mi.' }) +
    F.num(`${T}.opCosts.tires`, 'Pneus por milha', { money: true, hint: 'ATRI 2025: $0,05/mi.' }) +
    F.num(`${T}.opCosts.insurance`, 'Seguro por milha', { money: true }) +
    F.num(`${T}.opCosts.truckWeekly`, 'Parcela ou leasing por semana', { money: true }) +
    F.num(`${T}.opCosts.otherWeekly`, 'Licenças, IFTA, ELD e escrow por semana', { money: true }),
    tm.opCosts.on ? `${fmt(E.n(tm.opCosts.maintenance) + E.n(tm.opCosts.tires) + E.n(tm.opCosts.insurance))}/mi + ${fmt(E.n(tm.opCosts.truckWeekly) + E.n(tm.opCosts.otherWeekly))}/semana` : (w2 ? 'Desligado: o caminhão é da empresa' : 'Desligado'))}`}`;
}

function companyForm(id) {
  const co = id ? S.companies.find(x => x.id === id) : { name: '', hq: '', dot: '', notes: '' };
  openModal(`<div class="row between"><h2>${id ? 'Editar empresa' : 'Cadastrar empresa'}</h2><button class="btn ghost sm" data-x>Fechar</button></div>
    <div class="grid">
      <div class="field full">${(L => L.row + L.box)(labRow('company.name', 'Nome da empresa', 'co_name'))}<input id="co_name" value="${esc(co.name)}" placeholder="Ex.: ADM Transport"></div>
      <div class="field">${(L => L.row + L.box)(labRow('company.hq', 'Sede (cidade / estado)', 'co_hq'))}<input id="co_hq" value="${esc(co.hq)}" placeholder="Carson City / NV"></div>
      <div class="field">${(L => L.row + L.box)(labRow('company.dot', 'USDOT / MC (opcional)', 'co_dot'))}<input id="co_dot" value="${esc(co.dot)}"></div>
      <div class="field full">${(L => L.row + L.box)(labRow('company.notes', 'Observações', 'co_notes'))}<input id="co_notes" value="${esc(co.notes)}" placeholder="Ex.: frota de reefer, base em Reno"></div>
    </div>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-x>Cancelar</button><button class="btn primary" data-ok>Salvar</button></div>`, sh => {
    sh.querySelectorAll('[data-x]').forEach(b => b.onclick = closeModal);
    sh.querySelector('[data-ok]').onclick = () => {
      const v = k => sh.querySelector('#co_' + k).value.trim();
      if (!v('name')) { toast('Informe o nome da empresa.'); return; }
      commit(st => {
        const data = { name: v('name'), hq: v('hq'), dot: v('dot'), notes: v('notes') };
        if (id) Object.assign(st.companies.find(x => x.id === id), data); else st.companies.push({ id: uid(), ...data });
      });
      closeModal(); toast(id ? 'Empresa atualizada' : 'Empresa cadastrada');
    };
  });
}

function newContractFlow(companyId) {
  const cur = activeContract(), L = S.settings.lists;
  openModal(`<div class="row between"><h2>Trocar de contrato</h2><button class="btn ghost sm" data-x>Fechar</button></div>
    <p class="muted" style="margin:0;font-size:13.5px">O contrato atual com ${esc(companyName(cur))} é encerrado na véspera do início do novo. Viagens já lançadas continuam com as condições antigas.</p>
    <div class="grid">
      <div class="field full">${(L => L.row + L.box)(labRow('nc.co', 'Empresa', 'nc_co'))}<select id="nc_co">${S.companies.map(co => `<option value="${co.id}" ${co.id === (companyId || cur.companyId) ? 'selected' : ''}>${esc(co.name)}</option>`).join('')}<option value="__new">+ Cadastrar nova empresa</option></select></div>
      <div class="field full" id="nc_newbox" hidden><label for="nc_name">Nome da nova empresa</label><input id="nc_name" placeholder="Ex.: Sierra Freight"></div>
      <div class="field full">${(L => L.row + L.box)(labRow('nc.cls', 'Classificação do vínculo', 'nc_cls'))}<select id="nc_cls">${CLASSIFICATIONS.map(x => `<option ${x === cur.classification ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>
      <div class="field">${(L => L.row + L.box)(labRow('nc.op', 'Operação', 'nc_op'))}<select id="nc_op">${L.operation.map(x => `<option ${x === cur.operation ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>
      <div class="field">${(L => L.row + L.box)(labRow('nc.day', 'Início (dia do jogo)', 'nc_day'))}<input id="nc_day" type="number" step="1" value="${S.gameDay}"></div>
      <div class="field full">${(L => L.row + L.box)(labRow('nc.reason', 'Motivo da saída do contrato atual', 'nc_reason'))}<select id="nc_reason">${['Mudança de empresa', 'Promoção / novo vínculo', 'Pedido de demissão', 'Demissão', 'Fim do contrato'].map(x => `<option>${x}</option>`).join('')}</select></div>
      <div class="field full">${(L => L.row + L.box)(labRow('nc.terms', 'Condições do novo contrato'))}
        <label class="inline-opt"><input type="radio" name="nc_terms" value="preset" checked> Padrão da classificação escolhida</label>
        <label class="inline-opt"><input type="radio" name="nc_terms" value="copy"> Copiar as condições do contrato atual</label></div>
    </div>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-x>Cancelar</button><button class="btn primary" data-ok>Iniciar contrato</button></div>`, sh => {
    sh.querySelectorAll('[data-x]').forEach(b => b.onclick = closeModal);
    sh.querySelector('#nc_co').onchange = e => { sh.querySelector('#nc_newbox').hidden = e.target.value !== '__new'; };
    sh.querySelector('[data-ok]').onclick = () => {
      let coId = sh.querySelector('#nc_co').value;
      const newName = sh.querySelector('#nc_name').value.trim();
      if (coId === '__new' && !newName) { toast('Informe o nome da nova empresa.'); return; }
      const cls = sh.querySelector('#nc_cls').value, op = sh.querySelector('#nc_op').value;
      const start = Math.max(1, parseInt(sh.querySelector('#nc_day').value) || S.gameDay);
      const copy = sh.querySelector('input[name="nc_terms"]:checked').value === 'copy';
      const reason = sh.querySelector('#nc_reason').value;
      commit(st => {

// Ações dos botões do bloco. Devolve true quando a ação era daqui.
async function accountAction(a, el) {
  const val = id => (document.getElementById(id) || {}).value || '';
  const busy = async fn => { el.disabled = true; try { await fn(); } catch (e) { toast(e.message || 'Não foi possível concluir.'); } finally { el.disabled = false; } };
  if (a === 'cloud-save') {
    try { cloudSetCfg(val('cloudUrl'), val('cloudKey')); } catch (e) { toast(e.message); return true; }
    store.mode = 'cloud'; await cloudStart(); render(); toast('Servidor salvo. Agora entre ou crie sua conta.'); return true;
  }
  if (a === 'cloud-clear') {
    if (!await confirmBox('Trocar servidor?', 'O endereço e a chave salvos neste navegador são apagados. Seus dados locais continuam.', 'Trocar')) return true;
    await cloudSignOut(); lsSet(CLOUD_LS, null); lsSet(LINK_LS, null); store.mode = 'local'; setSync('local'); render(); return true;
  }
  if (a === 'acc-in' || a === 'acc-up') {
    const email = val('accEmail').trim(), pw = val('accPass');
    if (!/^\S+@\S+\.\S+$/.test(email)) { toast('Informe um e-mail válido.'); return true; }
    if (pw.length < (a === 'acc-up' ? 8 : 1)) { toast(a === 'acc-up' ? 'Use uma senha com pelo menos 8 caracteres.' : 'Informe a senha.'); return true; }
    await busy(async () => {
      if (a === 'acc-in') { await cloudSignIn(email, pw); if (cloud.session) toast('Conta conectada'); }
      else if (await cloudSignUp(email, pw)) toast('Conta criada e conectada');
      else { await confirmBox('Confirme seu e-mail', `Enviamos um link para <b>${esc(email)}</b>. Abra o link e depois volte aqui para entrar.`, 'Entendi'); return; }
      render();
    });
    return true;
  }
  if (a === 'acc-forgot') {
    const email = val('accEmail').trim();
    if (!/^\S+@\S+\.\S+$/.test(email)) { toast('Preencha o e-mail da conta e toque de novo.'); return true; }
    await busy(async () => { await cloudRecover(email); await confirmBox('Veja seu e-mail', `Se existir uma conta com <b>${esc(email)}</b>, enviamos um link para criar uma nova senha. Abra o link neste aparelho.`, 'Entendi'); });
    return true;
  }
  if (a === 'acc-sync') { await busy(async () => { await cloudPoll(); toast(store.status === 'on' ? 'Tudo sincronizado' : (SYNC_TEXT[store.status] || ['', 'Sem conexão'])[1]); }); return true; }
  if (a === 'acc-pass') { newPasswordFlow(); return true; }
  if (a === 'acc-out') {
    if (!await confirmBox('Sair da conta?', 'Os dados continuam neste navegador e na conta. Este aparelho só para de sincronizar até você entrar de novo.', 'Sair')) return true;
    await cloudSignOut(); render(); toast('Você saiu da conta'); return true;
  }
  if (a === 'install') { if (installEvt) { const ev = installEvt; installEvt = null; ev.prompt(); try { await ev.userChoice; } catch (e) {} render(); } return true; }
  return false;
}

/* ---------- Planilha (.xlsx) sem bibliotecas externas ----------
   Leitura: zip (DecompressionStream) + XML. Escrita: zip sem compressão.
   A exportação parte do modelo embutido (61-sheet-model.js) e troca só as células de dados (sheetEdit). */
const XL = (() => {
  const td = new TextDecoder(), te = new TextEncoder();
  async function unzip(buf) {
    const dv = new DataView(buf);
    let eocd = -1;
    for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) throw new Error('not_zip');
    const n = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
    const files = {};
    for (let k = 0; k < n; k++) {
      if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('not_zip');
      const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
      const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true);
      files[td.decode(new Uint8Array(buf, p + 46, nlen))] = { method, csize, lho };
      p += 46 + nlen + elen + clen;
    }
    const read = async name => {
      const f = files[name]; if (!f) return null;
      const start = f.lho + 30 + dv.getUint16(f.lho + 26, true) + dv.getUint16(f.lho + 28, true);
      const data = new Uint8Array(buf, start, f.csize);
      if (f.method === 0) return td.decode(data);
      if (f.method === 8) return td.decode(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
      throw new Error('zip_method');
    };
    return { files, read };
  }
  const xml = s => new DOMParser().parseFromString(s, 'application/xml');
  const tags = (node, name) => Array.from(node.getElementsByTagName(name));
  const colIdx = ref => { let n = 0; for (const ch of ref.replace(/\d+/g, '')) n = n * 26 + (ch.charCodeAt(0) - 64); return n - 1; };
  // Lê o arquivo e devolve { nomeDaAba: [[célula, ...], ...] }
  async function read(buf) {
    const z = await unzip(buf);
    const wbx = await z.read('xl/workbook.xml'); if (!wbx) throw new Error('not_xlsx');
    const rels = {}; const relx = await z.read('xl/_rels/workbook.xml.rels');
    if (relx) tags(xml(relx), 'Relationship').forEach(r => { rels[r.getAttribute('Id')] = r.getAttribute('Target'); });
    const shared = []; const ssx = await z.read('xl/sharedStrings.xml');
    if (ssx) tags(xml(ssx), 'si').forEach(si => shared.push(tags(si, 't').filter(t => t.parentNode.nodeName !== 'rPh').map(t => t.textContent).join('')));
    const out = {};
    for (const sh of tags(xml(wbx), 'sheet')) {
      const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
      let target = rels[rid] || ''; target = target.replace(/^\//, ''); if (!target.startsWith('xl/')) target = 'xl/' + target;
      const sx = await z.read(target); if (!sx) continue;
      const rows = [];
      for (const r of tags(xml(sx), 'row')) {
        const ri = (parseInt(r.getAttribute('r')) || rows.length + 1) - 1, row = [];
        for (const c of tags(r, 'c')) {
          const t = c.getAttribute('t'), v = tags(c, 'v')[0], ci = c.getAttribute('r') ? colIdx(c.getAttribute('r')) : row.length;
          let val = '';
          if (t === 's') val = shared[parseInt(v && v.textContent)] ?? '';
          else if (t === 'inlineStr') val = tags(c, 't').map(x => x.textContent).join('');
          else if (t === 'b') val = v && v.textContent === '1';
          else if (v) val = t === 'str' || t === 'e' ? v.textContent : (isFinite(+v.textContent) ? +v.textContent : v.textContent);
          row[ci] = val;
        }
        rows[ri] = row;
      }
      out[sh.getAttribute('name')] = Array.from(rows, r => Array.from(r || [], x => x ?? ''));
    }
    return out;
  }
  /* --- escrita --- */
  const crcT = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = crcT[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  function zip(entries) {
    const parts = [], central = []; let off = 0;
    for (const [name, text] of entries) {
      const nb = te.encode(name), data = te.encode(text), crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(8, 0, true); lh.setUint32(14, crc, true);
      lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, nb.length, true);
      parts.push(new Uint8Array(lh.buffer), nb, data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint32(16, crc, true);
      ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, nb.length, true); ch.setUint32(42, off, true);
      central.push(new Uint8Array(ch.buffer), nb);
      off += 30 + nb.length + data.length;
    }
    const cdSize = central.reduce((a, b) => a + b.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, off, true);
    const all = [...parts, ...central, new Uint8Array(end.buffer)];
    const out = new Uint8Array(all.reduce((a, b) => a + b.length, 0)); let p = 0;
    for (const b of all) { out.set(b, p); p += b.length; }
    return out;
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const unesc = s => String(s).replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&amp;/g, '&');
  const colName = i => { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
  const b64 = str => { const bin = atob(str), out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out.buffer; };
  // Abre um .xlsx e devolve { files: Map(caminho → texto), sheets: { nomeDaAba: caminho } }
  async function open(buf) {
    const z = await unzip(buf), files = new Map();
    for (const name of Object.keys(z.files)) files.set(name, await z.read(name));
    const rels = {};
    for (const m of (files.get('xl/_rels/workbook.xml.rels') || '').matchAll(/<Relationship\b[^>]*>/g)) rels[m[0].match(/\bId="([^"]+)"/)[1]] = 'xl/' + m[0].match(/\bTarget="([^"]+)"/)[1].replace(/^\/?(xl\/)?/, '');
    const sheets = {};
    for (const m of (files.get('xl/workbook.xml') || '').matchAll(/<sheet\b[^>]*>/g)) sheets[unesc(m[0].match(/\bname="([^"]+)"/)[1])] = rels[m[0].match(/\br:id="([^"]+)"/)[1]];
    return { files, sheets };
  }
  const save = files => zip([...files]);
  /* Editor de uma aba: troca valores mantendo o estilo de cada célula.
     Valores: número, texto, { f: 'fórmula' } ou null (célula vazia com estilo). */
  function sheetEdit(xmlText) {
    const m = xmlText.match(/<sheetData>([\s\S]*?)<\/sheetData>|<sheetData\/>/);
    const head = xmlText.slice(0, m.index); let tail = xmlText.slice(m.index + m[0].length);
    const rows = new Map();
    for (const r of (m[1] || '').matchAll(/<row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/row>)/g)) {
      const n = +r[1].match(/\br="(\d+)"/)[1], cells = new Map();
      for (const c of (r[2] || '').matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)) {
        const ref = c[1].match(/\br="([A-Z]+)\d+"/)[1], s = c[1].match(/\bs="(\d+)"/), t = c[1].match(/\bt="([^"]+)"/);
        cells.set(colIdx(ref), { s: s ? s[1] : null, t: t ? t[1] : null, body: c[2] || '' });
      }
      rows.set(n, { attrs: r[1].replace(/\s*\br="\d+"/, '').replace(/\s*\bspans="[^"]*"/, '').trim(), cells });
    }
    const split = ref => { const x = ref.match(/^([A-Z]+)(\d+)$/); return [colIdx(x[1]), +x[2]]; };
    const row = n => { if (!rows.has(n)) rows.set(n, { attrs: '', cells: new Map() }); return rows.get(n); };
    const api = {
      style(ref) { const [c, r] = split(ref), cell = rows.get(r) && rows.get(r).cells.get(c); return cell ? cell.s : null; },
      set(ref, v, s) {
        const [c, r] = split(ref), R = row(r), old = R.cells.get(c), st = s !== undefined ? s : old ? old.s : null;
        if (v === null || v === undefined || v === '') R.cells.set(c, { s: st, t: null, body: '' });
        else if (typeof v === 'number') R.cells.set(c, { s: st, t: null, body: `<v>${v}</v>` });
        else if (typeof v === 'object') R.cells.set(c, { s: st, t: null, body: `<f>${esc(v.f)}</f>` });
        else R.cells.set(c, { s: st, t: 'inlineStr', body: `<is><t xml:space="preserve">${esc(v)}</t></is>` });
        return api;
      },
      // copia altura e estilos de uma linha para outra, sem os valores
      cloneRow(from, to) { const F = rows.get(from); if (!F) return api; rows.set(to, { attrs: F.attrs, cells: new Map([...F.cells].map(([c, x]) => [c, { s: x.s, t: null, body: '' }])) }); return api; },
      dropFrom(n, to = Infinity) { for (const k of [...rows.keys()]) if (k >= n && k <= to) rows.delete(k); return api; },
      tail(fn) { tail = fn(tail); return api; },
      // validações de lista que começam na linha `first` passam a cobrir até a linha `last`
      extendValidations(first, last) {
        tail = tail.replace(/(<dataValidation\b[^>]*\bsqref=")([^"]+)(")/g, (all, a, sq, z) => {
          const t = sq.split(' ')[0].match(/^([A-Z]+)(\d+)(?::([A-Z]+)\d+)?$/); if (!t || +t[2] !== first) return all;
          return `${a}${t[1]}${first}:${t[3] || t[1]}${last}${z}`;
        });
        return api;
      },
      xml() {
        const body = [...rows.keys()].sort((a, b) => a - b).map(n => {
          const R = rows.get(n), cs = [...R.cells.keys()].sort((a, b) => a - b).map(c => { const x = R.cells.get(c), at = `r="${colName(c)}${n}"${x.s !== null ? ` s="${x.s}"` : ''}${x.t ? ` t="${x.t}"` : ''}`; return x.body ? `<c ${at}>${x.body}</c>` : `<c ${at}/>`; }).join('');
          return `<row r="${n}"${R.attrs ? ' ' + R.attrs : ''}>${cs}</row>`;
        }).join('');
        return `${head}<sheetData>${body}</sheetData>${tail}`;
      }
    };
    return api;
  }
  return { read, open, save, sheetEdit, b64, colName };
})();

/* ---------- Importar / exportar planilha no modelo "Carreira Realista ATS" ----------
   O modelo é a planilha original da carreira, com 9 abas. O app lê e escreve exatamente esse desenho:
     Config                 custos de refeição, hotel, moradia e % do carro emprestado
     Parametros             lista de cidades
     Motorista & Carreira   motorista, saldo, empréstimo, contrato e empresa
     Diário de bordo        viagens de caminhão da semana em aberto
     Dashboard & DRE        fórmulas da planilha (o app só preenche o pay lag)
     Histórioco holerite    holerites pagos e a pagar
     Historico de fretes    viagens de caminhão das semanas fechadas, com "Final de semana" entre elas
     Diário de bordo carro  todas as viagens de carro
     Dashboard carro        fórmulas da planilha, uma linha por viagem de carro
   A exportação parte do modelo embutido (61-sheet-model.js) e troca só as células de dados. */
const SM = {
  config: 'Config', params: 'Parametros', driver: 'Motorista & Carreira', diary: 'Diário de bordo', dre: 'Dashboard & DRE',
  pay: 'Histórioco holerite', hist: 'Historico de fretes', car: 'Diário de bordo carro', carDre: 'Dashboard carro',
  first: 5,          // primeira linha de dados das tabelas
  minRows: 20,       // linhas já formatadas que o diário leva, mesmo vazio
  weekend: 'Final de semana',
  // opções das listas da planilha ↔ valores do app
  cls: { w2: 'Nivel 1: Company Driver (Empregado W-2)', owner: 'Nível 2: Owner-Operator Lease-On (Agregado - 1099)', authority: 'Nível 3: Independent Owner-Operator (Autônomo com Autoridade Própria)' },
  pay_: { weekly: 'Pagamento fixo semanal', hourly: 'Valor por Hora', cpm: 'Por distância percorrida', percent: 'Percentual do frete' },
  opLocal: 'Local/Dedicated', opOtr: 'OTR (Over the Road)',
  carOwned: 'Carro próprio', carBorrowed: 'Carro Emprestado',
  truckPh: 'Modelo do caminhão', trailerPh: 'Modelo do trailer',
  commissionF: '5% + INT((C5 - 1) / 2) * 1%',
  diaryCols: ['Dia do jogo', 'Origem', 'Destino', 'Status da Entrega', 'Distância (mi)', 'Frete Bruto (USD)', 'Combustível (USD)', 'Pedágios (USD)', 'Cafés Da Manhã', 'Almoços', 'Janta', 'Diárias', 'Multas / Danos (USD)'],
  carCols: ['ID Viagem', 'Dia do jogo', 'Origem', 'Destino', 'Tipo do trabalho', 'Status da Entrega', 'Distância (mi)', 'Frete Bruto (USD)', 'Bonus (USD)', 'Combustível (USD)', 'Pedágios (USD)', 'Cafés Da Manhã', 'Almoços', 'Janta', 'Diárias', 'Multas / Danos (USD)'],
  required: ['Dia do jogo', 'Destino', 'Distância (mi)', 'Frete Bruto (USD)']
};
const normTxt = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
function parseNum(v) {
  if (typeof v === 'number') return isFinite(v) ? v : NaN;
  let s = String(v ?? '').replace(/[$\s]/g, '').replace(/usd/i, '');
  if (!s) return null;
  if (s.includes(',') && s.includes('.')) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (s.includes(',')) s = s.replace(',', '.');
  const n = Number(s); return isFinite(n) ? n : NaN;
}
// Percentuais vêm como fração (0,05) ou como texto ("5%"); o app guarda em pontos (5)
function parsePct(v) {
  if (typeof v === 'string' && v.includes('%')) return parseNum(v.replace('%', ''));
  const n = parseNum(v); return n === null || isNaN(n) ? n : Math.abs(n) <= 1 ? E.r2(n * 100) : n;
}

/* ---------- Leitura: planilha → dados ---------- */
// Lê e valida a planilha. Devolve { ok, errors[], data }
function parseCareerSheet(book) {
  const errors = [];
  const find = name => { const k = Object.keys(book).find(x => normTxt(x) === normTxt(name)); return k ? book[k] : null; };
  const drv = find(SM.driver), diary = find(SM.diary);
  const missing = [[SM.driver, drv], [SM.diary, diary]].filter(x => !x[1]).map(x => `"${x[0]}"`);
  if (missing.length) return { ok: false, errors: [`Faltam as abas ${missing.join(' e ')}. Use a planilha no modelo Carreira Realista ATS, sem renomear as abas. Abas encontradas: ${Object.keys(book).join(', ') || 'nenhuma'}.`] };
  const num = (v, where, { req = false, int = false, min = null, pct = false } = {}) => {
    const n = pct ? parsePct(v) : parseNum(v);
    if (n === null) { if (req) errors.push(`${where}: campo obrigatório vazio.`); return null; }
    if (isNaN(n)) { errors.push(`${where}: "${v}" não é um número.`); return null; }
    if (int && !Number.isInteger(n)) { errors.push(`${where}: use um número inteiro (recebido ${v}).`); return null; }
    if (min !== null && n < min) { errors.push(`${where}: o valor mínimo é ${min} (recebido ${v}).`); return null; }
    return n;
  };
  const txt = v => String(v ?? '').trim();

  /* Motorista & Carreira: cada título tem o valor na célula logo abaixo */
  const below = {};
  drv.forEach((row, r) => (row || []).forEach((cell, c) => { const k = normTxt(cell); if (k && typeof cell === 'string' && !(k in below)) below[k] = { v: (drv[r + 1] || [])[c], ref: XL.colName(c) + (r + 2) }; }));
  const F = label => below[normTxt(label)] || null;
  const val = label => { const f = F(label); return f ? f.v : undefined; };
  const at = label => `${SM.driver} › ${label}${F(label) ? ` (${F(label).ref})` : ''}`;
  for (const label of ['Nome Do Motorista', 'Saldo Bancario (USD)', 'Classificação do Vínculo', 'Nome da Empresa'])
    if (!F(label)) errors.push(`${SM.driver}: não achei o título "${label}". Os títulos do modelo não podem ser alterados.`);
  const balanceV = F('Saldo Bancario (USD)') ? num(val('Saldo Bancario (USD)'), at('Saldo Bancario (USD)'), { req: true }) : null;
  const level = num(val('Capacitação (Nivel do Motorista no Jogo)'), at('Capacitação (Nivel do Motorista no Jogo)'), { int: true, min: 1 }) || 1;
  const loanTotal = num(val('Emprestimo Total / Parcelas (USD)'), at('Emprestimo Total / Parcelas (USD)'), { min: 0 }) || 0;
  const loanInst = num(val('Emprestimo Parcelas (USD)'), at('Emprestimo Parcelas (USD)'), { min: 0 }) || 0;
  const coName = txt(val('Nome da Empresa'));
  if (F('Nome da Empresa') && !coName) errors.push(`${at('Nome da Empresa')}: campo obrigatório vazio.`);
  const clsRaw = normTxt(val('Classificação do Vínculo'));
  const clsKey = !clsRaw ? null : clsRaw.includes('frota') || clsRaw.includes('fleet') ? 'fleet' : clsRaw.includes('autoridade') || clsRaw.includes('independent') || clsRaw.includes('mc/dot') ? 'authority'
    : clsRaw.includes('lease operator') || clsRaw.includes('arrendat') ? 'lease' : clsRaw.includes('owner') || clsRaw.includes('1099') || clsRaw.includes('agregado') ? 'owner'
    : clsRaw.includes('w-2') || clsRaw.includes('w2') || clsRaw.includes('company') || clsRaw.includes('empregado') ? 'w2' : null;
  if (F('Classificação do Vínculo') && !clsRaw) errors.push(`${at('Classificação do Vínculo')}: campo obrigatório vazio. Escolha uma opção da lista.`);
  else if (clsRaw && !clsKey) errors.push(`${at('Classificação do Vínculo')}: "${val('Classificação do Vínculo')}" não é reconhecida. Escolha uma opção da lista.`);
  const opRaw = normTxt(val('Especificações da Operação')), OPS = E.OPERATIONS;
  const operation = !opRaw || opRaw.startsWith('local') || opRaw.includes('day cab') ? OPS[0] : opRaw.startsWith('regional') ? OPS[1] : opRaw.startsWith('dedic') ? OPS[2] : opRaw.includes('otr') || opRaw.includes('long') || opRaw.includes('sleeper') ? OPS[3] : null;
  if (opRaw && !operation) errors.push(`${at('Especificações da Operação')}: "${val('Especificações da Operação')}" não é reconhecida. Use ${SM.opLocal} ou ${SM.opOtr}.`);
  const payRaw = normTxt(val('Forma de Pagamento'));
  const payMode = !payRaw ? null : payRaw.includes('fixo') || payRaw.includes('semanal') ? 'weekly' : payRaw.includes('hora') ? 'hourly' : payRaw.includes('distancia') || payRaw.includes('milha') || payRaw.includes('cpm') ? 'cpm' : payRaw.includes('percent') || payRaw.includes('%') ? 'percent' : 'bad';
  if (payMode === 'bad') errors.push(`${at('Forma de Pagamento')}: "${val('Forma de Pagamento')}" não é reconhecida. Escolha uma opção da lista.`);
  const baseV = num(val('Valor (USD)'), at('Valor (USD)'), { min: 0 });
  const commV = num(val('Comissão'), at('Comissão'), { min: 0, pct: true });
  const hours = num(val('Horas de Trabalho Contratual (Horas por Semanal)'), at('Horas de Trabalho Contratual (Horas por Semanal)'), { min: 0 });
  const renomeLevel = num(val('Renome na Empresa'), at('Renome na Empresa'), { int: true, min: 1 }) || 1;
  const renomePct = num(val('Bonus Por Renome'), at('Bonus Por Renome'), { min: 0, pct: true }) || 0;
  const model = (v, ph) => normTxt(v) === normTxt(ph) ? '' : txt(v);

  /* Config e Parametros (opcionais): custos e cidades */
  const cfg = find(SM.config), costs = {}; let borrowedPct = null;
  if (cfg) {
    const row = key => cfg.find(r => r && normTxt(r[0]).includes(key));
    const cost = (key, name, label) => { const r = row(key); if (!r) return; const n = num(r[1], `${SM.config} › ${label}`, { min: 0 }); if (n !== null) costs[name] = n; };
    cost('cafe da manha', 'breakfast', 'Alimentação - Café da Manhã'); cost('almoco', 'lunch', 'Alimentação - Almoço'); cost('jantar', 'dinner', 'Alimentação - Jantar');
    cost('pernoite', 'hotel', 'Diária de Pernoite / Hotel'); cost('moradia', 'housing', 'Moradia / Custo de Vida Fixo');
    const b = row('carro emprestado'); if (b) borrowedPct = num(b[1], `${SM.config} › Porcentagem comissão frete carro emprestado`, { min: 0, pct: true });
  }
  const par = find(SM.params), cities = par ? [...new Set(par.slice(1).map(r => txt(r && r[0])).filter(Boolean))] : [];

  /* Histórioco holerite (opcional): diz quais semanas já foram pagas */
  const payRows = find(SM.pay), pays = [];
  if (payRows) {
    const hr = payRows.findIndex(r => r && r.some(c => normTxt(c) === 'status pagamento'));
    if (hr >= 0) {
      const head = payRows[hr].map(normTxt), ci = k => head.findIndex(h => h.includes(k)), cRef = ci('semana trabalhada'), cSt = ci('status pagamento'), cPaid = ci('dia do pagamento');
      payRows.slice(hr + 1).forEach(r => {
        const ref = r && cRef >= 0 ? String(r[cRef] ?? '').match(/\d+/) : null, stt = normTxt(r && r[cSt]); if (!ref || !stt) return;
        const pd = cPaid >= 0 ? parseNum(r[cPaid]) : null;
        pays.push({ day: +ref[0], paid: stt === 'pago', paidDay: pd && !isNaN(pd) ? pd : null });
      });
    }
  }

  /* Tabelas de viagens: colunas achadas pelo título, em qualquer ordem */
  const readTrips = (name, rows, cols, car) => {
    const out = []; if (!rows) return out;
    const hr = rows.findIndex(r => r && r.some(c => normTxt(c) === 'dia do jogo'));
    if (hr < 0) { errors.push(`${name}: não achei a linha de títulos (com "Dia do jogo").`); return out; }
    const head = rows[hr].map(normTxt), col = {};
    cols.forEach(h => { const i = head.indexOf(normTxt(h)); if (i >= 0) col[h] = i; });
    const miss = SM.required.filter(h => col[h] === undefined);
    if (miss.length) { errors.push(`${name}: faltam as colunas ${miss.map(x => `"${x}"`).join(', ')} na linha ${hr + 1}. Colunas encontradas: ${rows[hr].filter(Boolean).join(', ') || 'nenhuma'}.`); return out; }
    rows.slice(hr + 1).forEach((r, i) => {
      const line = hr + 2 + i, cell = h => col[h] === undefined || !r ? '' : r[col[h]];
      const filled = h => { const v = cell(h); return v !== '' && v != null; };
      if (!r || !['Dia do jogo', 'Destino', 'Distância (mi)', 'Frete Bruto (USD)'].some(filled)) return;        // linha vazia
      if (typeof cell('Dia do jogo') === 'string' && isNaN(parseNum(cell('Dia do jogo'))) && !filled('Frete Bruto (USD)')) return;   // "Final de semana" e outras anotações
      const where = h => `${name} › linha ${line} › ${h}`;
      const day = num(cell('Dia do jogo'), where('Dia do jogo'), { req: true, int: true, min: 1 });
      const dest = txt(cell('Destino')); if (!dest) errors.push(`${where('Destino')}: campo obrigatório vazio.`);
      const stRaw = txt(cell('Status da Entrega')), stN = normTxt(stRaw);
      const status = !stRaw ? 'Excelente' : E.STATUSES.find(x => normTxt(x) === stN) || E.STATUS_OLD[Object.keys(E.STATUS_OLD).find(k => normTxt(k) === stN)];
      if (stRaw && !status) errors.push(`${where('Status da Entrega')}: "${stRaw}" não é válido. Use ${E.STATUSES.join(', ')}.`);
      const tRaw = normTxt(cell('Tipo do trabalho'));
      if (car && tRaw && !tRaw.includes('carro')) errors.push(`${where('Tipo do trabalho')}: "${cell('Tipo do trabalho')}" não é válido. Use ${SM.carBorrowed} ou ${SM.carOwned}.`);
      const n = (h, int = false) => num(cell(h), where(h), { req: SM.required.includes(h), int, min: h === 'Bonus (USD)' ? null : 0 }) ?? 0;
      out.push({ id: uid(), day: day || 1, type: car ? 'borrowed' : 'company', carMode: tRaw.includes('propri') ? 'owned' : 'borrowed', origin: txt(cell('Origem')), dest, status: status || 'Excelente',
        miles: n('Distância (mi)'), freight: n('Frete Bruto (USD)'), bonus: car ? n('Bonus (USD)') : 0, fuel: n('Combustível (USD)'), tolls: n('Pedágios (USD)'), fines: n('Multas / Danos (USD)'), damage: 0,
        breakfast: n('Cafés Da Manhã', true), lunch: n('Almoços', true), dinner: n('Janta', true), hotel: n('Diárias', true), drive: 0, hours: 0,
        detention: 0, stops: 0, layover: 0, breakdown: 0, tarp: false, brk: false, away: false });
    });
    return out;
  };
  const open = readTrips(SM.diary, diary, SM.diaryCols, false), past = readTrips(SM.hist, find(SM.hist), SM.diaryCols, false), cars = readTrips(SM.car, find(SM.car), SM.carCols, true);
  // Uma viagem repetida no diário e no histórico de fretes entra uma vez só
  const key = t => [t.day, t.origin, t.dest, t.miles, t.freight].join('|'), seen = new Map();
  open.forEach(t => seen.set(key(t), (seen.get(key(t)) || 0) + 1));
  const trips = [...open, ...past.filter(t => { const k = key(t), c = seen.get(k) || 0; if (c > 0) { seen.set(k, c - 1); return false; } return true; }), ...cars].sort((a, b) => a.day - b.day);
  // A planilha não guarda o dia atual: vale o dia da última viagem lançada
  const gameDay = trips.length ? Math.max(...trips.map(t => t.day)) : 1;

  return { ok: !errors.length, errors, data: {
    profile: { name: txt(val('Nome Do Motorista')), nationality: txt(val('Nacionalidade')), level },
    balance: balanceV, gameDay, day1: 0, company: { name: coName, hq: txt(val('Garagem Sede / Estado / País')) }, clsKey, operation, payMode, baseV, commV, startV: 1, trips,
    extras: { costs, borrowedPct, cities, pays, loanTotal, loanInst, hours, renomeLevel, renomePct, truck: model(val('Caminhão Fixo (Emprestado)'), SM.truckPh), trailer: model(val('Trailer Fixo (Emprestado)'), SM.trailerPh) } } };
}

// Monta o estado completo do app a partir dos dados lidos (cálculos refeitos com as regras atuais)
function buildFromSheet(D) {
  const st = newCareer({ name: D.profile.name, nationality: D.profile.nationality, level: D.profile.level, company: D.company.name, hq: D.company.hq,
    clsKey: D.clsKey, operation: D.operation, gameDay: D.gameDay, day1: D.day1, startDay: D.startV || 1, billedThrough: D.gameDay });
  st.career.startDay = 1;
  const ct = activeContract(st);
  const k = ct.terms.contract;
  if (D.payMode) k.mode = D.payMode;
  if (D.baseV !== null && D.baseV !== undefined) { if (k.mode === 'weekly') k.weekly.value = D.baseV; else if (k.mode === 'hourly') k.hourly.rate = D.baseV; else if (k.mode === 'cpm') k.cpm.rate = D.baseV; else k.percent.commission = D.baseV; }
  if (k.mode === 'percent' && D.commV > 0 && !D.baseV) k.percent.commission = D.commV;
  if (D.commV !== null && D.commV !== undefined && (k.mode === 'weekly' || k.mode === 'hourly')) { k[k.mode].commissionOn = D.commV > 0; k[k.mode].commission = D.commV; }
  const X = D.extras || {};
  Object.keys(X.costs || {}).forEach(c => { st.settings.costs[c].val = X.costs[c]; });
  if (X.borrowedPct !== null && X.borrowedPct !== undefined) st.settings.borrowed.pct = X.borrowedPct;
  if (X.hours) k.hours = X.hours;
  ct.renomeLevel = X.renomeLevel || 1; ct.truck = X.truck || ''; ct.trailer = X.trailer || '';
  if (X.renomePct > 0) ct.terms.renome = { on: true, perLevel: E.r2(X.renomePct / ct.renomeLevel) };
  if (X.loanTotal > 0) { st.bank.loanTotal = X.loanTotal; st.settings.loan.on = X.loanInst > 0; st.settings.loan.installment = X.loanInst || 0; st.career.loanNext = D.gameDay + loanPeriod(st.settings); }
  const eff = effSettings(st);
  const stamp = t => {
    const o = { ...t }; delete o.carMode;
    if (t.type === 'borrowed') o.car = E.carSnapshot(eff, t.carMode);
    else Object.assign(o, E.snapshotFor('company', eff), { rules: E.rulesSnapshot(eff), contractId: ct.id });
    return o;
  };
  const curStart = E.weekStartOf(D.gameDay, st.settings);
  const all = D.trips.map(stamp);
  st.week = { start: curStart, trips: all.filter(t => t.day >= curStart) };
  const byWeek = {};
  all.filter(t => t.day < curStart).forEach(t => { const w = E.weekStartOf(t.day, st.settings); (byWeek[w] = byWeek[w] || []).push(t); });
  const hist = Object.keys(byWeek).map(Number).sort((a, b) => a - b).map(start => {
    const trips = byWeek[start], d = E.dre(trips, eff), living = E.r2(d.variable.total + d.opCosts.total + d.fixed.total);
    const w = { id: 'w' + start + '-' + uid().slice(0, 4), start, end: start + 6, trips, dre: d, settings: clone(eff), closedDay: start + 7, contractId: ct.id };
    const payday = E.paydayFor(start, eff);
    const p = { id: uid(), weekStart: start, payday, amount: d.takeHome, status: 'pending', breakdown: { gross: d.revenue, ded: d.deductions.total, takeHome: d.takeHome, living, net: d.net, tax: d.taxType, safety: 0 } };
    st.payroll.push(p);
    st.ledger.push({ id: uid(), ref: 'living:' + p.id, day: Math.min(start + 7, D.gameDay), desc: `Despesas e custo de vida · semana ${weekLabel(start).toLowerCase()}`, amount: -living, locked: true });
    // a aba de holerites da planilha manda; sem linha para a semana, vale o calendário do pay lag
    const hp = (X.pays || []).find(x => x.day >= start && x.day <= start + 6);
    if (hp ? hp.paid : payday <= D.gameDay) payEntry(st, p, Math.min(D.gameDay, hp && hp.paidDay ? hp.paidDay : payday));
    trips.filter(t => t.type === 'borrowed').forEach(t => st.ledger.push({ id: uid(), ref: 'trip:' + t.id, day: t.day, desc: borrowedDesc(t), amount: E.borrowedValue(t, eff), locked: true }));
    return w;
  });
  syncBorrowedLedger(st);
  // saldo final = saldo informado na planilha
  st.bank.opening = E.r2(D.balance - st.ledger.reduce((a, e) => a + E.n(e.amount), 0));
  if (X.cities && X.cities.length) st.settings.cities = X.cities.slice();
  st.settings.cities = [...new Set([...st.settings.cities, ...all.flatMap(t => [t.origin, t.dest]).filter(Boolean)])];
  st._rev = Date.now();
  return { state: st, history: hist };
}

/* ---------- Escrita: dados → planilha no modelo ---------- */
// Monta o arquivo .xlsx. Sem estado (st = null), devolve o modelo vazio para preencher à mão.
async function buildSheetFile(st, hist) {
  const book = await XL.open(XL.b64(SHEET_MODEL_B64));
  const eff = st ? effSettings(st) : E.defaults(), ct = st ? activeContract(st) : null, co = ct ? companyOf(ct, st) : null;
  const ed = {}; for (const k of ['config', 'params', 'driver', 'diary', 'dre', 'pay', 'hist', 'car', 'carDre']) ed[k] = XL.sheetEdit(book.files.get(book.sheets[SM[k]]));
  const F = SM.first, status = s => { const x = E.STATUS_OLD[s] || s || 'Excelente'; return x === 'Razoável' ? 'Razoável ' : x; };   // a lista da planilha traz "Razoável " com espaço
  const all = st ? [...(hist || []).flatMap(w => w.trips || []), ...st.week.trips] : [];
  const byDay = (a, b) => a.day - b.day;

  /* Config e Parametros */
  const c = eff.costs;
  ed.config.set('B7', E.n(c.breakfast.val)).set('B8', E.n(c.lunch.val)).set('B9', E.n(c.dinner.val)).set('B10', E.n(c.hotel.val)).set('B11', E.n(c.housing.val)).set('B12', E.r2(E.n(eff.borrowed.pct)) / 100);
  const cities = (st ? st.settings.cities : eff.cities) || [], cityStyle = ed.params.style('A2');
  ed.params.dropFrom(2).set('B1', cities[0] || '');
  cities.forEach((x, i) => ed.params.set('A' + (2 + i), x, cityStyle));

  /* Motorista & Carreira */
  if (st) {
    const k = ct.terms.contract, M = k[k.mode], P = st.profile;
    const clsKey = E.presetKeyFor(ct.classification), op = ct.operation || '';
    const comm = k.mode === 'percent' ? E.n(M.commission) : M.commissionOn ? E.n(M.commission) : 0;
    const byLevel = 5 + Math.floor((Math.max(1, E.n(P.level)) - 1) / 2);
    ed.driver.set('A5', P.name || '').set('B5', P.nationality || '').set('C5', Math.max(1, E.n(P.level) || 1)).set('D5', balance(st)).set('E5', E.n(st.bank.loanTotal)).set('F5', st.settings.loan.on ? E.n(st.settings.loan.installment) : 0)
      .set('A7', SM.cls[clsKey] || ct.classification).set('B7', SM.pay_[k.mode]).set('C7', opIsOtr(op) ? SM.opOtr : /^(local|dedic)/i.test(op) ? SM.opLocal : op)
      .set('D7', E.n(k.hours)).set('E7', k.mode === 'weekly' ? E.n(M.value) : k.mode === 'percent' ? 0 : E.n(M.rate)).set('F7', k.mode !== 'percent' && comm === byLevel ? { f: SM.commissionF } : comm / 100)
      .set('A9', co ? co.name || '' : '').set('B9', co ? co.hq || '' : '').set('C9', Math.max(1, E.n(ct.renomeLevel) || 1)).set('D9', E.r2(E.n(eff.renome.on ? eff.renome.pct : 0)) / 100)
      .set('E9', ct.truck || SM.truckPh).set('F9', ct.trailer || SM.trailerPh);
  } else ed.driver.set('C5', 1).set('D5', 0).set('E5', 0).set('F5', 0).set('D7', 50).set('F7', { f: SM.commissionF }).set('C9', 1).set('D9', 0).set('E9', SM.truckPh).set('F9', SM.trailerPh);

  /* Tabelas de viagens: cada linha copia o estilo da linha-modelo */
  const fill = (e, proto, r, vals) => { if (r !== proto) e.cloneRow(proto, r); vals.forEach((v, i) => e.set(XL.colName(i) + r, v)); };
  const truckRow = t => [t.day, t.origin || '', t.dest || '', status(t.status), E.n(t.miles), E.n(t.freight), E.n(t.fuel), E.n(t.tolls), E.n(t.breakfast), E.n(t.lunch), E.n(t.dinner), E.n(t.hotel), E.r2(E.n(t.fines) + E.n(t.damage))];
  // Diário de bordo: caminhão, semana em aberto
  const open = (st ? st.week.trips : []).filter(t => t.type !== 'borrowed').sort(byDay);
  const lastDiary = F + Math.max(open.length, SM.minRows) - 1;
  for (let r = F + 1; r <= lastDiary; r++) ed.diary.cloneRow(F, r);
  open.forEach((t, i) => fill(ed.diary, F, F + i, [...truckRow(t), 'Aberto']));
  ed.diary.extendValidations(F, Math.max(lastDiary, 1003));
  // Histórico de fretes: semanas fechadas, com duas linhas mescladas "Final de semana" depois de cada uma
  const weeks = (hist || []).slice().sort((a, b) => a.start - b.start).map(w => (w.trips || []).filter(t => t.type !== 'borrowed').sort(byDay)).filter(w => w.length);
  const sepStyle = ed.hist.style('A11'), merges = []; let hr = F;
  ed.hist.cloneRow(11, 9001).cloneRow(12, 9002).dropFrom(F + 1, 9000);   // guarda os modelos do separador fora da área usada
  weeks.forEach(w => {
    w.forEach(t => fill(ed.hist, F, hr++, truckRow(t)));
    ed.hist.cloneRow(9001, hr).cloneRow(9002, hr + 1).set('A' + hr, SM.weekend, sepStyle); merges.push(`A${hr}:M${hr + 1}`); hr += 2;
  });
  ed.hist.dropFrom(9001);
  if (merges.length) ed.hist.tail(t => `<mergeCells count="${merges.length}">${merges.map(m => `<mergeCell ref="${m}"/>`).join('')}</mergeCells>` + t);
  ed.hist.extendValidations(F, Math.max(hr, 1000));
  // Diário de bordo carro e Dashboard carro: todas as viagens de carro, uma fórmula por linha
  const cars = all.filter(t => t.type === 'borrowed').sort(byDay);
  const lastCar = F + Math.max(cars.length, SM.minRows) - 1;
  for (let r = F + 1; r <= lastCar; r++) ed.car.cloneRow(F, r);
  cars.forEach((t, i) => fill(ed.car, F, F + i, [i + 1, t.day, t.origin || '', t.dest || '', t.car && t.car.mode === 'owned' ? SM.carOwned : SM.carBorrowed, status(t.status), E.n(t.miles), E.n(t.freight), E.n(t.bonus), E.n(t.fuel), E.n(t.tolls), E.n(t.breakfast), E.n(t.lunch), E.n(t.dinner), E.n(t.hotel), E.r2(E.n(t.fines) + E.n(t.damage))]));
  ed.car.extendValidations(F, Math.max(lastCar, 1000));
  const q = `'${SM.car}'!`, dStyle = 'ABCDEFGHIJKL'.split('').map(x => ed.carDre.style(x + F));
  cars.forEach((t, i) => {
    const r = F + i;
    [`${q}A${r}`, `${q}H${r}`, `${q}I${r}`, `SUM(${q}J${r})`, `SUM(${q}K${r})`, `SUM(${q}L${r}) * (Config!$B$7)`, `SUM(${q}M${r}) * (Config!$B$8)`, `SUM(${q}N${r}) * (Config!$B$9)`, `SUM(${q}O${r}) * (Config!$B$10)`, `${q}P${r}`, `${q}E${r}`,
      `IF(K${r}="${SM.carBorrowed}", (B${r}) * SUM(Config!$B$12)) -J${r}-I${r}-H${r}-G${r}-F${r}-E${r}-D${r}+C${r}`].forEach((f, ci) => ed.carDre.set(XL.colName(ci) + r, { f }, dStyle[ci]));
  });
  ed.carDre.extendValidations(F, Math.max(lastCar, 1000));

  /* Holerites e pay lag */
  const pays = st ? st.payroll.slice().sort((a, b) => a.weekStart - b.weekStart) : [];
  pays.forEach((p, i) => {
    const r = F + i, w = (hist || []).find(x => x.start === p.weekStart), wt = w ? (w.trips || []).filter(t => t.type !== 'borrowed') : [], days = wt.length ? wt.map(t => t.day) : null;
    fill(ed.pay, F, r, [p.payday, p.status === 'paid' ? E.n(p.paidDay) || p.payday : '', days ? `${Math.min(...days)} - ${Math.max(...days)}` : `${p.weekStart} - ${p.weekStart + 6}`, E.r2(p.amount), p.status === 'paid' ? 'Pago' : 'A pagar',
      { f: `IF(E${r}="A pagar", D${r} + '${SM.driver}'!$D$5, IF(E${r}="Pago", "Conta paga", ""))` }]);
  });
  if (!pays.length) ed.pay.set('F' + F, { f: `IF(E${F}="A pagar", D${F} + '${SM.driver}'!$D$5, IF(E${F}="Pago", "Conta paga", ""))` });
  ed.pay.extendValidations(F, Math.max(F + pays.length, 1000));
  ed.dre.set('B21', st ? pendingPay(st) : 0);

  for (const k of Object.keys(ed)) book.files.set(book.sheets[SM[k]], ed[k].xml());
  return XL.save(book.files);
}
async function downloadTemplate() { try { await saveBytes('Carreira Realista ATS - modelo.xlsx', await buildSheetFile(null, [])); } catch (e) { toast('Não foi possível gerar a planilha neste navegador.'); } }

async function saveBytes(filename, bytes) {
  const dl = window.claude?.use ? await window.claude.use('downloads').catch(() => null) : null;
  if (dl) {
    try { await dl.save({ filename, data: bytes }); toast('Arquivo salvo'); }
    catch (e) { if (e && e.code !== 'declined') toast('Não foi possível salvar o arquivo aqui.'); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function openModal(html, onMount) {
  const root = $('#modalRoot');

  const sheet = root.querySelector('.sheet');
  root.querySelector('.ov').addEventListener('click', e => { if (e.target.hasAttribute('data-ovl')) closeModal(); });
  onMount && onMount(sheet);
  const f = sheet.querySelector('input,select,button'); f && f.focus({ preventScroll: true });
}
function closeModal() { $('#modalRoot').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-help]'); if (!b) return;
  e.preventDefault(); e.stopPropagation();
  const box = document.getElementById(b.dataset.help); if (!box) return;
  const open = box.hidden; box.hidden = !open; b.setAttribute('aria-expanded', open);
}, true);
function confirmBox(title, msg, ok = 'Confirmar', danger = false) {
  return new Promise(res => {
    openModal(`<h2>${title}</h2><div>${msg}</div><div class="row" style="justify-content:flex-end"><button class="btn" data-x>Cancelar</button><button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${ok}</button></div>`, sh => {

  });
}
function toast(msg) {
  const r = $('#toastRoot'); r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => { r.innerHTML = ''; }, 2600);
}

  `, sh => {

    const prev = () => {
      const b = t.type === 'borrowed';
      if (b && !t.car) Object.assign(t, E.snapshotFor('borrowed', s));
      if (!b && !t.contract) Object.assign(t, E.snapshotFor('company', s));

      if (fEl) fEl.hidden = true;

      sh.querySelectorAll('[data-truck-only]').forEach(el => { el.hidden = b; });
      sh.querySelectorAll('[data-car-only]').forEach(el => { el.hidden = !b; });
      const cr = sh.querySelector('#carRule');
      if (cr) cr.textContent = B.mode === 'owned' ? `Próprio: 100% do frete × ${fmtN(B.factor)}, menos ${fmt(B.costPerMile)}/mi do carro, combustível, pedágio, danos e despesas pessoais.`
