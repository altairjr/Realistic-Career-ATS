/* ---------- Aba Carreira: motorista, contrato, empresas ---------- */
let ctab = 'motorista';
try { const x = sessionStorage.getItem('ats-ctab'); if (x) ctab = x; } catch (e) {}
const tripsOfContract = id => [...H.flatMap(w => w.trips || []), ...S.week.trips].filter(t => t.contractId === id && t.type !== 'borrowed');

function carreira() {
  const TC = help('tab.carreira', 'Carreira');
  const tabs = [['motorista', 'Motorista'], ['contratos', 'Contrato'], ['empresas', 'Empresas']];
  return `<div class="sec-head"><div><div class="eyebrow">Carreira</div><h2 class="hrow">${({ motorista: 'Cadastro do motorista', contratos: 'Contrato de trabalho', empresas: 'Empresas' })[ctab]}${TC.btn}</h2></div></div>${TC.box}
    <div class="seg3" role="tablist" aria-label="Seções da carreira">${tabs.map(([k, l]) => `<button type="button" role="tab" data-ctab="${k}" aria-selected="${ctab === k}">${l}</button>`).join('')}</div>
    ${({ motorista: motoristaView, contratos: contratosView, empresas: empresasView })[ctab]()}`;
}

function motoristaView() {
  const P = S.profile, c = activeContract();
  const allTrips = [...H.flatMap(w => w.trips || []), ...S.week.trips].filter(t => t.type !== 'borrowed');
  const miles = allTrips.reduce((a, t) => a + E.n(t.miles), 0);
  const exp = EXPERIENCE.find(e => e[0] === P.experience) || EXPERIENCE[0];
  const timeline = S.contracts.slice().sort((a, b) => b.startDay - a.startDay).map(k => `<div class="li"><div><div><b>${esc(companyName(k))}</b> · ${esc(shortCls(k.classification))}</div><div class="muted" style="font-size:12.5px">${contractPeriod(k)} · ${esc(payFormShort(k.terms))} · ${tripsOfContract(k.id).length} viagens</div></div>${k.id === S.currentContractId ? '<span class="chip ok">Atual</span>' : `<span class="chip">${esc(k.endReason || 'Encerrado')}</span>`}</div>`).join('');
  return `
  <div class="stats">
    <div class="panel stat"><div class="eyebrow">Empregador atual</div><div class="v" style="font-size:22px">${esc(companyName(c))}</div><div class="s">${c ? 'Desde o dia ' + c.startDay + ' · ' + esc(shortCls(c.classification)) : ''}</div></div>
    <div class="panel stat"><div class="eyebrow">Milhas na carreira</div><div class="v">${fmtN(miles)} mi</div><div class="s">${allTrips.length} viagens de caminhão</div></div>
    <div class="panel stat"><div class="eyebrow">Empresas</div><div class="v">${new Set(S.contracts.map(k => k.companyId)).size}</div><div class="s">${S.contracts.length} contrato${S.contracts.length === 1 ? '' : 's'}</div></div>
  </div>
  ${mod('Dados pessoais', 'Quem é o motorista. Empresa e salário ficam no contrato; saldo no Holerite.', null,
    F.text('profile.name', 'Nome do motorista') + F.text('profile.nationality', 'Nacionalidade') + F.num('profile.level', 'Nível no jogo', { step: 1 }) +
    F.sel('profile.experience', 'Experiência como motorista', EXPERIENCE.map(e => [e[0], e[1]])) +
    hint(`Faixa de CPM para ${esc(exp[1].toLowerCase())}: ${fmt(exp[2])}–${fmt(exp[3])} por milha.`) +
    F.sel('profile.visa', 'Status migratório / CDL', VISAS, { full: true }) +
    hint(P.visa === 'other' ? '<b>Atenção:</b> desde 15/03/2026 a CDL não-domiciliada só é emitida para vistos H-2A, H-2B e E-2.' : 'Desde 15/03/2026, motorista estrangeiro sem residência permanente precisa de visto H-2A, H-2B ou E-2 para ter CDL não-domiciliada.'),
    `${P.name || 'Sem nome'} · ${exp[1]}`)}
  ${(() => {
    const rv = recentViolations(), h = help('ui.registro', 'Registro de segurança');
    const st = rv.length === 0 ? ['ok', 'Limpo'] : rv.length < 3 ? ['warn', 'Atenção'] : ['bad', 'Em risco'];
    return `<section class="panel pad" style="display:flex;flex-direction:column;gap:6px">
      <div class="sec-head"><h3 class="hrow">Registro de segurança${h.btn}</h3><span class="chip ${st[0]}">${st[1]} · ${rv.length} infraç${rv.length === 1 ? 'ão' : 'ões'} em 8 semanas</span></div>${h.box}
      ${rv.length ? `<div class="ledger">${rv.slice().reverse().map(v => `<div class="li"><div><div>${esc(v.text)}</div><div class="muted" style="font-size:12.5px">Dia ${v.day}${v.caught ? ` · pega na fiscalização · multa ${fmt(v.fine)}` : ' · não fiscalizada'}</div></div><span class="chip ${v.caught ? 'bad' : 'warn'}">${v.caught ? 'Multada' : 'Registrada'}</span></div>`).join('')}</div>` : '<p class="muted" style="margin:0;font-size:13px">Nenhuma infração de jornada nas últimas 8 semanas.</p>'}
      ${rv.length >= 3 ? '<p style="margin:0;font-size:13px"><b>Em risco:</b> na vida real, várias infrações seguidas levam a advertência, perda de bônus e até demissão. Respeite as horas nas próximas semanas para limpar o registro.</p>' : ''}
    </section>`;
  })()}
  <section class="panel pad" style="display:flex;flex-direction:column;gap:6px">
    <div class="sec-head"><h3>Histórico de empresas</h3><button class="btn sm" data-act="new-contract">Trocar de contrato</button></div>
    <div class="ledger">${timeline}</div>
  </section>`;
}

function empresasView() {
  const cur = activeContract();
  const list = S.companies.map(co => {
    const ks = S.contracts.filter(k => k.companyId === co.id);
    const isCur = cur && cur.companyId === co.id;
    return `<div class="panel pad" style="display:flex;flex-direction:column;gap:6px">
      <div class="row between"><div><h3>${esc(co.name)}</h3><div class="muted" style="font-size:13px">${[co.hq, co.dot].filter(Boolean).map(esc).join(' · ') || 'Sem sede cadastrada'}</div></div>${isCur ? '<span class="chip ok">Empregador atual</span>' : ks.length ? `<span class="chip">${ks.length} contrato${ks.length === 1 ? '' : 's'} anterior${ks.length === 1 ? '' : 'es'}</span>` : '<span class="chip">Sem contrato</span>'}</div>
      ${co.notes ? `<p class="muted" style="margin:0;font-size:13px">${esc(co.notes)}</p>` : ''}
      <div class="row"><button class="btn sm" data-editco="${esc(co.id)}">Editar</button>${!ks.length ? `<button class="btn sm danger" data-delco="${esc(co.id)}">Excluir</button>` : ''}${!isCur ? `<button class="btn sm" data-act="new-contract" data-co="${esc(co.id)}">Contratar por esta empresa</button>` : ''}</div>
    </div>`;
  }).join('');
  return `<div class="row between"><p class="muted" style="margin:0;font-size:13.5px">Empresas cadastradas aparecem como opção nos contratos.</p><button class="btn primary sm" data-editco="">Cadastrar empresa</button></div>${list}`;
}

function contratosView() {
  const c = activeContract();
  const past = S.contracts.filter(k => k.id !== S.currentContractId).sort((a, b) => b.startDay - a.startDay);
  return `<div class="panel pad row between">
      <div><div class="eyebrow">Contrato ativo</div><h3>${esc(companyName(c))}</h3><div class="muted" style="font-size:13px">${esc(shortCls(c.classification))} · ${contractPeriod(c)} · ${tripsOfContract(c.id).length} viagens</div></div>
      <button class="btn sm" data-act="new-contract">Trocar de contrato</button>
    </div>
    ${hint('Cada viagem de caminhão usa este contrato no lançamento e guarda as condições. Mudar algo aqui vale para as próximas viagens.')}
    ${contractEditor(c)}
    ${past.length ? `<div class="sec-head"><h3>Contratos anteriores</h3></div>${past.map(k => `<details class="week"><summary><div><b>${esc(companyName(k))}</b><div class="muted" style="font-size:13px">${contractPeriod(k)} · ${esc(shortCls(k.classification))}</div></div><span class="chip">${esc(k.endReason || 'Encerrado')}</span></summary>
      <div class="body"><table class="bk"><tbody>
        <tr><td>Classificação</td><td>${esc(k.classification)}</td></tr><tr><td>Operação</td><td>${esc(k.operation)}</td></tr>
        <tr><td>Remuneração</td><td>${esc(payFormShort(k.terms))}</td></tr><tr><td>Tipo fiscal</td><td>${taxTypeFor(k.classification) === '1099' ? '1099 (autônomo)' : 'W-2 (empregado)'}</td></tr>
        <tr><td>Combustível / pedágio / hotel</td><td>${['fuel', 'tolls', 'hotel'].map(x => k.terms.expenses[x] === 'company' ? 'empresa' : 'motorista').join(' / ')}</td></tr>
        <tr><td>Caminhão</td><td>${esc(k.truck || '—')}</td></tr><tr><td>Viagens</td><td>${tripsOfContract(k.id).length}</td></tr>
      </tbody></table>${tripsOfContract(k.id).length ? '' : `<div class="row"><button class="btn sm danger" data-delct="${esc(k.id)}">Excluir contrato</button></div>`}</div></details>`).join('')}` : ''}`;
}

function contractEditor(c) {
  const i = S.contracts.indexOf(c), P = `contracts.${i}`, T = `${P}.terms`, tm = c.terms, k = tm.contract, X = k.extras, L = S.settings.lists;
  const pk = E.presetKeyFor(c.classification), w2 = taxTypeFor(c.classification) === 'w2';
  const exp = EXPERIENCE.find(e => e[0] === S.profile.experience) || EXPERIENCE[0];
  const payer = (key, label) => F.sel(`${T}.expenses.${key}`, label, [['company', 'Empresa paga'], ['driver', 'Motorista paga']]);
  const ex = tm.expenses, who = x => ex[x] === 'company' ? 'empresa' : 'motorista';
  const extras = [X.layoverOn && `layover ${fmt(X.layoverRate)}/dia`, X.breakdownOn && `quebra ${fmt(X.breakdownRate)}/h`, X.tarpOn && `lona ${fmt(X.tarpRate)}`].filter(Boolean);
  const B = tm.benefits;
  return `
  ${mod('Vínculo', 'Com quem e como o motorista trabalha.', null,
    F.sel(`${P}.companyId`, 'Empresa contratante', S.companies.map(co => [co.id, co.name]), { full: true }) +
    F.sel(`${P}.classification`, 'Classificação do vínculo', CLASSIFICATIONS.map(x => [x, x]), { full: true }) +
    F.sel(`${P}.operation`, 'Especificação da operação', L.operation.map(x => [x, x])) +
    hint(`Tipo fiscal: <b>${w2 ? 'W-2, empregado' : '1099, autônomo'}</b>, definido pela classificação.`) +
    F.num(`${P}.startDay`, 'Início do contrato (dia do jogo)', { step: 1 }) + F.num(`${P}.renomeLevel`, 'Renome na empresa', { step: 1 }) +
    F.text(`${P}.truck`, 'Caminhão', { ph: 'Modelo do caminhão' }) + F.text(`${P}.trailer`, 'Trailer', { ph: 'Modelo do trailer' }) +
    `<div class="full row"><button class="btn" data-ctpreset="${pk}">Restaurar condições padrão de ${esc(E.PRESETS[pk])}</button></div>`,
    `${shortCls(c.classification)} · ${c.operation}`)}
  ${mod('Remuneração', PAY_HELP[k.mode] || '', null,
    F.sel(`${T}.contract.mode`, 'Forma de pagamento', PAY_FORMS, { full: true }) +
    (k.mode === 'weekly' ? F.num(`${T}.contract.weekly.value`, 'Valor fixo por semana', { money: true }) +
      toggleNum(`${T}.contract.weekly.commissionOn`, `${T}.contract.weekly.commission`, 'Comissão sobre o frete', { pct: true }) : '') +
    (k.mode === 'hourly' ? F.num(`${T}.contract.hourly.rate`, 'Valor por hora', { money: true, hint: 'Mercado local 2026: $22–32/h.' }) +
      toggleNum(`${T}.contract.hourly.commissionOn`, `${T}.contract.hourly.commission`, 'Comissão sobre o frete', { pct: true }) +
      toggleNum(`${T}.contract.hourly.dailyCapOn`, `${T}.contract.hourly.dailyCap`, 'Máximo de horas pagas por dia', { hint: 'Padrão local: 10h (FMCSA permite até 14h de jornada).' }) +
      toggleNum(`${T}.contract.hourly.weeklyCapOn`, `${T}.contract.hours`, 'Máximo de horas pagas por semana', { hint: 'Contrato padrão: 50h.' }) +
      toggleNum(`${T}.contract.hourly.overtimeOn`, `${T}.contract.hourly.otAfter`, 'Hora extra após (horas na semana)', { hint: 'Motoristas são isentos de hora extra pela FLSA; ligue só se a empresa paga.' }) +
      (k.hourly.overtimeOn ? F.num(`${T}.contract.hourly.otMult`, 'Multiplicador da hora extra') : '') : '') +
    (k.mode === 'cpm' ? F.num(`${T}.contract.cpm.rate`, 'Valor por milha', { money: true, hint: `Faixa para ${esc(exp[1].toLowerCase())}: ${fmt(exp[2])}–${fmt(exp[3])}/mi.` }) +
      `<div class="field" style="justify-content:end"><button class="btn" data-act="suggest-cpm">Usar CPM da experiência (${fmt((exp[2] + exp[3]) / 2)})</button></div>` +
      toggleNum(`${T}.contract.cpm.detentionOn`, `${T}.contract.cpm.detentionRate`, 'Detention: por hora de espera', { money: true, hint: 'Mercado: $15–25/h.' }) +
      (k.cpm.detentionOn ? F.num(`${T}.contract.cpm.detentionFree`, 'Horas livres antes do detention') : '') +
      toggleNum(`${T}.contract.cpm.stopOn`, `${T}.contract.cpm.stopRate`, 'Stop pay: por parada extra', { money: true, hint: 'Mercado: $25–75.' }) +
      toggleNum(`${T}.contract.cpm.commissionOn`, `${T}.contract.cpm.commission`, 'Comissão sobre o frete', { pct: true }) : '') +
    (k.mode === 'percent' ? F.num(`${T}.contract.percent.commission`, 'Percentual do frete para o motorista', { pct: true, hint: 'Empresa: 25–30%. Lease e owner-operator recebem a maior parte, mas pagam o caminhão.' }) : '') +
    (k.mode !== 'weekly' ? toggleNum(`${T}.contract.minimum.on`, `${T}.contract.minimum.value`, 'Mínimo garantido por semana', { money: true, hint: 'Comum: $1.100–1.500.' }) : ''),
    payFormShort(tm) + (k.mode !== 'weekly' && k.minimum.on ? ` · mínimo ${fmt(k.minimum.value)}` : ''))}
  ${mod('Pagamentos extras', 'Acessoriais pagos pela empresa, lançados em cada viagem.', null,
    toggleNum(`${T}.contract.extras.layoverOn`, `${T}.contract.extras.layoverRate`, 'Layover: por dia parado', { money: true, hint: 'Mercado: $75–300/dia.' }) +
    toggleNum(`${T}.contract.extras.breakdownOn`, `${T}.contract.extras.breakdownRate`, 'Breakdown: por hora de quebra', { money: true }) +
    toggleNum(`${T}.contract.extras.tarpOn`, `${T}.contract.extras.tarpRate`, 'Tarp pay: por carga com lona', { money: true, hint: 'Só em flatbed: $50–100.' }),
    extras.join(' · ') || 'Nenhum')}
  ${mod('Bônus da empresa', 'Renome e programa de segurança.', null,
    toggleNum(`${T}.renome.on`, `${T}.renome.perLevel`, 'Bônus por nível de renome', { pct: true, hint: `Nível ${c.renomeLevel || 1} × ${fmtN(tm.renome.perLevel)}% = ${fmtN(E.n(tm.renome.perLevel) * Math.max(1, E.n(c.renomeLevel) || 1))}% sobre salário base e comissão.` }) +
    (toggleNum(`${T}.safety.on`, `${T}.safety.amount`, 'Bônus de segurança', { money: true, hint: 'Pago ao completar as semanas seguidas sem multa nem dano.' }) +
      (tm.safety.on ? F.num(`${T}.safety.weeks`, 'Semanas seguidas', { step: 1, hint: '13 semanas = um trimestre.' }) : '')),
    [tm.renome.on && `renome ${fmtN(E.n(tm.renome.perLevel) * Math.max(1, E.n(c.renomeLevel) || 1))}%`, tm.safety.on && `segurança ${fmt(tm.safety.amount)} a cada ${tm.safety.weeks} semanas`].filter(Boolean).join(' · ') || 'Nenhum')}
  ${`
  ${mod('Quem paga cada despesa', 'Despesas das viagens de caminhão neste contrato.', null,
    payer('fuel', 'Combustível') + payer('tolls', 'Pedágios') + payer('hotel', 'Hotel') + payer('fines', 'Multas de trânsito') +
    F.sel(`${T}.expenses.damage`, 'Danos à carga e ao caminhão', [['deductible', 'Motorista paga a franquia'], ['driver', 'Motorista paga tudo'], ['company', 'Empresa paga']]) +
    (ex.damage === 'deductible' ? F.num(`${T}.expenses.deductible`, 'Franquia por ocorrência', { money: true, hint: 'Comum: $500–1.000.' }) : ''),
    `Combustível: ${who('fuel')} · pedágio: ${who('tolls')} · hotel: ${who('hotel')} · danos: ${ex.damage === 'deductible' ? 'franquia ' + fmt(ex.deductible) : ex.damage === 'company' ? 'empresa' : 'motorista'}`)}
  ${mod('Benefícios e per diem', 'Descontados do contracheque ou pagos sem imposto.', null,
    toggleNum(`${T}.benefits.healthOn`, `${T}.benefits.health`, 'Plano de saúde por semana', { money: true }) +
    toggleNum(`${T}.benefits.k401On`, `${T}.benefits.k401Pct`, '401(k) · aposentadoria', { pct: true }) +
    toggleNum(`${T}.perDiem.on`, `${T}.perDiem.rate`, 'Per diem por noite fora de casa', { money: true, hint: 'IRS 2026: $80/dia. Marque "Dormiu fora de casa" na viagem.' }),
    [B.healthOn && `saúde ${fmt(B.health)}/sem`, B.k401On && `401(k) ${fmtN(B.k401Pct)}%`, tm.perDiem.on && `per diem ${fmt(tm.perDiem.rate)}`].filter(Boolean).join(' · ') || 'Nenhum')}
  ${mod('Custos operacionais do caminhão', 'Para lease e owner-operator, que pagam o próprio caminhão.', `${T}.opCosts.on`,
    F.num(`${T}.opCosts.maintenance`, 'Manutenção por milha', { money: true, hint: 'ATRI 2025: $0,404/mi.' }) +
    F.num(`${T}.opCosts.tires`, 'Pneus por milha', { money: true, hint: 'ATRI 2025: $0,05/mi.' }) +
    F.num(`${T}.opCosts.insurance`, 'Seguro por milha', { money: true }) +
    F.num(`${T}.opCosts.truckWeekly`, 'Parcela ou leasing por semana', { money: true }) +
    F.num(`${T}.opCosts.otherWeekly`, 'Licenças, IFTA, ELD e escrow por semana', { money: true }),
    tm.opCosts.on ? `${fmt(E.n(tm.opCosts.maintenance) + E.n(tm.opCosts.tires) + E.n(tm.opCosts.insurance))}/mi + ${fmt(E.n(tm.opCosts.truckWeekly) + E.n(tm.opCosts.otherWeekly))}/semana` : (w2 ? 'Desligado: o caminhão é da empresa' : 'Desligado'))}`}`;
}

function companyForm(id) {
  const co = id ? S.companies.find(x => x.id === id) : { name: '', hq: '', dot: '', notes: '' };
  openModal(`<div class="row between"><h2>${id ? 'Editar empresa' : 'Cadastrar empresa'}</h2><button class="btn ghost sm" data-x>Fechar</button></div>
    <div class="grid">
      <div class="field full">${(L => L.row + L.box)(labRow('company.name', 'Nome da empresa', 'co_name'))}<input id="co_name" value="${esc(co.name)}" placeholder="Ex.: ADM Transport"></div>
      <div class="field">${(L => L.row + L.box)(labRow('company.hq', 'Sede (cidade / estado)', 'co_hq'))}<input id="co_hq" value="${esc(co.hq)}" placeholder="Carson City / NV"></div>
      <div class="field">${(L => L.row + L.box)(labRow('company.dot', 'USDOT / MC (opcional)', 'co_dot'))}<input id="co_dot" value="${esc(co.dot)}"></div>
      <div class="field full">${(L => L.row + L.box)(labRow('company.notes', 'Observações', 'co_notes'))}<input id="co_notes" value="${esc(co.notes)}" placeholder="Ex.: frota de reefer, base em Reno"></div>
    </div>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-x>Cancelar</button><button class="btn primary" data-ok>Salvar</button></div>`, sh => {
    sh.querySelectorAll('[data-x]').forEach(b => b.onclick = closeModal);
    sh.querySelector('[data-ok]').onclick = () => {
      const v = k => sh.querySelector('#co_' + k).value.trim();
      if (!v('name')) { toast('Informe o nome da empresa.'); return; }
      commit(st => {
        const data = { name: v('name'), hq: v('hq'), dot: v('dot'), notes: v('notes') };
        if (id) Object.assign(st.companies.find(x => x.id === id), data); else st.companies.push({ id: uid(), ...data });
      });
      closeModal(); toast(id ? 'Empresa atualizada' : 'Empresa cadastrada');
    };
  });
}

function newContractFlow(companyId) {
  const cur = activeContract(), L = S.settings.lists;
  openModal(`<div class="row between"><h2>Trocar de contrato</h2><button class="btn ghost sm" data-x>Fechar</button></div>
    <p class="muted" style="margin:0;font-size:13.5px">O contrato atual com ${esc(companyName(cur))} é encerrado na véspera do início do novo. Viagens já lançadas continuam com as condições antigas.</p>
    <div class="grid">
      <div class="field full">${(L => L.row + L.box)(labRow('nc.co', 'Empresa', 'nc_co'))}<select id="nc_co">${S.companies.map(co => `<option value="${co.id}" ${co.id === (companyId || cur.companyId) ? 'selected' : ''}>${esc(co.name)}</option>`).join('')}<option value="__new">+ Cadastrar nova empresa</option></select></div>
      <div class="field full" id="nc_newbox" hidden><label for="nc_name">Nome da nova empresa</label><input id="nc_name" placeholder="Ex.: Sierra Freight"></div>
      <div class="field full">${(L => L.row + L.box)(labRow('nc.cls', 'Classificação do vínculo', 'nc_cls'))}<select id="nc_cls">${CLASSIFICATIONS.map(x => `<option ${x === cur.classification ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>
      <div class="field">${(L => L.row + L.box)(labRow('nc.op', 'Operação', 'nc_op'))}<select id="nc_op">${L.operation.map(x => `<option ${x === cur.operation ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>
      <div class="field">${(L => L.row + L.box)(labRow('nc.day', 'Início (dia do jogo)', 'nc_day'))}<input id="nc_day" type="number" step="1" value="${S.gameDay}"></div>
      <div class="field full">${(L => L.row + L.box)(labRow('nc.reason', 'Motivo da saída do contrato atual', 'nc_reason'))}<select id="nc_reason">${['Mudança de empresa', 'Promoção / novo vínculo', 'Pedido de demissão', 'Demissão', 'Fim do contrato'].map(x => `<option>${x}</option>`).join('')}</select></div>
      <div class="field full">${(L => L.row + L.box)(labRow('nc.terms', 'Condições do novo contrato'))}
        <label class="inline-opt"><input type="radio" name="nc_terms" value="preset" checked> Padrão da classificação escolhida</label>
        <label class="inline-opt"><input type="radio" name="nc_terms" value="copy"> Copiar as condições do contrato atual</label></div>
    </div>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-x>Cancelar</button><button class="btn primary" data-ok>Iniciar contrato</button></div>`, sh => {
    sh.querySelectorAll('[data-x]').forEach(b => b.onclick = closeModal);
    sh.querySelector('#nc_co').onchange = e => { sh.querySelector('#nc_newbox').hidden = e.target.value !== '__new'; };
    sh.querySelector('[data-ok]').onclick = () => {
      let coId = sh.querySelector('#nc_co').value;
      const newName = sh.querySelector('#nc_name').value.trim();
      if (coId === '__new' && !newName) { toast('Informe o nome da nova empresa.'); return; }
      const cls = sh.querySelector('#nc_cls').value, op = sh.querySelector('#nc_op').value;

      const copy = sh.querySelector('input[name="nc_terms"]:checked').value === 'copy';
      const reason = sh.querySelector('#nc_reason').value;
      commit(st => {
        if (coId === '__new') { coId = uid(); st.companies.push({ id: coId, name: newName, hq: '', dot: '', notes: '' }); }
        const old = st.contracts.find(x => x.id === st.currentContractId);
        if (old) { old.endDay = Math.max(old.startDay, start - 1); old.endReason = reason; }
        const terms = copy && old ? clone(old.terms) : presetTermsFor(E.presetKeyFor(cls), null, opIsOtr(op));
        const nc = { id: uid(), companyId: coId, classification: cls, operation: op, startDay: start, endDay: null, truck: copy && old ? old.truck : '', trailer: copy && old ? old.trailer : '', renomeLevel: 1, terms };
        st.contracts.push(nc); st.currentContractId = nc.id;

    };
  });
}

/* ---------- Planilha (.xlsx) sem bibliotecas externas ----------
   Leitura: zip (DecompressionStream) + XML. Escrita: zip sem compressão. */
const XL = (() => {
  const td = new TextDecoder(), te = new TextEncoder();
  async function unzip(buf) {
    const dv = new DataView(buf);
    let eocd = -1;
    for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) throw new Error('not_zip');
    const n = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
    const files = {};
    for (let k = 0; k < n; k++) {
      if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('not_zip');
      const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
      const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true);
      files[td.decode(new Uint8Array(buf, p + 46, nlen))] = { method, csize, lho };
      p += 46 + nlen + elen + clen;
    }
    const read = async name => {
      const f = files[name]; if (!f) return null;
      const start = f.lho + 30 + dv.getUint16(f.lho + 26, true) + dv.getUint16(f.lho + 28, true);
      const data = new Uint8Array(buf, start, f.csize);
      if (f.method === 0) return td.decode(data);
      if (f.method === 8) return td.decode(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
      throw new Error('zip_method');
    };
    return { files, read };
  }
  const xml = s => new DOMParser().parseFromString(s, 'application/xml');
  const tags = (node, name) => Array.from(node.getElementsByTagName(name));
  const colIdx = ref => { let n = 0; for (const ch of ref.replace(/\d+/g, '')) n = n * 26 + (ch.charCodeAt(0) - 64); return n - 1; };
  // Lê o arquivo e devolve { nomeDaAba: [[célula, ...], ...] }
  async function read(buf) {
    const z = await unzip(buf);
    const wbx = await z.read('xl/workbook.xml'); if (!wbx) throw new Error('not_xlsx');
    const rels = {}; const relx = await z.read('xl/_rels/workbook.xml.rels');
    if (relx) tags(xml(relx), 'Relationship').forEach(r => { rels[r.getAttribute('Id')] = r.getAttribute('Target'); });
    const shared = []; const ssx = await z.read('xl/sharedStrings.xml');
    if (ssx) tags(xml(ssx), 'si').forEach(si => shared.push(tags(si, 't').filter(t => t.parentNode.nodeName !== 'rPh').map(t => t.textContent).join('')));
    const out = {};
    for (const sh of tags(xml(wbx), 'sheet')) {
      const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
      let target = rels[rid] || ''; target = target.replace(/^\//, ''); if (!target.startsWith('xl/')) target = 'xl/' + target;
      const sx = await z.read(target); if (!sx) continue;
      const rows = [];
      for (const r of tags(xml(sx), 'row')) {
        const ri = (parseInt(r.getAttribute('r')) || rows.length + 1) - 1, row = [];
        for (const c of tags(r, 'c')) {
          const t = c.getAttribute('t'), v = tags(c, 'v')[0], ci = c.getAttribute('r') ? colIdx(c.getAttribute('r')) : row.length;
          let val = '';
          if (t === 's') val = shared[parseInt(v && v.textContent)] ?? '';
          else if (t === 'inlineStr') val = tags(c, 't').map(x => x.textContent).join('');
          else if (t === 'b') val = v && v.textContent === '1';
          else if (v) val = t === 'str' || t === 'e' ? v.textContent : (isFinite(+v.textContent) ? +v.textContent : v.textContent);
          row[ci] = val;
        }
        rows[ri] = row;
      }
      out[sh.getAttribute('name')] = Array.from(rows, r => Array.from(r || [], x => x ?? ''));
    }
    return out;
  }
  /* --- escrita --- */
  const crcT = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = crcT[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  function zip(entries) {
    const parts = [], central = []; let off = 0;
    for (const [name, text] of entries) {
      const nb = te.encode(name), data = te.encode(text), crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(8, 0, true); lh.setUint32(14, crc, true);
      lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, nb.length, true);
      parts.push(new Uint8Array(lh.buffer), nb, data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint32(16, crc, true);
      ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, nb.length, true); ch.setUint32(42, off, true);
      central.push(new Uint8Array(ch.buffer), nb);
      off += 30 + nb.length + data.length;
    }
    const cdSize = central.reduce((a, b) => a + b.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, off, true);
    const all = [...parts, ...central, new Uint8Array(end.buffer)];
    const out = new Uint8Array(all.reduce((a, b) => a + b.length, 0)); let p = 0;
    for (const b of all) { out.set(b, p); p += b.length; }
    return out;
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const colName = i => { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
  // sheets: [{ name, rows: [[...]], widths?: [n...], header?: true }]
  function write(sheets) {
    const sheetXml = sh => `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${sh.widths ? `<cols>${sh.widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : ''}<sheetData>${sh.rows.map((r, ri) => `<row r="${ri + 1}">${r.map((v, ci) => {
      const ref = colName(ci) + (ri + 1), st = sh.header && ri === 0 ? ' s="1"' : '';
      if (v === '' || v == null) return '';
      return typeof v === 'number' ? `<c r="${ref}"${st}><v>${v}</v></c>` : `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${esc(v)}</t></is></c>`;
    }).join('')}</row>`).join('')}</sheetData></worksheet>`;
    const entries = [
      ['[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],
      ['_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
      ['xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${esc(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`],
      ['xl/_rels/workbook.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
      ['xl/styles.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`],
      ...sheets.map((s, i) => [`xl/worksheets/sheet${i + 1}.xml`, sheetXml(s)])
    ];
    return zip(entries);
  }
  return { read, write };
})();

const normTxt = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
function parseNum(v) {
  if (typeof v === 'number') return isFinite(v) ? v : NaN;

  if (s.includes(',') && s.includes('.')) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');

}

// Lê e valida a planilha. Devolve { ok, errors[], data }
function parseCareerSheet(book) {
  const errors = [];
  const find = name => { const k = Object.keys(book).find(x => normTxt(x) === normTxt(name)); return k ? book[k] : null; };
  const mot = find('Motorista'), emp = find('Empresa'), via = find('Viagens');
  const missing = [['Motorista', mot], ['Empresa', emp], ['Viagens', via]].filter(x => !x[1]).map(x => x[0]);
  if (missing.length) return { ok: false, errors: [`Faltam as abas: ${missing.join(', ')}. Use o modelo do app, sem renomear as abas. Abas encontradas: ${Object.keys(book).join(', ') || 'nenhuma'}.`] };
  const kv = rows => { const m = {}; rows.slice(1).forEach(r => { if (r && r[0] !== '' && r[0] != null) m[normTxt(r[0])] = r[1]; }); return m; };
  const M = kv(mot), C = kv(emp), get = (m, f) => m[normTxt(f)];
  const num = (v, where, { req = false, int = false, min = null } = {}) => {
    const n = parseNum(v);
    if (n === null) { if (req) errors.push(`${where}: campo obrigatório vazio.`); return null; }
    if (isNaN(n)) { errors.push(`${where}: "${v}" não é um número.`); return null; }
    if (int && !Number.isInteger(n)) { errors.push(`${where}: use um número inteiro (recebido ${v}).`); return null; }
    if (min !== null && n < min) { errors.push(`${where}: o valor mínimo é ${min} (recebido ${v}).`); return null; }
    return n;
  };
  const balanceV = num(get(M, 'Saldo bancário atual (USD)'), 'Motorista › Saldo bancário atual (USD)', { req: true });
  const gameDay = num(get(M, 'Dia atual do jogo'), 'Motorista › Dia atual do jogo', { req: true, int: true, min: 1 });
  let day1 = 0; const d1 = get(M, 'Dia 1 do jogo é');
  if (d1 !== undefined && d1 !== '') { day1 = E.WEEKDAYS_FULL.findIndex(w => normTxt(w).startsWith(normTxt(d1).slice(0, 3))); if (day1 < 0) { errors.push(`Motorista › Dia 1 do jogo é: "${d1}" não é um dia da semana.`); day1 = 0; } }
  const coName = String(get(C, 'Nome da empresa') ?? '').trim();
  if (!coName) errors.push('Empresa › Nome da empresa: campo obrigatório vazio.');
  const clsRaw = normTxt(get(C, 'Classificação'));
  const clsKey = !clsRaw ? null : clsRaw.includes('frota') || clsRaw.includes('fleet') ? 'fleet' : clsRaw.includes('autoridade') || clsRaw.includes('mc') ? 'authority' : clsRaw.includes('lease') || clsRaw.includes('arrend') ? 'lease' : clsRaw.includes('owner') || clsRaw.includes('1099') ? 'owner' : clsRaw.includes('w-2') || clsRaw.includes('w2') || clsRaw.includes('company') || clsRaw.includes('empregado') ? 'w2' : null;
  if (!clsRaw) errors.push('Empresa › Classificação: campo obrigatório vazio. Use W-2, Lease, Owner-Operator, Autoridade própria ou Frota.');
  else if (!clsKey) errors.push(`Empresa › Classificação: "${get(C, 'Classificação')}" não é reconhecida. Use W-2, Lease, Owner-Operator, Autoridade própria ou Frota.`);
  const opRaw = normTxt(get(C, 'Operação'));
  const OPS = E.OPERATIONS;
  const operation = !opRaw || opRaw.startsWith('local') || opRaw.includes('day cab') ? OPS[0] : opRaw.startsWith('regional') ? OPS[1] : opRaw.startsWith('dedic') ? OPS[2] : opRaw.includes('otr') || opRaw.includes('long') || opRaw.includes('sleeper') ? OPS[3] : null;
  if (opRaw && !operation) errors.push(`Empresa › Operação: "${get(C, 'Operação')}" não é reconhecida. Use Local, Regional, Dedicated ou OTR.`);
  const payRaw = normTxt(get(C, 'Forma de pagamento'));
  const payMode = !payRaw ? null : payRaw.startsWith('fixo') || payRaw.includes('semanal') ? 'weekly' : payRaw.includes('hora') ? 'hourly' : payRaw.includes('milha') || payRaw.includes('cpm') ? 'cpm' : payRaw.includes('percent') || payRaw.includes('%') ? 'percent' : 'bad';
  if (payMode === 'bad') errors.push(`Empresa › Forma de pagamento: "${get(C, 'Forma de pagamento')}" não é reconhecida. Use Fixo semanal, Por hora, Por milha ou Percentual.`);
  const baseV = num(get(C, 'Valor base'), 'Empresa › Valor base', { min: 0 });
  const commV = num(get(C, 'Comissão (%)'), 'Empresa › Comissão (%)', { min: 0 });
  const startV = num(get(C, 'Início do contrato (dia)'), 'Empresa › Início do contrato (dia)', { int: true, min: 1 });

  const head = (via[0] || []).map(normTxt);
  const col = {}; SHEET_FMT.viagens.forEach(h => { const i = head.indexOf(normTxt(h)); if (i >= 0) col[h] = i; });
  const missCols = SHEET_FMT.required.filter(h => col[h] === undefined);
  if (missCols.length) errors.push(`Viagens: faltam as colunas obrigatórias ${missCols.map(x => `"${x}"`).join(', ')} na linha 1. Colunas encontradas: ${(via[0] || []).filter(Boolean).join(', ') || 'nenhuma'}.`);
  const trips = [];
  if (!missCols.length) {
    via.slice(1).forEach((r, i) => {
      const line = i + 2, cell = h => col[h] === undefined ? '' : r[col[h]];
      if (!r || r.every(v => v === '' || v == null)) return;
      const where = h => `Viagens › linha ${line} › ${h}`;
      const day = num(cell('Dia'), where('Dia'), { req: true, int: true, min: 1 });
      if (day !== null && gameDay && day > gameDay) errors.push(`${where('Dia')}: dia ${day} é depois do dia atual do jogo (${gameDay}).`);
      const vRaw = normTxt(cell('Veículo'));
      const type = vRaw.startsWith('caminh') || vRaw === 'truck' ? 'company' : vRaw.startsWith('carro') ? 'borrowed' : null;
      if (!type) errors.push(`${where('Veículo')}: "${cell('Veículo')}" não é válido. Use Caminhão, Carro emprestado ou Carro próprio.`);
      const carMode = vRaw.includes('propri') ? 'owned' : 'borrowed';
      const dest = String(cell('Destino') ?? '').trim(); if (!dest) errors.push(`${where('Destino')}: campo obrigatório vazio.`);
      const stRaw = String(cell('Status') ?? '').trim();
      const status = !stRaw ? 'Excelente' : E.STATUSES.find(x => normTxt(x) === normTxt(stRaw));
      if (stRaw && !status) errors.push(`${where('Status')}: "${stRaw}" não é válido. Use ${E.STATUSES.join(', ')}.`);
      const n = (h, int = false) => num(cell(h), where(h), { req: SHEET_FMT.required.includes(h), int, min: h === 'Bônus (USD)' ? null : 0 }) ?? 0;
      trips.push({ id: uid(), day: day || 1, type: type || 'company', carMode, origin: String(cell('Origem') ?? '').trim(), dest, status: status || 'Excelente',
        miles: n('Distância (mi)'), freight: n('Frete (USD)'), bonus: n('Bônus (USD)'), fuel: n('Combustível (USD)'), tolls: n('Pedágios (USD)'), fines: n('Multas (USD)'), damage: n('Danos (USD)'),
        breakfast: n('Cafés', true), lunch: n('Almoços', true), dinner: n('Jantas', true), hotel: n('Noites em hotel', true), drive: n('Horas de direção'), hours: n('Horas de serviço'),
        detention: 0, stops: 0, layover: 0, breakdown: 0, tarp: false, brk: false, away: false });
    });
  }
  if (!errors.length && !trips.length) errors.push('Viagens: nenhuma viagem encontrada a partir da linha 2.');
  return { ok: !errors.length, errors, data: { profile: { name: String(get(M, 'Nome do motorista') ?? '').trim(), nationality: String(get(M, 'Nacionalidade') ?? '').trim(), level: num(get(M, 'Nível no jogo'), 'x') || 1 },
    balance: balanceV, gameDay, day1, company: { name: coName, hq: String(get(C, 'Sede (cidade / estado)') ?? '').trim() }, clsKey, operation, payMode, baseV, commV, startV, trips } };
}

// Monta o estado completo do app a partir dos dados lidos (cálculos refeitos com as regras atuais)
function buildFromSheet(D) {
  const st = newCareer({ name: D.profile.name, nationality: D.profile.nationality, level: D.profile.level, company: D.company.name, hq: D.company.hq,
    clsKey: D.clsKey, operation: D.operation, gameDay: D.gameDay, day1: D.day1, startDay: D.startV || 1, billedThrough: D.gameDay });
  st.career.startDay = 1;
  const ct = activeContract(st);
  const k = ct.terms.contract;
  if (D.payMode) k.mode = D.payMode;
  if (D.baseV !== null && D.baseV !== undefined) { if (k.mode === 'weekly') k.weekly.value = D.baseV; else if (k.mode === 'hourly') k.hourly.rate = D.baseV; else if (k.mode === 'cpm') k.cpm.rate = D.baseV; else k.percent.commission = D.baseV; }
  if (D.commV !== null && D.commV !== undefined && (k.mode === 'weekly' || k.mode === 'hourly')) { k[k.mode].commissionOn = D.commV > 0; k[k.mode].commission = D.commV; }
  const eff = effSettings(st);
  const stamp = t => {
    const o = { ...t }; delete o.carMode;
    if (t.type === 'borrowed') o.car = E.carSnapshot(eff, t.carMode);
    else Object.assign(o, E.snapshotFor('company', eff), { rules: E.rulesSnapshot(eff), contractId: ct.id });
    return o;
  };
  const curStart = E.weekStartOf(D.gameDay, st.settings);
  const all = D.trips.map(stamp);
  st.week = { start: curStart, trips: all.filter(t => t.day >= curStart) };
  const byWeek = {};
  all.filter(t => t.day < curStart).forEach(t => { const w = E.weekStartOf(t.day, st.settings); (byWeek[w] = byWeek[w] || []).push(t); });
  const hist = Object.keys(byWeek).map(Number).sort((a, b) => a - b).map(start => {
    const trips = byWeek[start], d = E.dre(trips, eff), living = E.r2(d.variable.total + d.opCosts.total + d.fixed.total);
    const w = { id: 'w' + start + '-' + uid().slice(0, 4), start, end: start + 6, trips, dre: d, settings: clone(eff), closedDay: start + 7, contractId: ct.id };
    const payday = E.paydayFor(start, eff);
    const p = { id: uid(), weekStart: start, payday, amount: d.takeHome, status: 'pending', breakdown: { gross: d.revenue, ded: d.deductions.total, takeHome: d.takeHome, living, net: d.net, tax: d.taxType, safety: 0 } };
    st.payroll.push(p);
    st.ledger.push({ id: uid(), ref: 'living:' + p.id, day: Math.min(start + 7, D.gameDay), desc: `Despesas e custo de vida · semana ${weekLabel(start).toLowerCase()}`, amount: -living, locked: true });
    if (payday <= D.gameDay) payEntry(st, p, payday);
    trips.filter(t => t.type === 'borrowed').forEach(t => st.ledger.push({ id: uid(), ref: 'trip:' + t.id, day: t.day, desc: borrowedDesc(t), amount: E.borrowedValue(t, eff), locked: true }));
    return w;
  });
  syncBorrowedLedger(st);
  // saldo final = saldo informado na planilha
  st.bank.opening = E.r2(D.balance - st.ledger.reduce((a, e) => a + E.n(e.amount), 0));
  st.settings.cities = [...new Set([...st.settings.cities, ...all.flatMap(t => [t.origin, t.dest]).filter(Boolean)])];
  st._rev = Date.now();
  return { state: st, history: hist };
}

function importSheetFlow() {
  openModal(`<div class="row between"><h2>Importar planilha</h2><button class="btn ghost sm" data-x>Fechar</button></div>
    <p style="margin:0;font-size:14px">Use a planilha no formato do app (.xlsx), com as abas <b>Motorista</b>, <b>Empresa</b> e <b>Viagens</b>. Se ainda não tem, baixe o modelo, preencha e volte aqui.</p>
    <div class="row"><button class="btn" data-tpl>Baixar modelo (.xlsx)</button></div>
    <div class="field"><div class="lab-row"><label for="sheetFile">Arquivo da planilha</label></div><input id="sheetFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></div>
    <div id="sheetResult"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-x>Cancelar</button><button class="btn primary" data-imp disabled>Importar</button></div>`, sh => {
    let parsed = null;
    sh.querySelectorAll('[data-x]').forEach(b => b.onclick = closeModal);
    sh.querySelector('[data-tpl]').onclick = downloadTemplate;
    const out = sh.querySelector('#sheetResult'), btn = sh.querySelector('[data-imp]');
    const fail = (title, list) => { parsed = null; btn.disabled = true; out.innerHTML = `<div class="banner" style="border-color:var(--red);background:var(--red-bg);flex-direction:column;align-items:flex-start;gap:6px"><b>${esc(title)}</b>${list.length ? `<ul style="margin:0;padding-left:18px;font-size:13px">${list.slice(0, 15).map(e => `<li>${esc(e)}</li>`).join('')}</ul>${list.length > 15 ? `<span style="font-size:13px">E mais ${list.length - 15} problema(s).</span>` : ''}` : ''}<span class="muted" style="font-size:12.5px">Nada foi alterado. Corrija a planilha e selecione de novo, ou baixe o modelo para conferir o formato.</span></div>`; };
    sh.querySelector('#sheetFile').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      out.innerHTML = '<p class="muted" style="margin:0">Lendo a planilha…</p>';
      let book;
      try { book = await XL.read(await f.arrayBuffer()); }
      catch (err) { return fail('Falha ao ler o arquivo', [`"${f.name}" não é uma planilha .xlsx válida. Salve no Excel ou Google Planilhas como "Pasta de trabalho do Excel (.xlsx)" e tente de novo.`]); }
      const r = parseCareerSheet(book);
      if (!r.ok) return fail(`Falha na conversão: ${r.errors.length} problema${r.errors.length === 1 ? '' : 's'} encontrado${r.errors.length === 1 ? '' : 's'}`, r.errors);
      parsed = r.data;
      const curStart = E.weekStartOf(parsed.gameDay, { day1Weekday: parsed.day1 });
      const nCur = parsed.trips.filter(t => t.day >= curStart).length, weeks = new Set(parsed.trips.filter(t => t.day < curStart).map(t => E.weekStartOf(t.day, { day1Weekday: parsed.day1 }))).size;
      out.innerHTML = `<div class="banner" style="border-color:var(--ok);background:var(--ok-bg);flex-direction:column;align-items:flex-start;gap:4px"><b>Planilha válida</b><span style="font-size:13.5px">${esc(parsed.profile.name || 'Motorista sem nome')} · ${esc(parsed.company.name)} · ${esc(E.PRESETS[parsed.clsKey])}<br>Dia atual ${parsed.gameDay} · saldo ${fmt(parsed.balance)}<br>${parsed.trips.length} viagens: ${nCur} na semana em aberto e ${parsed.trips.length - nCur} em ${weeks} semana${weeks === 1 ? '' : 's'} anterior${weeks === 1 ? '' : 'es'} (ficam no Histórico, já pagas)</span><span class="muted" style="font-size:12.5px">Importar substitui todos os dados atuais. Salário, impostos e despesas são recalculados com as regras do app.</span></div>`;
      btn.disabled = false;
    };
    btn.onclick = () => {
      if (!parsed) return;
      try { const r = buildFromSheet(parsed); closeModal(); replaceAll(r.state, r.history); tab = 'painel'; render(); toast('Planilha importada'); }
      catch (err) { fail('Falha ao montar os dados', [String(err && err.message || err)]); }
    };
  });
}

/* ---------- Modais ---------- */
function openModal(html, onMount) {
  const root = $('#modalRoot');
  root.innerHTML = `<div class="ov" data-ovl><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const sheet = root.querySelector('.sheet');
  root.querySelector('.ov').addEventListener('click', e => { if (e.target.hasAttribute('data-ovl')) closeModal(); });
  onMount && onMount(sheet);
  const f = sheet.querySelector('input,select,button'); f && f.focus({ preventScroll: true });
}
function closeModal() { $('#modalRoot').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-help]'); if (!b) return;
  e.preventDefault(); e.stopPropagation();
  const box = document.getElementById(b.dataset.help); if (!box) return;
  const open = box.hidden; box.hidden = !open; b.setAttribute('aria-expanded', open);
}, true);
function confirmBox(title, msg, ok = 'Confirmar', danger = false) {
  return new Promise(res => {
    openModal(`<h2>${title}</h2><div>${msg}</div><div class="row" style="justify-content:flex-end"><button class="btn" data-x>Cancelar</button><button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${ok}</button></div>`, sh => {
      sh.querySelector('[data-x]').onclick = () => { closeModal(); res(false); };
      sh.querySelector('[data-ok]').onclick = () => { closeModal(); res(true); };
    });
  });
}
function toast(msg) {
  const r = $('#toastRoot'); r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => { r.innerHTML = ''; }, 2600);
}

      if (b && !t.car) Object.assign(t, E.snapshotFor('borrowed', s));
      if (!b && !t.contract) Object.assign(t, E.snapshotFor('company', s));
      const k = E.contractOf(t, s), B = E.carRuleOf(t, s), bonusOn = b ? B.bonusOn !== false : k.tripBonus;
      const R = t.rules && t.rules.exp, mk = t.rules && t.rules.market;
      const costs = E.tripCosts(t, s), mf = E.marketFreight(t, s);
      const fEl = sh.querySelector('#tFormula');
      if (fEl) fEl.textContent = b
        ? `Carro: ${fmtN(B.pct)}% do frete${bonusOn ? ' + bônus' : ''} − despesas, fora do contrato.`
        : '';
      if (fEl) fEl.hidden = true;
      sh.querySelectorAll('[data-mode-only]').forEach(el => { el.hidden = b || el.dataset.modeOnly !== k.mode; });
      sh.querySelectorAll('[data-truck-only]').forEach(el => { el.hidden = b; });
      sh.querySelectorAll('[data-car-only]').forEach(el => { el.hidden = !b; });
      const cr = sh.querySelector('#carRule');
      if (cr) cr.textContent = B.mode === 'owned' ? `Próprio: 100% do frete × ${fmtN(B.factor)}, menos ${fmt(B.costPerMile)}/mi do carro, combustível, pedágio, danos e despesas pessoais.`
        : `Emprestado: ${fmtN(B.pct)}% do frete × ${fmtN(B.factor)}. O dono paga combustível, pedágio e danos.`;
      sh.querySelectorAll('[data-carmode]').forEach(bt => bt.setAttribute('aria-pressed', bt.dataset.carmode === (B.mode === 'owned' ? 'owned' : 'borrowed')));
      const ci = sh.querySelector('#ctInfo'), cb = sh.querySelector('[data-ctnow]');
      const tc = S.contracts.find(x => x.id === t.contractId);
      if (ci) ci.innerHTML = `<b>${esc(tc ? companyName(tc) : 'Contrato anterior')}</b> · ${esc(modeLabel(k.mode))}`;
      if (cb) cb.hidden = !editing || (t.contractId === S.currentContractId && JSON.stringify(t.contract) === JSON.stringify(s.contract) && JSON.stringify(t.rules || null) === JSON.stringify(E.rulesSnapshot(s)));
      const cn = sh.querySelector('[data-carnow]'); if (cn) cn.hidden = !b || JSON.stringify(t.car) === JSON.stringify(E.carSnapshot(s, B.mode));
      const paid = (key, label) => setH(key, !b && R && R[key] === 'company' ? `${label} paga pela empresa` : '');
      paid('fuel', 'Despesa'); paid('tolls', 'Despesa'); paid('fines', 'Multa');
      setH('damage', !b && R ? (R.damage === 'deductible' && E.n(t.damage) > E.n(R.deductible) ? `Motorista paga a franquia de ${fmt(R.deductible)}` : R.damage === 'company' ? 'Empresa paga' : '') : '');
      const mfx = b ? E.n(t.freight) * E.n(B.factor) : mf;
      setH('freight', mfx !== E.n(t.freight) ? `Frete de mercado: ${fmt(mfx)}${E.n(t.miles) ? ` (${fmt(mfx / E.n(t.miles))}/mi)` : ''}` : '');
      setH('bonus', bonusOn ? '' : `Bônus desligado para ${b ? 'carro' : 'caminhão'} em Ajustes.`);
      setH('hours', k.mode === 'hourly' ? 'Base do pagamento por hora' + (k.hourly.dailyCapOn ? ` (máx. ${fmtN(k.hourly.dailyCap)}h pagas/dia)` : '') : 'Para o controle de jornada');
      setH('drive', E.n(t.drive) > 11 ? 'Acima do limite de 11h' : '');
      const dayMeals = !b && s.costs.mealsMode === 'day';
      sh.querySelector('[data-meals]').hidden = dayMeals; sh.querySelector('[data-meals]').style.display = dayMeals ? 'none' : 'contents';
      sh.querySelector('#mealsAuto').hidden = !dayMeals;
      const carLent = b && B.mode === 'borrowed';
      const coPays = carLent ? ['fuel', 'tolls', 'damage'] : ['fuel', 'tolls'].filter(x => !b && R && R[x] === 'company');
      sh.querySelectorAll('[data-payer]').forEach(el => { el.hidden = coPays.includes(el.dataset.payer) && !E.n(t[el.dataset.payer]); });
      const pb = sh.querySelector('#paidByCo'); pb.hidden = !coPays.length;
      pb.textContent = carLent ? 'Combustível, pedágio e danos ficam com o dono do carro.' : coPays.length ? `${coPays.map(x => x === 'fuel' ? 'Combustível' : 'Pedágio').join(' e ')} ${coPays.length > 1 ? 'são pagos' : 'é pago'} pela empresa neste contrato.` : '';
      const det = sh.querySelector('#detHos'); if (det && !b && (k.mode === 'hourly' || k.mode === 'cpm') && !det.dataset.auto) { det.open = true; det.dataset.auto = '1'; }
      sh.querySelector('#tPrev').innerHTML = b
        ? (() => {
          const cb = E.carBreakdown(t, s), parts = [];
          parts.push(cb.mode === 'owned' ? `frete de mercado ${fmt(cb.market)}` : `${fmtN(B.pct)}% de ${fmt(cb.market)} = ${fmt(cb.share)}`);
          if (cb.bonus) parts.push(`bônus ${fmt(cb.bonus)}`);
          if (cb.vehicle) parts.push(`− carro ${fmt(cb.vehicle)}`);
          const desp = cb.fuel + cb.tolls + cb.damage + cb.fines + cb.personal;
          if (desp) parts.push(`− despesas ${fmt(desp)}`);
          return `<div><div class="eyebrow">Resultado da viagem de carro</div><span class="muted" style="font-size:13px">${parts.join(' · ')}</span></div><b class="${cb.total < 0 ? 'neg' : 'pos'}">${fmt(cb.total)}</b>`;
        })()
        : (() => {
          const p = E.tripPay(t, s), M = k[k.mode] || {}, crl = E.commissionRule(k), parts = [];
          if (k.mode === 'weekly') parts.push(`fixo de ${fmt(M.value)} entra no fechamento`);
          if (k.mode === 'hourly') parts.push(`${fmtN(M.dailyCapOn ? Math.min(E.n(t.hours), E.n(M.dailyCap)) : E.n(t.hours))}h × ${fmt(M.rate)} = ${fmt(p.base)}`);
          if (k.mode === 'cpm') { parts.push(`${fmtN(t.miles)} mi × ${fmt(M.rate)} = ${fmt(p.base)}`); if (p.detention) parts.push(`espera ${fmt(p.detention)}`); if (p.stops) parts.push(`paradas ${fmt(p.stops)}`); }
          if (crl.on) parts.push(`${fmtN(crl.pct)}% de ${fmt(mf)} = ${fmt(p.commission)}`);
          if (p.layover) parts.push(`layover ${fmt(p.layover)}`); if (p.breakdown) parts.push(`quebra ${fmt(p.breakdown)}`); if (p.tarp) parts.push(`lona ${fmt(p.tarp)}`);
          if (p.bonus) parts.push(`bônus ${fmt(p.bonus)}`);
          return `<div><div class="eyebrow">Ganho bruto da viagem</div><span class="muted" style="font-size:13px">${parts.join(' · ')}${costs.total ? ` · você paga ${fmt(costs.total)} de despesas` : ''}</span></div><b class="pos">${fmt(p.total)}</b>`;
        })();
    };
    prev();
    sh.addEventListener('input', e => { const k = e.target.dataset.k; if (!k) return; t[k] = e.target.value; prev(); });
    sh.addEventListener('change', e => {
      if (e.target.id === 't_mode') { t.contract = clone(s.contract); t.contract.mode = e.target.value; prev(); return; }
      if (e.target.dataset.kb) { t[e.target.dataset.kb] = e.target.checked; prev(); return; }
      const k = e.target.dataset.k; if (k) { t[k] = e.target.value; prev(); }
    });
    sh.addEventListener('click', e => {
      const el = e.target.closest('button'); if (!el) return;
      if (el.dataset.type) {
        t.type = el.dataset.type; if (!t.rules && !editing) t.rules = E.rulesSnapshot(s);
        sh.querySelectorAll('[data-type]').forEach(b => b.setAttribute('aria-pressed', b.dataset.type === t.type)); prev();
      }
      if (el.dataset.inc || el.dataset.dec) { const k = el.dataset.inc || el.dataset.dec; t[k] = Math.max(0, E.n(t[k]) + (el.dataset.inc ? 1 : -1)); sh.querySelector('#st_' + k).textContent = t[k]; prev(); }
      if (el.hasAttribute('data-carnow')) { t.car = E.carSnapshot(s, E.carRuleOf(t, s).mode); prev(); }
      if (el.dataset.carmode) { t.car = E.carSnapshot(s, el.dataset.carmode); prev(); }
      if (el.hasAttribute('data-ctnow')) { t.contract = clone(s.contract); t.rules = E.rulesSnapshot(s); t.contractId = S.currentContractId; prev(); }
      if (el.hasAttribute('data-x')) closeModal();
      if (el.hasAttribute('data-save')) {
        const clean = { ...t };
        ['miles', 'freight', 'bonus', 'hours', 'drive', 'detention', 'stops', 'layover', 'breakdown', 'fuel', 'tolls', 'fines', 'damage', 'breakfast', 'lunch', 'dinner', 'hotel'].forEach(k => clean[k] = E.r2(clean[k]));
        clean.day = Math.max(1, parseInt(clean.day) || S.gameDay);
        clean.origin = (clean.origin || '').trim(); clean.dest = (clean.dest || '').trim();
        if (!clean.dest) { toast('Informe o destino da viagem.'); sh.querySelector('#t_dest').focus(); return; }
        commit(st => {
          const i = st.week.trips.findIndex(x => x.id === clean.id);
          if (i >= 0) st.week.trips[i] = clean; else st.week.trips.push(clean);
          [clean.origin, clean.dest].forEach(cn => { if (cn && !st.settings.cities.some(x => x.toLowerCase() === cn.toLowerCase())) st.settings.cities.push(cn); });
        });
        closeModal(); toast(editing ? 'Viagem atualizada' : 'Viagem lançada');
      }
      if (el.hasAttribute('data-del')) {
        commit(st => { st.week.trips = st.week.trips.filter(x => x.id !== t.id); });
        closeModal(); toast('Viagem excluída');
      }
    });
  });
}

async function closeWeekFlow() {
  const s = SS(), plan = weekClosePlan(), d = plan.d;
  const payday = s.payroll.lagOn ? E.paydayFor(S.week.start, s) : S.gameDay;
  const ok = await confirmBox(`Fechar semana ${weekLabel(S.week.start).toLowerCase()}?`,
    `<p style="margin:0 0 8px">As viagens vão para o histórico e o diário começa vazio.</p>
     <table class="bk"><tbody>
       <tr><td>Salário bruto${plan.safety ? ' (inclui bônus de segurança ' + fmt(plan.safety) + ')' : ''}</td><td>${fmt(d.revenue)}</td></tr>
       <tr><td>(−) Impostos e descontos</td><td>${fmt(d.deductions.total)}</td></tr>
       <tr class="t"><td>(=) Líquido do holerite</td><td>${fmt(d.takeHome)}</td></tr>
       <tr><td>(−) Despesas e custo de vida</td><td>${fmt(plan.living)}</td></tr>
       <tr class="t"><td>(=) Lucro líquido</td><td>${fmt(d.net)}</td></tr>
     </tbody></table>
     ${plan.viol.length ? `<div class="banner" style="margin-top:10px;flex-direction:column;align-items:flex-start;gap:4px"><b>${plan.viol.length} infraç${plan.viol.length === 1 ? 'ão' : 'ões'} de jornada nesta semana</b><span style="font-size:13px">${plan.viol.map(v => `Dia ${v.day}: ${esc(v.text)}`).join('<br>')}</span><span class="muted" style="font-size:12.5px">${s.hos.penalties ? `Ao fechar: ${s.hos.resetSafety ? 'o bônus de segurança zera; ' : ''}cada infração tem ${fmtN(s.hos.inspectChance)}% de chance de ser pega numa fiscalização, com multa de ${fmt(s.hos.fine)}.` : 'Consequências desligadas: só ficam registradas.'}</span></div>` : ''}
     <div class="preview" style="margin-top:10px"><div><div class="eyebrow">Holerite</div><span class="muted" style="font-size:13px">${s.payroll.lagOn ? 'Pagamento previsto para ' + dayFull(payday) : 'Depositado agora no saldo'}${plan.living ? `. As despesas (${fmt(plan.living)}) saem do saldo agora.` : ''}</span></div><b class="${d.takeHome < 0 ? 'neg' : 'pos'}">${fmt(d.takeHome)}</b></div>`, 'Fechar semana');
  if (!ok) return;
  let week;
  commit(st => {
    const start = st.week.start, trips = st.week.trips;
    week = { id: 'w' + start + '-' + uid().slice(0, 4), start, end: start + 6, trips: clone(trips), dre: d, settings: clone(s), closedDay: st.gameDay, contractId: st.currentContractId };
    const ids = new Set(trips.map(t => 'trip:' + t.id));
    st.ledger.forEach(e => { if (ids.has(e.ref)) e.locked = true; });
    const p = { id: uid(), weekStart: start, amount: d.takeHome, status: 'pending', payday,
      breakdown: { gross: d.revenue, ded: d.deductions.total, takeHome: d.takeHome, living: plan.living, net: d.net, tax: d.taxType, safety: plan.safety } };
    st.payroll.push(p);
    if (plan.living) st.ledger.push({ id: uid(), ref: 'living:' + p.id, day: st.gameDay, desc: `Despesas e custo de vida · semana ${weekLabel(start).toLowerCase()}`, amount: -plan.living, locked: true });
    if (!s.payroll.lagOn) payEntry(st, p, st.gameDay); else autoPay(st);
    st.career.safetyStreak = plan.newStreak;
    compact(st);
    // Fiscalização: sorteio por infração (só com consequências ligadas)
    st.career.violations = st.career.violations || [];
    for (const v of plan.viol) {
      const caught = s.hos.penalties && Math.random() * 100 < E.n(s.hos.inspectChance);
      const fine = caught ? E.r2(E.n(s.hos.fine)) : 0;
      st.career.violations.push({ id: uid(), day: v.day, code: v.code, text: v.text, caught, fine, week: start });
      if (caught && fine) st.ledger.push({ id: uid(), ref: 'fine:' + start, day: st.gameDay, desc: `Multa DOT · ${v.text} (dia ${v.day})`, amount: -fine, locked: true });
    }
    week.violations = plan.viol;
    st.career.k401 = E.r2(E.n(st.career.k401) + E.n(d.deductions.k401));
    st.week = { start: Math.max(E.weekStartOf(st.gameDay, s), start + 7), trips: [] };
  });
  H.push(week); H.sort((a, b) => a.start - b.start); saveLocal(); saveWeekRemote(week);
  const caughtNow = (S.career.violations || []).filter(v => v.week === week.start && v.caught);
  toast(caughtNow.length ? `Semana fechada · fiscalização pegou ${caughtNow.length} infraç${caughtNow.length === 1 ? 'ão' : 'ões'} (${fmt(caughtNow.reduce((a, v) => a + v.fine, 0))} em multas)` : plan.viol.length ? `Semana fechada · ${plan.viol.length} infraç${plan.viol.length === 1 ? 'ão' : 'ões'} registrada${plan.viol.length === 1 ? '' : 's'}, sem fiscalização` : plan.safety ? 'Semana fechada · bônus de segurança incluído' : 'Semana fechada · holerite gerado');
}

function exportFlow() {
  const data = JSON.stringify({ app: 'carreira-realista-ats', version: 1, exportedAt: new Date().toISOString(), state: S, history: H }, null, 2);
  const fallback = () => openModal(`<div class="row between"><h2>Exportar dados</h2><button class="btn ghost sm" data-x>Fechar</button></div><p class="muted" style="margin:0">Copie o texto abaixo e guarde num arquivo .json.</p><textarea id="expTxt" readonly>${esc(data)}</textarea><div class="row" style="justify-content:flex-end"><button class="btn primary" data-copy>Copiar</button></div>`, sh => {
    sh.querySelector('[data-x]').onclick = closeModal;
    sh.querySelector('[data-copy]').onclick = () => { const ta = sh.querySelector('#expTxt'); navigator.clipboard?.writeText(data).then(() => toast('Copiado'), () => { ta.select(); toast('Selecionado. Use Ctrl+C.'); }) ?? (ta.select(), toast('Selecionado. Use Ctrl+C.')); };
  });
  (window.claude?.use ? window.claude.use('downloads') : Promise.resolve(null)).then(dl => {
    if (!dl) return fallback();
    dl.save({ filename: `carreira-ats-dia-${S.gameDay}.json`, data }).then(() => toast('Arquivo salvo'), e => { if (e && e.code !== 'declined') fallback(); });
  }).catch(fallback);
}

document.querySelector('nav.tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;

$('#view').addEventListener('click', async e => {
  const el = e.target.closest('[data-goto],[data-act],[data-edit],[data-pay],[data-delweek],[data-delcity],[data-dellist],[data-addlist],[data-ctab],[data-editco],[data-delco],[data-delct],[data-ctpreset],[data-modt]'); if (!el) return;
  if (el.dataset.goto) { tab = el.dataset.goto; render(); window.scrollTo({ top: 0 }); return; }
  if (el.dataset.modt) {
    const key = el.dataset.modt, open = !openMods.has(key);
    open ? openMods.add(key) : openMods.delete(key);
    el.setAttribute('aria-expanded', open);
    el.querySelector('p').textContent = open || !el.dataset.sum ? el.dataset.desc : el.dataset.sum;
    el.closest('.mod').querySelector('.mod-b').hidden = !open;
    return;
  }
  if (el.dataset.ctab) { ctab = el.dataset.ctab; try { sessionStorage.setItem('ats-ctab', ctab); } catch (x) {} return render(); }
  if (el.dataset.editco !== undefined) return companyForm(el.dataset.editco || null);
  if (el.dataset.delco) {
    if (!await confirmBox('Excluir empresa?', 'A empresa sai da lista de opções.', 'Excluir', true)) return;
    return commit(st => { st.companies = st.companies.filter(x => x.id !== el.dataset.delco); });
  }
  if (el.dataset.delct) {
    if (!await confirmBox('Excluir contrato?', 'O contrato anterior sai do histórico. Ele não tem viagens ligadas.', 'Excluir', true)) return;
    return commit(st => { st.contracts = st.contracts.filter(x => x.id !== el.dataset.delct); });
  }
  if (el.dataset.ctpreset) {
    const key = el.dataset.ctpreset, label = E.PRESETS[key];
    if (!await confirmBox(`Aplicar condições de ${esc(label)}?`, `<p style="margin:0">Remuneração, quem paga as despesas, benefícios, bônus e custos do caminhão deste contrato voltam ao padrão de ${esc(label)}.</p><p class="muted" style="margin:8px 0 0;font-size:13px">Viagens já lançadas continuam como foram lançadas.</p>`, 'Aplicar')) return;
    commit(st => { const c = st.contracts.find(x => x.id === st.currentContractId); c.terms = presetTermsFor(key, c.terms, opIsOtr(c.operation)); });
    return toast('Condições aplicadas');
  }
  if (el.dataset.dellist) {
    const [key, i] = el.dataset.dellist.split(':');
    if (S.settings.lists[key].length <= 1) return toast('A lista precisa ter pelo menos uma opção.');
    return commit(st => { st.settings.lists[key].splice(+i, 1); });
  }
  if (el.dataset.addlist) {
    const key = el.dataset.addlist, inp = document.getElementById('new_' + key), v = inp.value.trim();
    if (!v) return; if (S.settings.lists[key].includes(v)) return toast('Essa opção já existe.');
    return commit(st => st.settings.lists[key].push(v));
  }
  if (el.dataset.edit) return openTrip(el.dataset.edit);
  if (el.dataset.pay) { commit(st => { const p = st.payroll.find(x => x.id === el.dataset.pay); if (p) payEntry(st, p, st.gameDay); }); return toast('Holerite depositado'); }
  if (el.dataset.delcity !== undefined) return commit(st => st.settings.cities.splice(+el.dataset.delcity, 1));
  if (el.dataset.delweek) {
    if (!await confirmBox('Excluir semana?', 'A semana sai do histórico. Holerite e saldo não mudam.', 'Excluir', true)) return;
    const id = el.dataset.delweek; H = H.filter(w => w.id !== id); saveLocal(); deleteWeekRemote(id); render(); return;
  }
  const a = el.dataset.act;
  if (a === 'new-trip') openTrip();
  if (a === 'new-contract') return newContractFlow(el.dataset.co);
  if (a === 'suggest-cpm') { const ex = EXPERIENCE.find(x => x[0] === S.profile.experience) || EXPERIENCE[0]; commit(st => { st.contracts.find(x => x.id === st.currentContractId).terms.contract.cpm.rate = E.r2((ex[2] + ex[3]) / 2); }); toast('CPM ajustado pela experiência'); }
  if (a === 'close-week') closeWeekFlow();
  if (a === 'pay-ready') { commit(st => st.payroll.filter(p => p.status !== 'paid' && p.payday <= st.gameDay).forEach(p => payEntry(st, p, p.payday))); toast('Holerite depositado'); }
  if (a === 'adjust') adjustFlow();
  if (a === 'export') exportFlow();
  if (a === 'import') importFlow();
  if (a === 'add-city') { const inp = $('#newCity'); const v = inp.value.trim(); if (v && !S.settings.cities.includes(v)) commit(st => st.settings.cities.push(v)); }
  if (a === 'reset-rules') { if (await confirmBox('Restaurar regras gerais?', 'Impostos, custos de vida, pay lag, jornada e calendário voltam ao padrão. Contratos, empresas, cidades, viagens e saldo continuam.', 'Restaurar')) commit(st => { const c = st.settings.cities, L = st.settings.lists; st.settings = E.defaults(); st.settings.cities = c; st.settings.lists = L; TERM_KEYS.forEach(k => delete st.settings[k]); }); }
  if (a === 'start-blank') return newCareerFlow();
  if (a === 'import-sheet') importSheetFlow();
  if (a === 'sheet-template') downloadTemplate();
  if (a === 'export-sheet') exportSheet();
  if (a === 'wipe') {
    if (!await confirmBox('Apagar tudo?', 'Ficha, viagens, holerites e histórico serão apagados nesta conta. Exporte antes se quiser guardar.', 'Apagar tudo', true)) return;
    const ids = H.map(w => w.id); S = null; H = []; clearLocal(); render();
    if (store.db) { try { await mainRef().delete(); for (const id of ids) await deleteWeekRemote(id); } catch (x) { handleDbError(x); } }
  }
});
$('#view').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'newCity') { e.preventDefault(); document.querySelector('[data-act="add-city"]').click(); }
  if (e.target.id && e.target.id.startsWith('new_')) { e.preventDefault(); document.querySelector(`[data-addlist="${e.target.id.slice(4)}"]`).click(); }
});
$('#view').addEventListener('change', e => {
  const el = e.target; const path = el.dataset.bind; if (!path) return;
  let v = el.dataset.type === 'bool' ? el.checked : el.dataset.type === 'num' ? E.n(el.value) : el.value;
  if (path === 'gameDay') v = Math.max(1, Math.round(v));
  if (path === 'settings.payroll.lagWeeks') v = Math.max(0, Math.round(v));
  commit(st => {
    setP(path, v);
    if (path === 'gameDay') autoPay(st);
    if ((path === 'settings.loan.on' && v) || path === 'settings.loan.freq') { if (!st.career.loanNext || path === 'settings.loan.freq') st.career.loanNext = st.gameDay + loanPeriod(st.settings); }
    if (path === 'career.loanNext') st.career.loanNext = Math.max(1, Math.round(v));
  }, { view: el.hasAttribute('data-rerender') || path === 'gameDay' || path.startsWith('settings.loan') || path === 'bank.loanTotal' || path === 'career.loanNext' || path === 'bank.opening' });
});

/* ---------- Medidas do cabeçalho (posição do aviso e da navegação no PC) ---------- */
function measureChrome() {
  const hdr = document.querySelector('header.sign'), nav = document.querySelector('nav.tabs'), root = document.documentElement;
  const h = hdr.offsetHeight, top = getComputedStyle(nav).position === 'sticky' ? nav.offsetHeight : 0;
  root.style.setProperty('--hdr-h', h + 'px');
  root.style.setProperty('--toast-top', (h + top + 10) + 'px');
}
window.addEventListener('resize', measureChrome);
if (window.ResizeObserver) new ResizeObserver(measureChrome).observe(document.querySelector('header.sign'));

/* ---------- Início ---------- */
try { const t = sessionStorage.getItem('ats-tab'); if (t) tab = t; } catch (e) {}
loadLocal();
render();
measureChrome();
connectDb();

</script>
