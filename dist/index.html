<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Carreira Realista ATS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: coluna única de logbook (até 860px), placa verde de rodovia no topo, navegação inferior fixa */
:root{
  --bg:#e8ece9; --panel:#ffffff; --panel-2:#f3f6f4; --ink:#16201b; --muted:#5a6a62; --line:#d2dad5;
  --sign:#0d6a3c; --sign-2:#0a5730; --sign-ink:#ffffff; --amber:#b77c00; --amber-bg:#fbf0d4;
  --red:#b3261e; --red-bg:#fbe5e3; --ok:#18794a; --ok-bg:#dff2e7; --shield:#1b3f8f;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(15,30,22,.06),0 2px 10px rgba(15,30,22,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1311; --panel:#161d1a; --panel-2:#1c2521; --ink:#e4ebe7; --muted:#92a39a; --line:#28332e;
  --sign:#14824b; --sign-2:#0f6a3c; --sign-ink:#ffffff; --amber:#e3a92b; --amber-bg:#3a2e12;
  --red:#ef7a70; --red-bg:#3d1c19; --ok:#4cc386; --ok-bg:#153223; --shield:#6f97f0;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1311; --panel:#161d1a; --panel-2:#1c2521; --ink:#e4ebe7; --muted:#92a39a; --line:#28332e;
  --sign:#14824b; --sign-2:#0f6a3c; --sign-ink:#ffffff; --amber:#e3a92b; --amber-bg:#3a2e12;
  --red:#ef7a70; --red-bg:#3d1c19; --ok:#4cc386; --ok-bg:#153223; --shield:#6f97f0;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  font-variant-numeric:tabular-nums;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sign)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Placa de rodovia */
.sign{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sign);color:var(--sign-ink)}
.sign .wrap{padding-block:10px 12px}
.sign-inner{border:2px solid rgba(255,255,255,.85);border-radius:9px;padding:8px 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 180px}
.brand b{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;line-height:1.05;text-transform:uppercase}
.brand span{font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayctl{display:flex;align-items:center;gap:6px}
.dayctl button{width:34px;height:34px;border-radius:8px;border:1.5px solid rgba(255,255,255,.7);background:transparent;color:#fff;font-size:20px;line-height:1}
.dayctl button:hover{background:rgba(255,255,255,.12)}
.mile{background:#fff;color:var(--sign-2);border-radius:6px;padding:2px 10px;text-align:center;min-width:64px;font-family:var(--display)}
.mile small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin-bottom:-3px}
.mile b{font-size:24px;font-weight:700}
.bal{text-align:right;font-family:var(--display)}
.bal small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.bal b{font-size:22px;font-weight:600}

main{padding-block:16px 24px;display:flex;flex-direction:column;gap:16px}
@media (max-width:560px){
  .sign .wrap{padding-block:6px 8px}
  .sign-inner{padding:6px 10px;gap:4px 10px;border-width:1.5px}
  .brand{flex:1 1 100%}
  .brand b{display:none}
  .bal{margin-left:auto}
  .bal b{font-size:20px}
  .mile b{font-size:21px}
}

h2{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.03em;text-transform:uppercase;margin:0}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:12px 14px;min-width:0}
.stat .v{font-family:var(--display);font-size:clamp(20px,6.2vw,26px);font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.stat .s{font-size:12.5px;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:1fr 1fr}.stats .stat:first-child{grid-column:1/-1}.stats.two .stat:first-child{grid-column:auto}}
.stats.two{grid-template-columns:1fr 1fr}

.pos{color:var(--ok)} .neg{color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--amber-bg);color:var(--amber);border-color:transparent}
.chip.bad{background:var(--red-bg);color:var(--red);border-color:transparent}
.chip.wrapok{white-space:normal;border-radius:12px}
.chip.loan{background:transparent;color:var(--shield);border-color:var(--shield)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:9px 14px;font-weight:600;border:1px solid var(--line);background:var(--panel);min-height:40px}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--sign);border-color:var(--sign);color:var(--sign-ink)}
.btn.primary:hover{background:var(--sign-2)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* DRE */
.dre{width:100%;border-collapse:collapse}
.dre td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:baseline}
.dre td.num{text-align:right;white-space:nowrap;padding-left:12px}
.dre td.pct{text-align:right;width:62px;color:var(--muted);font-size:13px;padding-left:8px}
.dre tr.grp td{font-weight:700;font-family:var(--display);font-size:16px;letter-spacing:.02em;text-transform:uppercase;padding-top:12px}
.dre tr.sub td:first-child{padding-left:14px;color:var(--muted)}
.dre tr.off td{opacity:.45}
.dre tr.info td{font-style:italic;color:var(--muted);font-size:13px}
.dre tr.subtotal td{font-weight:700;border-bottom:2px solid var(--line)}
details.more{border:1px solid var(--line);border-radius:9px;background:var(--panel-2)}
details.more>summary{cursor:pointer;padding:10px 12px;font-weight:600;font-size:14px;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:" +";color:var(--muted)}
details.more[open]>summary::after{content:" −"}
details.more .grid{padding:0 12px 12px}
.checks{display:flex;flex-wrap:wrap;gap:4px 16px}
.hosrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.hosrow:last-child{border-bottom:0}
.alerts{display:flex;flex-wrap:wrap;gap:6px}
.bk{width:100%;border-collapse:collapse;font-size:13.5px}
.bk td{padding:3px 0}
.bk td:last-child{text-align:right;white-space:nowrap}
.bk tr.t td{font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.dre tr.total td{border-bottom:0;border-top:2px solid var(--ink);font-family:var(--display);font-size:20px;font-weight:700;padding-top:10px}

/* Viagens */
.daygrp{display:flex;flex-direction:column;gap:8px}
.dayhead{display:flex;align-items:baseline;gap:8px;padding:2px 2px}
.dayhead b{font-family:var(--display);font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.trip{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;text-align:left;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:var(--r)}
.trip:hover{border-color:var(--sign)}
.route{font-weight:600;font-size:15.5px;min-width:0;overflow-wrap:anywhere}
.route .arr{color:var(--sign);font-weight:700;padding:0 4px}
.trip .amt{text-align:right;font-family:var(--display);font-size:19px;font-weight:600}
.trip .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.trip .res{text-align:right;font-size:13px;white-space:nowrap}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r);background:var(--amber-bg);color:var(--ink);border:1px solid var(--amber)}

/* Tabelas largas */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tbl{border-collapse:collapse;width:100%;font-size:13.5px;min-width:640px}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--panel-2);font-weight:600}
.tbl td.num,.tbl th.num{text-align:right}

details.week{border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
details.week>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
details.week>summary::-webkit-details-marker{display:none}
details.week>summary b{font-family:var(--display);font-size:17px;letter-spacing:.03em;text-transform:uppercase}
details.week[open]>summary{border-bottom:1px solid var(--line)}
details.week .body{padding:12px 14px;display:flex;flex-direction:column;gap:12px}

.ledger{display:flex;flex-direction:column}
.ledger .li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ledger .li:last-child{border-bottom:0}

/* Ajustes */
.mod{border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.mod-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px}
.mod-h .t{min-width:0;display:block}
.mod-t{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;background:none;padding:0;text-align:left;color:inherit;cursor:pointer}
.caret{width:10px;height:10px;flex:none;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px 0;transition:transform .15s}
.mod-t[aria-expanded="true"] .caret{transform:rotate(225deg);margin:4px 4px 0 0}
.mod.off .mod-h p{opacity:.7}
.lab-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.lab-row label,.lab-row .lab{min-width:0}
.help-btn{width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid var(--muted);background:transparent;color:var(--muted);font:700 13px/1 var(--body);padding:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.help-btn::after{content:"";position:absolute;inset:-8px}
.help-btn:hover{border-color:var(--sign);color:var(--sign)}
.help-btn[aria-expanded="true"]{background:var(--sign);border-color:var(--sign);color:var(--sign-ink)}
.help{font-size:13px;line-height:1.5;background:var(--panel-2);border-left:3px solid var(--sign);border-radius:6px;padding:8px 10px;color:var(--ink);font-weight:400;text-transform:none;letter-spacing:0;font-family:var(--body)}
.help p{margin:0 0 4px}.help p:last-child{margin:0}
.chk-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hrow{display:flex;align-items:center;gap:8px}
.rulechip{cursor:pointer;font:inherit;font-size:12px;font-weight:600;text-align:left;white-space:normal}
.rulechip .ri{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1.5px solid currentColor;font-size:10.5px;margin-left:4px;line-height:1}
.rulechip[aria-expanded="true"]{outline:2px solid currentColor;outline-offset:1px}
.hosrow{flex-direction:column;align-items:stretch}
.hosboxes{display:flex;flex-direction:column;gap:6px}
.sumtbl td small{display:block}
.sumtbl .lab-row{display:inline}
.sumtbl .help-btn{vertical-align:middle;margin-left:6px;width:20px;height:20px;font-size:11.5px}
.sumtbl{width:100%;border-collapse:collapse}
.sumtbl td{padding:7px 0;border-bottom:1px solid var(--line)}
.sumtbl td:last-child{text-align:right;white-space:nowrap}
.sumtbl tr.tot td{border-bottom:0;border-top:2px solid var(--ink);font-family:var(--display);font-size:20px;font-weight:700;padding-top:10px}
.sumtbl td small{color:var(--muted);font-size:12.5px}
.mod-h p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.mod-b{padding:4px 14px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.mod.off .mod-b{opacity:.45;pointer-events:none}
.mod-b .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.field .lab{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:8px 10px;min-height:40px}
.field input:focus,.field select:focus{border-color:var(--sign);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--sign) 22%,transparent)}
.inline-opt{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 0}
.inline-opt input{width:18px;height:18px;accent-color:var(--sign)}
.money{position:relative}
.money::before{content:"$";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.money input{padding-left:22px}
.pctf{position:relative}
.pctf::after{content:"%";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}

.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+span{background:var(--sign)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2px solid var(--amber);outline-offset:2px}

.cities{display:flex;flex-wrap:wrap;gap:6px}
.cities .chip{white-space:normal;max-width:100%;overflow-wrap:anywhere}
.cities .chip button{border:0;background:none;padding:0 0 0 2px;color:inherit;font-size:14px;line-height:1}

/* Navegação inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:860px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{border:0;background:none;padding:8px 0 9px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.02em}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--sign)}
nav.tabs button[aria-current="page"] svg{stroke-width:2.3}

.fab{position:fixed;z-index:24;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(76px + env(safe-area-inset-bottom,0px));
  border-radius:99px;padding:12px 18px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.fab .fab-ic{font-size:20px;line-height:1}
body.has-fab main{padding-bottom:92px}
@media (max-width:699px){.fab{width:56px;height:56px;padding:0}.fab .fab-tx{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.fab .fab-ic{font-size:28px}}

/* Modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,14,11,.55);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.ov{align-items:center}}
.sheet{background:var(--panel);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet{border-radius:14px}}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg3 button{border:0;background:var(--panel-2);padding:9px 4px;font-weight:600;color:var(--muted)}
.seg3 button[aria-selected="true"]{background:var(--sign);color:var(--sign-ink)}
.sheet .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sheet .grid .full{grid-column:1/-1}
@media (max-width:339px){.sheet .grid{grid-template-columns:1fr}}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--panel-2);padding:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sign);color:var(--sign-ink)}
.steppers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:420px){.steppers{grid-template-columns:repeat(2,minmax(0,1fr))}}
.step{border:1px solid var(--line);border-radius:9px;padding:6px;text-align:center;background:var(--panel-2)}
.step .lab{font-size:12px;font-weight:600;color:var(--muted)}
.step .ctl{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:2px}
.step .ctl button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--panel);font-size:17px;line-height:1}
.step .ctl b{font-family:var(--display);font-size:20px}
.step.off{opacity:.4}
.preview{border-radius:9px;background:var(--panel-2);border:1px solid var(--line);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.preview b{font-family:var(--display);font-size:22px}
textarea{width:100%;min-height:140px;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--toast-top,120px) + env(safe-area-inset-top,0px));max-width:calc(100% - 32px);text-align:center;z-index:60;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.wait{background:var(--amber)}

.onb{display:flex;flex-direction:column;gap:14px;padding:22px 18px}
.onb p{margin:0;max-width:60ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* PC: navegação no topo, logo abaixo do cabeçalho */
@media (min-width:900px){

<script>
/* ===== Motor de cálculo — Carreira Realista ATS =====
   Regras realistas (EUA 2026), com módulos que podem ser ligados/desligados. Cada viagem guarda as regras do
   momento em que foi lançada (contrato, carro, despesas e frete).
   Funções puras, sem DOM. */
const Engine = (() => {
  const WEEKDAYS = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
  const WEEKDAYS_FULL = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
  const STATUSES = ['Excelente', 'Bom', 'Regular', 'Ruim', 'Atrasada'];
  const n = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
  const r2 = v => Math.round((n(v) + Number.EPSILON) * 100) / 100;
  const sum = (arr, f) => arr.reduce((a, t) => a + (typeof f === 'function' ? f(t) : n(t[f])), 0);
  const clone = o => JSON.parse(JSON.stringify(o));
  // As cinco classificações de vínculo (fixas: as predefinições dependem delas)
  const CLASSIFICATIONS = [
    'Nível 1: Company Driver (Empregado W-2)',
    'Nível 2: Lease Operator (Arrendatário)',
    'Nível 3: Owner-Operator (1099)',
    'Nível 4: Owner-Operator com Autoridade Própria (MC/DOT)',
    'Nível 5: Dono de Frota (Fleet Owner)'
  ];
  // Tipos de operação usados no mercado americano
  const OPERATIONS = ['Local (Day Cab)', 'Regional', 'Dedicated (cliente fixo)', 'OTR / Long Haul (Sleeper Cab)'];

  // Imposto de renda federal 2026 (IRS / Tax Foundation)
  const TAX2026 = {
    single:  { std: 16100, br: [[12400, .10], [50400, .12], [105700, .22], [201775, .24], [256225, .32], [640600, .35], [Infinity, .37]] },
    married: { std: 32200, br: [[24800, .10], [100800, .12], [211400, .22], [403550, .24], [512450, .32], [768700, .35], [Infinity, .37]] }
  };

  function defaults() {
    return {
      day1Weekday: 0,
      costs: {
        breakfast: { on: true, val: 15 },
        lunch:     { on: true, val: 35 },
        dinner:    { on: true, val: 30 },
        hotel:     { on: true, val: 80 },
        housing:   { on: true, val: 500 },
        mealsMode: 'trip',                                   // trip = por viagem (planilha) | day = por dia trabalhado
        auto: { breakfast: false, lunch: true, dinner: false } // refeições automáticas por dia trabalhado
      },
      tripBonus: true,                                       // somar bônus das viagens de caminhão
      // Quem paga cada despesa da viagem de caminhão: 'driver' | 'company'
      expenses: { fuel: 'company', tolls: 'company', hotel: 'company', fines: 'driver', damage: 'deductible', deductible: 1000 },
      // Converte o frete inflado do jogo em frete de mercado antes da comissão
      market: { on: true, mode: 'factor', factor: 0.10, rpm: 2.5 },
      contract: {
        mode: 'weekly',
        hours: 50,
        tripBonus: true,
        weekly:  { value: 1300, commissionOn: true, commission: 5 },
        hourly:  { rate: 26, dailyCapOn: true, dailyCap: 10, weeklyCapOn: true, commissionOn: true, commission: 5, overtimeOn: false, otAfter: 40, otMult: 1.5 },
        cpm:     { rate: 0.55, detentionOn: true, detentionRate: 20, detentionFree: 2, stopOn: true, stopRate: 50, commissionOn: false, commission: 5 },
        percent: { commission: 25 },
        minimum: { on: false, value: 1100 },
        extras:  { layoverOn: true, layoverRate: 150, breakdownOn: true, breakdownRate: 20, tarpOn: false, tarpRate: 75 }
      },
      taxes: { on: true, type: 'w2', filing: 'single', federal: 'table', flatPct: 12, ficaPct: 7.65, sePct: 15.3, statePct: 0, qbi: true },
      benefits: { healthOn: true, health: 45, k401On: false, k401Pct: 4 },
      perDiem: { on: false, rate: 80 },
      opCosts: { on: false, maintenance: 0.404, tires: 0.05, insurance: 0.10, truckWeekly: 650, otherWeekly: 50 },
      hos: { on: true, cycle: '70/8', shortHaul: true, radius: 150, restart: true, penalties: true, resetSafety: true, inspectChance: 25, fine: 1000 },
      safety: { on: true, weeks: 13, amount: 300 },
      renome: { on: false, pct: 0 },
      borrowed: {
        on: true, settle: 'immediate', bonusOn: true,
        factor: 0.40,          // frete de mercado do carro = frete do jogo × fator
        bonusFactor: true,     // aplicar o mesmo fator ao bônus da viagem de carro
        pct: 35,               // emprestado: % do frete de mercado, sem custos do veículo
        personal: true,        // emprestado: refeições, hotel e multas continuam com o motorista
        ownOn: true,           // permitir carro próprio
        costPerMile: 0.50      // próprio: manutenção, pneus, seguro e depreciação por milha
      },
      payroll: { lagOn: true, lagWeeks: 1, paydayWeekday: 4, autoPay: true },
      loan: { on: false, installment: 0, freq: 'monthly', rate: 0 },   // parcela semanal ou mensal (30 dias), juros ao mês
      bills: { on: true, weekday: 0 },                                  // contas fixas cobradas pelo calendário, mesmo sem salário
      cities: ['Reno', 'Truckee', 'Carson City', 'Tonopah'],
      lists: { operation: OPERATIONS.slice() }
    };
  }

  function mergeDefaults(saved) {
    const walk = (base, over) => {
      if (!over || typeof over !== 'object' || Array.isArray(over)) return over === undefined ? base : over;
      const out = Array.isArray(base) ? [] : { ...base };
      for (const k of Object.keys(over)) {
        out[k] = (base && typeof base[k] === 'object' && !Array.isArray(base[k])) ? walk(base[k], over[k]) : over[k];
      }
      return out;
    };
    return walk(defaults(), saved || {});
  }

  /* ---------- Predefinições ---------- */
  const PRESETS = {
    w2:        'Company Driver (W-2)',
    lease:     'Lease Operator',
    owner:     'Owner-Operator (1099)',
    authority: 'Owner-Operator com autoridade própria',
    fleet:     'Dono de frota'
  };
  function presetKeyFor(classification) {
    const c = String(classification || '').toLowerCase();
    if (c.includes('frota') || c.includes('fleet')) return 'fleet';
    if (c.includes('autoridade') || c.includes('mc/dot')) return 'authority';
    if (c.includes('lease') || c.includes('arrend')) return 'lease';
    if (c.includes('owner') || c.includes('1099')) return 'owner';
    return 'w2';
  }
  // Aplica as condições típicas do vínculo a um conjunto de condições de contrato
  // (contract, expenses, benefits, perDiem, opCosts, safety). O tipo fiscal sai da classificação.
  function applyPreset(s, key, { otr = false } = {}) {
    const all = v => ({ fuel: v, tolls: v, hotel: v, fines: 'driver', damage: v === 'driver' ? 'driver' : 'deductible', deductible: s.expenses.deductible || 1000 });
    s.safety.on = key !== 'authority' && key !== 'fleet';
    s.benefits.healthOn = true;
    s.perDiem.on = !!otr;
    if (key === 'w2') { s.expenses = all('company'); s.opCosts.on = false; return s; }
    // Lease / owner-operator / autoridade / frota: paga tudo, recebe % do frete
    s.expenses = all('driver'); s.opCosts.on = true; s.contract.mode = 'percent';
    const P = { lease: [70, 650, 0.08, 60], owner: [75, 600, 0.10, 80], authority: [100, 600, 0.16, 180], fleet: [100, 600, 0.16, 250] }[key];
    if (P) { s.contract.percent.commission = P[0]; s.opCosts.truckWeekly = P[1]; s.opCosts.insurance = P[2]; s.opCosts.otherWeekly = P[3]; }
    return s;
  }
  const taxTypeFor = classification => presetKeyFor(classification) === 'w2' ? 'w2' : '1099';

  /* ---------- Calendário ---------- */
  const weekdayIdx = (day, s) => (((day - 1 + n(s.day1Weekday)) % 7) + 7) % 7;
  const weekStartOf = (day, s) => day - weekdayIdx(day, s);
  const dayLabel = (day, s) => WEEKDAYS[weekdayIdx(day, s)];
  const paydayFor = (weekStart, s) => weekStartOf(weekStart, s) + 7 * n(s.payroll.lagWeeks) + n(s.payroll.paydayWeekday);

  /* ---------- Regras gravadas na viagem ---------- */
  const _cache = new WeakMap();
  function contractOf(t, s) {
    if (!t || !t.contract) return s.contract;
    if (!_cache.has(t.contract)) _cache.set(t.contract, mergeDefaults({ contract: t.contract }).contract);
    return _cache.get(t.contract);
  }
  // Regra do carro gravada na viagem; sem regra gravada, usa a atual (emprestado)
  const carRuleOf = (t, s) => (t && t.car && t.car.mode) ? t.car : carSnapshot(s, 'borrowed');
  function carSnapshot(s, mode = 'borrowed') {
    const b = s.borrowed;
    return { mode, pct: n(b.pct), bonusOn: b.bonusOn !== false, factor: n(b.factor), bonusFactor: b.bonusFactor !== false, personal: b.personal !== false, costPerMile: n(b.costPerMile) };
  }
  const snapshotFor = (type, s, carMode) => type === 'borrowed' ? { car: carSnapshot(s, carMode) } : { contract: clone(s.contract) };
  const rulesSnapshot = s => ({ exp: clone(s.expenses), market: clone(s.market) });

  // Frete de mercado do caminhão (o carro usa o próprio fator em carBreakdown)
  function marketFreight(t, s) {
    const m = (t.rules && t.rules.market) || (s && s.market);
    if (!m || !m.on || t.type === 'borrowed') return n(t.freight);
    return m.mode === 'rpm' ? n(t.miles) * n(m.rpm) : n(t.freight) * n(m.factor);
  }

  // Despesas que saem do bolso do motorista nesta viagem
  function tripCosts(t, s) {
    const c = s.costs, car = t.type === 'borrowed', R = (t.rules && t.rules.exp) || s.expenses;
    const pays = k => car || R[k] === 'driver';
    const meals = car || c.mealsMode !== 'day';
    let damage = 0;
    if (car) damage = n(t.damage);
    else damage = R.damage === 'driver' ? n(t.damage) : R.damage === 'deductible' ? Math.min(n(t.damage), n(R.deductible)) : 0;
    const o = {
      fuel:      pays('fuel')  ? n(t.fuel)  : 0,
      tolls:     pays('tolls') ? n(t.tolls) : 0,
      breakfast: meals && c.breakfast.on ? n(t.breakfast) * n(c.breakfast.val) : 0,
      lunch:     meals && c.lunch.on     ? n(t.lunch)     * n(c.lunch.val)     : 0,
      dinner:    meals && c.dinner.on    ? n(t.dinner)    * n(c.dinner.val)    : 0,
      hotel:     (c.hotel.on && (car || R.hotel === 'driver')) ? n(t.hotel) * n(c.hotel.val) : 0,
      fines:     pays('fines') ? n(t.fines) : 0,
      damage
    };
    for (const k in o) o[k] = r2(o[k]);
    o.total = r2(sum(Object.values(o), x => x));
    return o;
  }

  // Resultado da viagem de carro, com o detalhamento
  function carBreakdown(t, s) {
    const B = carRuleOf(t, s), c = tripCosts(t, s);
    const o = { mode: B.mode, market: n(t.freight) * n(B.factor), share: 0, bonus: 0, vehicle: 0, fuel: 0, tolls: 0, damage: 0, fines: 0, personal: 0, total: 0 };
    o.bonus = B.bonusOn !== false ? n(t.bonus) * (B.bonusFactor !== false ? n(B.factor) : 1) : 0;
    if (B.mode === 'owned') {                        // dono: 100% do frete, paga tudo
      o.share = o.market; o.vehicle = n(t.miles) * n(B.costPerMile);
      o.fuel = n(t.fuel); o.tolls = n(t.tolls); o.damage = n(t.damage); o.fines = n(t.fines); o.personal = c.breakfast + c.lunch + c.dinner + c.hotel;
    } else {                                         // emprestado: % do frete, o dono paga o veículo
      o.share = o.market * n(B.pct) / 100;
      if (B.personal !== false) { o.fines = n(t.fines); o.personal = c.breakfast + c.lunch + c.dinner + c.hotel; }
    }
    for (const k in o) if (typeof o[k] === 'number') o[k] = r2(o[k]);
    o.total = r2(o.share + o.bonus - o.vehicle - o.fuel - o.tolls - o.damage - o.fines - o.personal);
    return o;
  }
  const borrowedValue = (t, s) => carBreakdown(t, s).total;

  function commissionRule(k) {
    const M = k[k.mode] || {};
    if (k.mode === 'percent') return { on: true, pct: n(M.commission) };
    return { on: !!M.commissionOn, pct: n(M.commission) };
  }
  const detentionPay = (t, M) => M.detentionOn ? Math.max(0, n(t.detention) - n(M.detentionFree)) * n(M.detentionRate) : 0;
  const stopPay = (t, M) => M.stopOn ? n(t.stops) * n(M.stopRate) : 0;

  // Ganho de uma viagem de caminhão pelo contrato gravado nela
  function tripPay(t, s) {
    const k = contractOf(t, s), M = k[k.mode] || {}, X = k.extras || {}, c = commissionRule(k);
    const p = { mode: k.mode, base: 0, detention: 0, stops: 0, layover: 0, breakdown: 0, tarp: 0, commission: 0, bonus: 0, market: r2(marketFreight(t, s)) };
    if (k.mode === 'hourly') p.base = (M.dailyCapOn ? Math.min(n(t.hours), n(M.dailyCap)) : n(t.hours)) * n(M.rate);
    if (k.mode === 'cpm') { p.base = n(t.miles) * n(M.rate); p.detention = detentionPay(t, M); p.stops = stopPay(t, M); }
    if (X.layoverOn) p.layover = n(t.layover) * n(X.layoverRate);
    if (X.breakdownOn) p.breakdown = n(t.breakdown) * n(X.breakdownRate);
    if (X.tarpOn && t.tarp) p.tarp = n(X.tarpRate);
    p.commission = c.on ? p.market * c.pct / 100 : 0;
    p.bonus = k.tripBonus ? n(t.bonus) : 0;
    for (const key of ['base', 'detention', 'stops', 'layover', 'breakdown', 'tarp', 'commission', 'bonus']) p[key] = r2(p[key]);
    p.total = r2(p.base + p.detention + p.stops + p.layover + p.breakdown + p.tarp + p.commission + p.bonus);
    return p;
  }

  // income: renda anual antes da dedução padrão. qbi: renda qualificada do negócio (1099);
  // a dedução é 20% do menor entre a QBI e a renda tributável (Section 199A, permanente desde 2025).
  function annualTax(income, filing, { qbi = 0 } = {}) {
    const T = TAX2026[filing] || TAX2026.single;
    let taxable = Math.max(0, income - T.std);
    if (qbi > 0) taxable -= 0.2 * Math.min(qbi, taxable);
    let tax = 0, prev = 0;
    for (const [cap, rate] of T.br) { if (taxable <= prev) break; tax += (Math.min(taxable, cap) - prev) * rate; prev = cap; }
    return tax;
  }

  /* ---------- DRE semanal ---------- */
  function dre(trips, s, extra = {}) {
    const co = trips.filter(t => t.type !== 'borrowed');
    const bo = trips.filter(t => t.type === 'borrowed');
    const freight = r2(sum(co, 'freight'));
    const marketTotal = r2(sum(co, t => marketFreight(t, s)));
    const miles = r2(sum(co, 'miles'));
    const groups = { weekly: [], hourly: [], cpm: [], percent: [] };
    for (const t of co) { const k = contractOf(t, s); (groups[k.mode] || groups.percent).push({ t, k }); }
    const allDays = new Set(co.map(t => t.day));
    const baseLines = [];
    let hoursWorked = 0, hoursPaid = 0, overtime = 0;
    if (groups.weekly.length) {
      const k = groups.weekly[groups.weekly.length - 1].k;
      const days = new Set(groups.weekly.map(g => g.t.day));
      const share = allDays.size ? days.size / allDays.size : 1;
      baseLines.push({ mode: 'weekly', rate: n(k.weekly.value), share, days: days.size, totalDays: allDays.size, value: r2(n(k.weekly.value) * share) });
    } else if (!co.length && s.contract.mode === 'weekly') {
      baseLines.push({ mode: 'weekly', rate: n(s.contract.weekly.value), share: 1, days: 0, totalDays: 0, value: r2(n(s.contract.weekly.value)) });
    }
    if (groups.hourly.length) {
      const k = groups.hourly[groups.hourly.length - 1].k, M = k.hourly;
      const perDay = {};
      for (const g of groups.hourly) perDay[g.t.day] = (perDay[g.t.day] || 0) + n(g.t.hours);
      hoursWorked = r2(sum(groups.hourly, g => n(g.t.hours)));
      hoursPaid = Object.values(perDay).reduce((a, h) => a + (M.dailyCapOn ? Math.min(h, n(M.dailyCap)) : h), 0);
      if (M.weeklyCapOn) hoursPaid = Math.min(hoursPaid, n(k.hours));
      hoursPaid = r2(hoursPaid);
      if (M.overtimeOn) overtime = r2(Math.max(0, hoursPaid - n(M.otAfter)) * n(M.rate) * (n(M.otMult) - 1));
      baseLines.push({ mode: 'hourly', rate: n(M.rate), hoursWorked, hoursPaid, value: r2(hoursPaid * n(M.rate)), otAfter: M.overtimeOn ? n(M.otAfter) : null, otMult: n(M.otMult) });
    }
    if (groups.cpm.length) {
      const rates = [...new Set(groups.cpm.map(g => n(g.k.cpm.rate)))];
      const f = groups.cpm[0].k.cpm;
      baseLines.push({ mode: 'cpm', rate: rates.length === 1 ? rates[0] : null, miles: r2(sum(groups.cpm, g => n(g.t.miles))),
        value: r2(sum(groups.cpm, g => n(g.t.miles) * n(g.k.cpm.rate))), detentionRate: n(f.detentionRate), detentionFree: n(f.detentionFree), stopRate: n(f.stopRate) });
    }
    const base = r2(sum(baseLines, l => l.value));
    const pays = co.map(t => tripPay(t, s));
    const pick = k => r2(sum(pays, p => p[k]));
    const detention = pick('detention'), stops = pick('stops'), layover = pick('layover'), breakdown = pick('breakdown'), tarp = pick('tarp');
    const commission = pick('commission'), tripBonus = pick('bonus');
    const pcts = new Set(co.map(t => commissionRule(contractOf(t, s))).filter(c => c.on).map(c => c.pct));
    const modes = [...new Set(co.map(t => contractOf(t, s).mode))];

    const truckPay = r2(base + overtime + detention + stops + layover + breakdown + tarp + commission + tripBonus);
    const lastK = co.length ? contractOf(co[co.length - 1], s) : s.contract;
    const minimum = (co.length && lastK.minimum && lastK.minimum.on && truckPay < n(lastK.minimum.value)) ? r2(n(lastK.minimum.value) - truckPay) : 0;
    const renome = r2(s.renome.on ? (base + commission) * n(s.renome.pct) / 100 : 0);
    const safety = r2(extra.safety || 0);
    const borrowedTotal = r2(sum(bo, t => borrowedValue(t, s)));
    const borrowed = (s.borrowed.on && s.borrowed.settle === 'payroll') ? borrowedTotal : 0;
    const revenue = r2(truckPay + minimum + renome + safety + borrowed);

    // Despesas de viagem (bolso do motorista)
    const v = { fuel: 0, tolls: 0, breakfast: 0, lunch: 0, dinner: 0, hotel: 0, fines: 0, damage: 0 };
    for (const t of co) { const c = tripCosts(t, s); for (const key in v) v[key] += c[key]; }
    let workedDays = 0;
    if (s.costs.mealsMode === 'day') {
      workedDays = allDays.size;

    const amount = E.borrowedValue(t, s);
    const e = st.ledger.find(x => x.ref === 'trip:' + t.id);
    if (e) { e.amount = amount; e.day = t.day; e.desc = borrowedDesc(t); }
    else st.ledger.push({ id: uid(), ref: 'trip:' + t.id, day: t.day, desc: borrowedDesc(t), amount });
  }
}
function payEntry(st, p, day) {
  if (p.status === 'paid') return;
  p.status = 'paid'; p.paidDay = day;
  const label = p.breakdown && p.breakdown.tax === '1099' ? 'Acerto (settlement)' : 'Holerite';
  st.ledger.push({ id: uid(), ref: 'pay:' + p.id, day, desc: `${label} · semana ${weekLabel(p.weekStart).toLowerCase()}`, amount: p.amount, locked: true });
}

/* ---------- Contas fixas e empréstimo pelo calendário ---------- */
const loanPeriod = s => s.loan.freq === 'weekly' ? 7 : 30;
function payLoan(st, s, d) {
  const C = st.career, total = E.n(st.bank.loanTotal);
  if (total <= 0) { st.settings.loan.on = false; C.loanNext = null; return; }
  const interest = E.r2(total * E.n(s.loan.rate) / 100 * (s.loan.freq === 'weekly' ? 7 / 30 : 1));
  const amount = E.r2(Math.min(E.n(s.loan.installment), total + interest));
  st.bank.loanTotal = E.r2(Math.max(0, total + interest - amount));
  st.ledger.push({ id: uid(), ref: 'loan:' + d, day: d, desc: `Parcela do empréstimo${interest ? ` (juros ${fmt(interest)})` : ''}`, amount: -amount, locked: true });
  C.loanNext = C.loanNext + loanPeriod(s);
  if (st.bank.loanTotal <= 0) { st.settings.loan.on = false; C.loanNext = null; }
}
// Cobra, dia a dia, as contas fixas (no dia da semana escolhido) e as parcelas vencidas
function runBills(st) {
  const s = effSettings(st), C = st.career, to = st.gameDay;
  if (to <= C.billedThrough) return;
  for (let d = C.billedThrough + 1; d <= to; d++) {
    if (d < E.n(C.startDay)) continue;
    if (s.bills.on && E.weekdayIdx(d, s) === E.n(s.bills.weekday)) {
      const ws = E.weekStartOf(d, s), items = [];
      if (s.costs.housing.on && E.n(s.costs.housing.val)) items.push(['Moradia', E.n(s.costs.housing.val)]);
      if (s.opCosts.on && (E.n(s.opCosts.truckWeekly) + E.n(s.opCosts.otherWeekly))) items.push(['Parcela do caminhão e licenças', E.n(s.opCosts.truckWeekly) + E.n(s.opCosts.otherWeekly)]);
      for (const [label, v] of items) st.ledger.push({ id: uid(), ref: 'bill:' + ws, day: d, desc: `${label} · semana ${weekLabel(ws).toLowerCase()}`, amount: -E.r2(v), locked: true });
    }
    if (s.loan.on && C.loanNext && d >= C.loanNext) payLoan(st, s, d);
  }
  C.billedThrough = to;
}
function loanDueInWeek(st, start) {
  const s = effSettings(st), C = st.career; let sum = 0;
  for (const e of st.ledger) if (e.ref && e.ref.startsWith('loan:') && e.day >= start && e.day <= start + 6) sum -= E.n(e.amount);
  if (s.loan.on && C.loanNext) for (let d = C.loanNext; d <= start + 6; d += loanPeriod(s)) if (d >= start && d > C.billedThrough) sum += E.n(s.loan.installment);
  return E.r2(sum);
}
const billedThisWeek = st => E.r2(-st.ledger.filter(e => e.ref === 'bill:' + st.week.start).reduce((a, e) => a + E.n(e.amount), 0));
const weekDre = (extra = {}) => E.dre(S.week.trips, SS(), { loan: loanDueInWeek(S, S.week.start), ...extra });
function loanForecast(st) {
  const s = st.settings; let total = E.n(st.bank.loanTotal), n = 0, d = st.career.loanNext || st.gameDay;
  if (!s.loan.on || total <= 0 || E.n(s.loan.installment) <= 0) return '';
  while (total > 0.005 && n < 600) { const i = total * E.n(s.loan.rate) / 100 * (s.loan.freq === 'weekly' ? 7 / 30 : 1); if (E.n(s.loan.installment) <= i) return 'A parcela não cobre os juros: a dívida nunca termina.'; total = total + i - E.n(s.loan.installment); n++; d += loanPeriod(s); }
  return `Faltam ${n} parcela${n === 1 ? '' : 's'}; a última vence por volta do dia ${d - loanPeriod(s)}.`;
}

// Infrações de jornada da semana em aberto (só alertas de nível 'bad' + ciclo estourado)
function weekViolations() {
  const s = SS(); if (!s.hos.on) return [];
  const trucks = S.week.trips.filter(t => t.type !== 'borrowed');
  if (!trucks.length) return [];
  const days = [...new Set(trucks.map(t => t.day))].sort((a, b) => a - b);
  const recent = [...H.slice(-2).flatMap(w => w.trips || []), ...S.week.trips];
  const rep = E.hos(recent, s, { local: isLocalOp(), gameDay: days[days.length - 1], days });
  const v = [];
  rep.rows.forEach(r => r.alerts.filter(a => a.level === 'bad').forEach(a => v.push({ day: r.day, code: a.code, text: a.text })));
  const over = days.map(d => ({ d, r: E.hos(recent, s, { gameDay: d, days: [] }) })).find(x => x.r.over);
  if (over) v.push({ day: over.d, code: 'cycle', text: `Ciclo de ${over.r.limit}h estourado (${fmtN(over.r.cycleUsed)}h)` });
  return v;
}
const recentViolations = (st = S) => (st.career.violations || []).filter(v => v.day > st.gameDay - 56);

function weekClosePlan() {
  const s = SS();
  const hasTruck = S.week.trips.some(t => t.type !== 'borrowed');
  const viol = weekViolations();
  const hosHit = s.hos.penalties && s.hos.resetSafety && viol.length > 0;
  const clean = weekDre().clean && !hosHit;
  const streak = S.career.safetyStreak || 0;
  let newStreak = streak, safety = 0;
  if (s.safety.on && hasTruck) {
    if (clean) { newStreak = streak + 1; if (newStreak % Math.max(1, E.n(s.safety.weeks)) === 0) safety = E.n(s.safety.amount); }
    else newStreak = 0;
  }
  const d = weekDre({ safety });
  // parcelas do empréstimo e contas já cobradas pelo calendário não saem de novo no fechamento
  const living = E.r2(Math.max(0, d.variable.total + d.opCosts.total + d.fixed.total - d.fixed.loan - billedThisWeek(S)));
  return { d, safety, newStreak, living, viol, hosHit };
}

function autoPay(st) {
  if (!st.settings.payroll.autoPay) return;
  st.payroll.filter(p => p.status !== 'paid' && p.payday <= st.gameDay).forEach(p => payEntry(st, p, p.payday));
}
function normalizeWeek(st) {
  if (!st.week.trips.length) st.week.start = E.weekStartOf(st.gameDay, st.settings);
}
function commit(fn, { view = true } = {}) {
  fn(S);
  runBills(S);
  syncBorrowedLedger(S); normalizeWeek(S);
  S._rev = Date.now();
  persist();
  view ? render() : renderHeader();
}

/* ---------- Troca completa dos dados (nova carreira, importação) ---------- */
async function replaceAll(state, history) {
  const old = H.map(w => w.id);
  S = normalize(state); H = (history || []).slice().sort((a, b) => a.start - b.start);
  runBills(S);
  S._rev = Date.now();
  persist(); render();
  if (store.db) {
    for (const id of old) if (!H.find(w => w.id === id)) await deleteWeekRemote(id);
    for (const w of H) await saveWeekRemote(w);
  }
}

function dreSummary(d) {
  const r = (label, v, note = '', cls = '', key = '') => { const h = help(key, label); return `<tr class="${cls}"><td><span class="lab-row" style="justify-content:flex-start">${label}${h.btn}</span>${note ? `<small>${note}</small>` : ''}${h.box}</td><td class="${cls === 'tot' ? (v < 0 ? 'neg' : 'pos') : ''}">${fmt(v)}</td></tr>`; };
  const D = d.deductions || { total: 0 }, O = d.opCosts || { total: 0 };
  let h = '<table class="sumtbl"><tbody>';
  h += r(d.taxType === '1099' ? 'Receita bruta' : 'Salário bruto', d.revenue, `${d.counts.company} viage${d.counts.company === 1 ? 'm' : 'ns'} de caminhão · ${fmtN(d.miles)} mi`, '', 'ui.bruto');
  const self = d.taxType === '1099';
  if (D.total) h += r(self ? '(−) Reserva de impostos e descontos' : '(−) Impostos e descontos', D.total, `${self ? 'Líquido do acerto (settlement)' : 'Líquido do holerite'} ${fmt(d.takeHome)}`, '', self ? 'ui.reserva' : 'ui.impostos');
  if (d.variable.total) h += r('(−) Despesas de viagem', d.variable.total, '', '', 'ui.despesas');
  if (O.total) h += r('(−) Custos do caminhão', O.total, '', '', 'ui.caminhao');
  if (d.fixed.total) h += r('(−) Moradia e custos fixos', d.fixed.total, [d.fixed.loan ? `inclui parcela do empréstimo ${fmt(d.fixed.loan)}` : '', S.settings.bills.on ? `cobrados toda ${E.WEEKDAYS_FULL[S.settings.bills.weekday].toLowerCase()}` : ''].filter(Boolean).join(' · '), '', 'ui.fixos');
  h += r('(=) Lucro líquido', d.net, '', 'tot', 'ui.lucro');
  return h + '</tbody></table>';
}

function dreTable(d, s) {
  const R = d.revenue;
  const pct = v => R ? fmtN(v / R * 100) + '%' : '—';
  const k = s.contract, c = s.costs;
  const row = (label, v, cls = 'sub', on = true, keep = false) => (cls.startsWith('sub') && !cls.includes('subtotal') && !keep && Math.abs(E.n(v)) < 0.005) ? '' : `<tr class="${cls}${on ? '' : ' off'}"><td>${label}</td><td class="num">${fmt(v)}</td><td class="pct">${cls.includes('info') ? '' : pct(v)}</td></tr>`;
  let g = 0;
  const grp = (label, v) => row(`${++g}. ${label}`, v, 'grp');
  const M = k[k.mode] || {}, mode = d.mode || k.mode;
  const lines = d.baseLines || (mode === 'percent' || mode === 'none' ? [] : [{ mode, value: d.base, rate: mode === 'weekly' ? M.value : M.rate, hoursPaid: d.hoursPaid, hoursWorked: d.hoursWorked, miles: d.miles, share: 1, detentionRate: M.detentionRate, detentionFree: M.detentionFree, stopRate: M.stopRate }]);
  const lab = l => ({
    weekly: `Salário fixo semanal${l.share < 1 ? ` (${l.days} de ${l.totalDays} dias neste contrato × ${fmt(l.rate)})` : ''}`,
    hourly: `Horas trabalhadas (${fmtN(l.hoursPaid || 0)}h pagas${(l.hoursWorked || 0) > (l.hoursPaid || 0) ? ` de ${fmtN(l.hoursWorked)}h` : ''} × ${fmt(l.rate)})`,
    cpm: `Milhas rodadas (${fmtN(l.miles)} mi${l.rate != null ? ` × ${fmt(l.rate)}` : ', taxas por viagem'})`
  })[l.mode] || 'Salário base';
  let h = '<table class="dre"><tbody>';
  h += grp(d.taxType === '1099' ? 'Receita bruta (settlement)' : 'Receita bruta (salário)', R);
  if (!lines.length) h += row('Sem salário fixo', 0, 'sub', false, true);
  for (const l of lines) h += row(lab(l), l.value, 'sub', true, true);
  const hl = lines.find(l => l.mode === 'hourly');
  if (d.overtime) h += row(`Hora extra (acima de ${fmtN(hl && hl.otAfter)}h × ${fmtN(hl && hl.otMult)})`, d.overtime);
  const cpmL = lines.find(l => l.mode === 'cpm');
  if (cpmL || d.detention) h += row(`Detention · espera nas docas${cpmL && cpmL.detentionRate ? ` (${fmt(cpmL.detentionRate)}/h após ${fmtN(cpmL.detentionFree)}h)` : ''}`, d.detention || 0);
  if (cpmL || d.stops) h += row(`Stop pay · paradas extras${cpmL && cpmL.stopRate ? ` (${fmt(cpmL.stopRate)} cada)` : ''}`, d.stops || 0);
  if (d.layover) h += row('Layover · dias parado aguardando carga', d.layover);
  if (d.breakdown) h += row('Breakdown pay · caminhão quebrado', d.breakdown);
  if (d.tarp) h += row('Tarp pay · cargas com lona', d.tarp);
  const pcts = d.commissionPcts || (d.commissionPct ? [d.commissionPct] : []);
  const mkt = d.marketTotal !== undefined && Math.abs(d.marketTotal - d.freight) > 0.005;
  if (d.commission || pcts.length) h += row(`Comissão (${pcts.length > 1 ? 'taxa de cada viagem' : fmtN(pcts[0] || 0) + '%'} de ${mkt ? `${fmt(d.marketTotal)} de frete de mercado` : fmt(d.freight)})`, d.commission);
  if (k.tripBonus || d.tripBonus) h += row('Bônus das viagens de caminhão', d.tripBonus);
  if (d.minimum) h += row('Complemento do mínimo garantido', d.minimum);
  if (s.renome.on) h += row(`Bônus por renome (${fmtN(s.renome.pct)}%)`, d.renome);
  if (d.safety) h += row('Bônus de segurança', d.safety);
  if (s.borrowed.on && s.borrowed.settle === 'payroll') h += row('Viagens de carro emprestado (líquido)', d.borrowed);

  const D = d.deductions;
  if (D && D.total) {
    const self = d.taxType === '1099';
    h += grp(self ? '(−) Reserva de impostos e descontos' : '(−) Impostos e descontos', D.total);
    if (D.federal) h += row(self ? `Imposto de renda federal (estimado${s.taxes.qbi !== false ? ', com dedução QBI de 20%' : ''})` : 'Imposto de renda federal (retido)', D.federal);
    if (D.fica) h += row(`FICA · Seguridade Social + Medicare (${fmtN(s.taxes.ficaPct)}%)`, D.fica);
    if (D.se) h += row(`Self-employment tax · autônomo (${fmtN(s.taxes.sePct)}%)`, D.se);
    if (D.state) h += row(`Imposto estadual (${fmtN(s.taxes.statePct)}%)`, D.state);
    if (D.health) h += row('Plano de saúde', D.health);
    if (D.k401) h += row(`401(k) · aposentadoria (${fmtN(s.benefits.k401Pct)}%)`, D.k401);
    if (d.perDiem) h += row(`Diária isenta: ${d.awayDays} dia${d.awayDays === 1 ? '' : 's'} fora reduzem a base do imposto`, d.perDiem, 'sub info');
    h += row(self ? '(=) Líquido do acerto (settlement)' : '(=) Líquido do holerite', d.takeHome, 'sub subtotal');
  }

  const V = d.variable, pays = key => (s.expenses || {})[key];
  h += grp('(−) Despesas de viagem', V.total);
  h += row(`Combustível${pays('fuel') === 'company' ? ' · empresa paga' : ''}`, V.fuel, 'sub', V.fuel > 0 || pays('fuel') !== 'company');
  h += row(`Pedágios${pays('tolls') === 'company' ? ' · empresa paga' : ''}`, V.tolls, 'sub', V.tolls > 0 || pays('tolls') !== 'company');
  h += row(`Cafés da manhã (${fmt(c.breakfast.val)} cada)`, V.breakfast, 'sub', c.breakfast.on);
  h += row(`Almoços (${fmt(c.lunch.val)} cada)`, V.lunch, 'sub', c.lunch.on);
  h += row(`Jantas (${fmt(c.dinner.val)} cada)`, V.dinner, 'sub', c.dinner.on);
  h += row(`Diárias / hotel (${fmt(c.hotel.val)} cada)${pays('hotel') === 'company' ? ' · empresa paga' : ''}`, V.hotel, 'sub', c.hotel.on && (V.hotel > 0 || pays('hotel') !== 'company'));
  h += row('Multas de trânsito', V.fines);
  if (V.damage !== undefined) h += row(`Danos${pays('damage') === 'deductible' ? ` (franquia até ${fmt(s.expenses.deductible)})` : ''}`, V.damage, 'sub', V.damage > 0 || pays('damage') !== 'company');

  const O = d.opCosts;
  if (O && O.total) {
    const oc = s.opCosts;
    h += grp('(−) Custos operacionais do caminhão', O.total);
    h += row(`Manutenção (${fmtN(d.miles)} mi × ${fmt(oc.maintenance)})`, O.maintenance);
    h += row(`Pneus (${fmtN(d.miles)} mi × ${fmt(oc.tires)})`, O.tires);
    h += row(`Seguro (${fmtN(d.miles)} mi × ${fmt(oc.insurance)})`, O.insurance);
    h += row('Parcela / leasing do caminhão', O.truck);
    h += row('Licenças, IFTA, ELD e escrow', O.other);
  }

  h += grp('(−) Custos fixos & pessoais', d.fixed.total);
  h += row('Moradia / custo de vida fixo', d.fixed.housing, 'sub', c.housing.on);
  if (s.loan.on || d.fixed.loan) h += row('Parcela do empréstimo', d.fixed.loan, 'sub', s.loan.on);
  h += `<tr class="total"><td>${++g}. (=) Lucro líquido real</td><td class="num ${d.net < 0 ? 'neg' : 'pos'}">${fmt(d.net)}</td><td class="pct">${pct(d.net)}</td></tr>`;
  return h + '</tbody></table>';
}

const statusChip = st => `<span class="chip ${({ Excelente: 'ok', Bom: 'ok', Regular: 'warn', Ruim: 'bad', Atrasada: 'bad' })[st] || ''}">${esc(st || '—')}</span>`;
function mealsText(t) {
  const parts = [];
  const add = (n, a, b) => { n = E.n(n); if (n) parts.push(`${n} ${n === 1 ? a : b}`); };
  add(t.breakfast, 'café', 'cafés'); add(t.lunch, 'almoço', 'almoços'); add(t.dinner, 'janta', 'jantas'); add(t.hotel, 'diária', 'diárias');
  return parts.join(' · ');
}
function tripRow(t) {
  const s = SS(), b = t.type === 'borrowed';
  const val = b ? E.borrowedValue(t, s) : E.tripPay(t, s).total;
  const md = E.contractOf(t, s).mode;
  const tags = [];
  if (!b && md === 'hourly' && E.n(t.hours)) tags.push(`${fmtN(t.hours)} h serviço`);
  if (!b && E.n(t.drive)) tags.push(`${fmtN(t.drive)} h direção`);
  if (!b && md === 'cpm' && E.n(t.detention)) tags.push(fmtN(t.detention) + ' h espera');
  if (!b && md === 'cpm' && E.n(t.stops)) tags.push(t.stops + ' parada' + (t.stops == 1 ? '' : 's'));
  if (E.n(t.layover)) tags.push(fmtN(t.layover) + ' dia' + (t.layover == 1 ? '' : 's') + ' layover');
  if (E.n(t.breakdown)) tags.push(fmtN(t.breakdown) + ' h quebra');
  if (t.tarp) tags.push('lona');
  if (t.away) tags.push('pernoite fora');
  const extras = [mealsText(t), E.n(t.fines) ? 'multa ' + fmt(t.fines) : '', E.n(t.damage) ? 'dano ' + fmt(t.damage) : '', E.n(t.fuel) ? 'comb. ' + fmt(t.fuel) : '', E.n(t.tolls) ? 'pedágio ' + fmt(t.tolls) : ''].filter(Boolean);
  const mkt = !b && t.rules && t.rules.market && t.rules.market.on;
  return `<button type="button" class="trip" data-edit="${esc(t.id)}">
    <div class="route">${esc(t.origin || '?')}<span class="arr">→</span>${esc(t.dest || '?')}</div>
    <div class="amt">${fmt(t.freight)}</div>
    <div class="meta"><span class="chip ${b ? 'loan' : ''}">${b ? carLabel(t) : 'Caminhão · ' + ({ weekly: 'Fixo', hourly: 'Por hora', cpm: 'CPM', percent: '% frete' })[md]}</span>${statusChip(t.status)}<span>${fmtN(t.miles)} mi</span>${mkt ? `<span>mercado ${fmt(E.marketFreight(t, s))}</span>` : ''}${[...tags, ...extras].length ? `<span>${esc([...tags, ...extras].join(' · '))}</span>` : ''}</div>
    <div class="res ${val < 0 ? 'neg' : 'pos'}">${b ? 'Resultado ' : 'Ganho '}${fmt(val)}</div>
  </button>`;
}

function hosPanel(days) {
  const s = SS();
  if (!s.hos.on) return '';
  const recent = [...H.slice(-2).flatMap(w => w.trips || []), ...S.week.trips];
  const rep = E.hos(recent, s, { local: isLocalOp(), gameDay: S.gameDay, days });
  const anyHours = S.week.trips.some(t => t.type !== 'borrowed' && (E.n(t.drive) || E.n(t.hours)));
  const cyc = rep.over ? 'bad' : rep.cycleLeft < 10 ? 'warn' : 'ok';
  const chips = (alerts, extra = []) => {
    const all = [...alerts, ...extra]; if (!all.length) return { chips: '<span class="chip ok">Dentro do limite</span>', boxes: '' };
    const hs = all.map(a => ({ a, h: ruleHelp(a.code) }));
    return { chips: hs.map(({ a, h }) => `<button type="button" class="chip ${a.level} rulechip" data-help="${h.id}" aria-expanded="false" aria-controls="${h.id}">${esc(a.text)} <span class="ri" aria-hidden="true">?</span></button>`).join(''), boxes: hs.map(({ h }) => h.box).join('') };
  };
  const rows = rep.rows.map(r => { const c = chips(r.alerts); return `<div class="hosrow"><div><b>Dia ${r.day}</b> <span class="muted">· ${fmtN(r.drive)}h direção · ${fmtN(r.duty)}h serviço${r.exempt ? ' · isenção local' : ''}</span></div><div class="alerts">${c.chips}</div>${c.boxes ? `<div class="hosboxes">${c.boxes}</div>` : ''}</div>`; }).join('');
  const cycBox = rep.over ? chips([], [{ code: 'cycle', level: 'bad', text: 'Ciclo semanal estourado' }]) : null;
  const HJ = help('ui.hos', 'Jornada');
  return `<section class="panel pad" style="display:flex;flex-direction:column;gap:6px">
    <div class="sec-head"><div><div class="eyebrow">FMCSA · Hours of Service</div><h3 class="hrow">Jornada${HJ.btn}</h3></div><span class="chip ${cyc} wrapok">Ciclo ${rep.limit}h/${rep.window} dias: ${fmtN(rep.cycleUsed)}h usadas · ${fmtN(rep.cycleLeft)}h livres${rep.restartDay ? ` · restart no dia ${rep.restartDay}` : ''}</span></div>${HJ.box}
    <p class="muted" style="margin:0;font-size:13px">${isLocalOp() && s.hos.shortHaul ? `Operação local: isenção de curta distância até ${fmtN(s.hos.radius)} mi aéreas da base e 14h de jornada, sem pausa obrigatória de 30 min. Direção continua limitada a 11h.` : 'Limites: 11h de direção e 14h de jornada por dia, pausa de 30 min após 8h dirigindo e 10h de folga antes do próximo turno.'}</p>
    ${cycBox ? `<div class="alerts">${cycBox.chips}</div>${cycBox.boxes}` : ''}
    ${anyHours ? rows + '<p class="muted" style="margin:0;font-size:12.5px">Toque em um alerta para ver o que significa, a consequência e como resolver. Vermelho = infração; amarelo = aviso.</p>' : '<p class="muted" style="margin:0;font-size:13px">Informe as horas de direção e de serviço nas viagens para acompanhar a jornada.</p>'}
  </section>`;
}

function diario() {
  const TD = help('tab.diario', 'Diário');
  const trips = S.week.trips.slice().sort((a, b) => a.day - b.day);
  const days = [...new Set(trips.map(t => t.day))];
  const d = weekDre();
  let body = days.map(day => `<div class="daygrp"><div class="dayhead"><b>Dia ${day}</b><span class="muted">${E.WEEKDAYS_FULL[E.weekdayIdx(day, S.settings)]}</span></div>${trips.filter(t => t.day === day).map(tripRow).join('')}</div>`).join('');
  if (!trips.length) body = `<div class="empty">Nenhuma viagem nesta semana ainda.<br><button class="btn primary" style="margin-top:12px" data-act="new-trip">Lançar a primeira viagem</button></div>`;
  return `<div class="sec-head"><div><div class="eyebrow">Diário de bordo</div><h2 class="hrow">Semana ${weekLabel(S.week.start).toLowerCase()}${TD.btn}</h2></div>
    <div class="muted" style="font-size:13.5px">${trips.length} lançamento${trips.length === 1 ? '' : 's'} · ${fmtN(trips.reduce((a, t) => a + E.n(t.miles), 0))} mi</div></div>
    ${TD.box}${needClose() ? `<div class="banner"><b>Semana encerrada no calendário do jogo.</b><button class="btn primary" data-act="close-week">Fechar semana</button></div>` : ''}
    ${trips.some(t => t.type !== 'borrowed') ? hosPanel(days.filter(dd => trips.some(t => t.day === dd && t.type !== 'borrowed'))) : ''}
    ${body}
    ${trips.length ? `<div class="panel pad row between"><span class="muted">Salário bruto da semana</span><b>${fmt(d.revenue)}</b></div>` : ''}`;
}

function holerite() {
  const s = SS();
  const list = S.payroll.slice().sort((a, b) => b.weekStart - a.weekStart);
  const items = list.map(p => {
    const paid = p.status === 'paid', ready = !paid && p.payday <= S.gameDay, left = p.payday - S.gameDay;
    const self = p.breakdown && p.breakdown.tax === '1099';
    const chip = paid ? `<span class="chip ok">Pago no dia ${p.paidDay}</span>` : ready ? `<span class="chip warn">Disponível</span>` : `<span class="chip">Previsto · falta${left === 1 ? '' : 'm'} ${left} dia${left === 1 ? '' : 's'}</span>`;
    const bk = p.breakdown ? `<table class="bk"><tbody>
        <tr><td>${self ? 'Receita bruta' : 'Salário bruto'}${p.breakdown.safety ? ' (inclui bônus de segurança)' : ''}</td><td>${fmt(p.breakdown.gross)}</td></tr>
        <tr><td>(−) ${self ? 'Reserva de impostos e descontos' : 'Impostos e descontos'}</td><td>${fmt(p.breakdown.ded)}</td></tr>
        <tr class="t"><td>(=) ${self ? 'Líquido do acerto' : 'Líquido do holerite'}</td><td>${fmt(p.breakdown.takeHome)}</td></tr>
        ${p.amount === p.breakdown.takeHome && E.n(p.breakdown.living) > 0 ? `<tr><td class="muted">Despesas e custo de vida (já debitados do saldo)</td><td class="muted">${fmt(-p.breakdown.living)}</td></tr>` : ''}
      </tbody></table>` : '';
    return `<div class="panel pad" style="display:flex;flex-direction:column;gap:8px">
      <div class="row between"><div><div class="eyebrow">${self ? 'Acerto (settlement) da semana' : 'Holerite da semana'}</div><h3>${weekLabel(p.weekStart)}</h3></div><div style="font-family:var(--display);font-size:24px;font-weight:600" class="${p.amount < 0 ? 'neg' : ''}">${fmt(p.amount)}</div></div>
      ${bk}
      <div class="row between"><div class="row" style="gap:8px">${chip}<span class="muted" style="font-size:13px">Pagamento: ${dayFull(p.payday)}</span></div>
      ${paid ? '' : `<button class="btn sm ${ready ? 'primary' : ''}" data-pay="${esc(p.id)}">${ready ? 'Receber' : 'Receber agora'}</button>`}</div>
    </div>`;
  }).join('') || `<div class="empty">Nenhum holerite ainda. Feche uma semana no Painel para gerar o primeiro.</div>`;
  const led = S.ledger.slice().sort((a, b) => b.day - a.day || 0).slice(0, 40).map(e => `<div class="li"><div><div>${esc(e.desc)}</div><div class="muted" style="font-size:12.5px">${dayFull(e.day)}${!e.locked && e.ref && e.ref.startsWith('trip:') ? ' · semana em aberto' : ''}</div></div><b class="${e.amount < 0 ? 'neg' : 'pos'}">${e.amount < 0 ? '' : '+'}${fmt(e.amount)}</b></div>`).join('') || '<div class="muted">Sem movimentações.</div>';
  const sf = s.safety, streak = S.career.safetyStreak || 0;
  const extra = s.loan.on ? ['Empréstimo', fmt(S.bank.loanTotal), `Parcela de ${fmt(s.loan.installment)} no dia ${S.career.loanNext}`] : S.career.k401 ? ['401(k) acumulado', fmt(S.career.k401), 'Aposentadoria guardada'] : null;
  return `<div class="stats two">
    <div class="panel stat">${eyeH('ui.receber', 'A receber')}<div class="v">${fmt(pendingPay(S))}</div><div class="s">${s.payroll.lagOn ? `Pay lag de ${s.payroll.lagWeeks} semana${s.payroll.lagWeeks == 1 ? '' : 's'} · ${E.WEEKDAYS_FULL[s.payroll.paydayWeekday].toLowerCase()}` : 'Pagamento ao fechar a semana'}</div></div>
    ${extra ? `<div class="panel stat"><div class="eyebrow">${extra[0]}</div><div class="v">${extra[1]}</div><div class="s">${extra[2]}</div></div>` : `<div class="panel stat"><div class="eyebrow">Holerites pagos</div><div class="v">${S.payroll.filter(p => p.status === 'paid').length}</div><div class="s">Nas últimas 12 semanas</div></div>`}
  </div>
  ${sf.on ? `<div class="panel pad row between"><div>${eyeH('ui.seguranca', 'Bônus de segurança')}<div>${streak % sf.weeks} de ${sf.weeks} semanas seguidas sem multa ou dano</div></div><b>${fmt(sf.amount)}</b></div>` : ''}
  ${(h => `<div class="sec-head"><h2 class="hrow">Holerites${h.btn}</h2></div>${h.box}`)(help('ui.holerite', 'Holerites'))}
  ${items}

  <section class="panel pad" style="display:flex;flex-direction:column;gap:8px">
    ${(h => `<div class="sec-head"><h2 class="hrow">Extrato${h.btn}</h2><button class="btn sm" data-act="adjust">Ajustar saldo</button></div>${h.box}`)(help('ui.extrato', 'Extrato'))}
    <div class="ledger">${led}</div>
    ${E.n(S.bank.archived) ? `<p class="muted" style="margin:0;font-size:12.5px">Lançamentos com mais de 12 semanas ficam somados no saldo (${fmt(S.bank.archived)}) e saem desta lista.</p>` : ''}
  </section>`;
}

function historico() {
  const weeks = H.slice().sort((a, b) => b.start - a.start);
  if (!weeks.length) return `<div class="sec-head"><h2>Histórico</h2></div><div class="empty">As semanas fechadas aparecem aqui, com DRE e todas as viagens.</div>`;
  const totals = weeks.reduce((a, w) => ({ net: a.net + w.dre.net, gross: a.gross + E.n(w.dre.revenue), miles: a.miles + w.dre.miles }), { net: 0, gross: 0, miles: 0 });
  const TH = help('tab.historico', 'Histórico');
  return `<div class="sec-head"><div><div class="eyebrow">Fretes realizados</div><h2 class="hrow">Histórico${TH.btn}</h2></div></div>${TH.box}
  <div class="stats">
    <div class="panel stat"><div class="eyebrow">Lucro acumulado</div><div class="v">${fmt(totals.net)}</div><div class="s">${weeks.length} semana${weeks.length === 1 ? '' : 's'} fechada${weeks.length === 1 ? '' : 's'}</div></div>
    <div class="panel stat"><div class="eyebrow">Ganho bruto</div><div class="v">${fmt(totals.gross)}</div><div class="s">${totals.miles ? fmt(totals.gross / totals.miles) + ' por milha' : 'Antes de impostos'}</div></div>
    <div class="panel stat"><div class="eyebrow">Distância</div><div class="v">${fmtN(totals.miles)} mi</div><div class="s">Viagens de caminhão</div></div>
  </div>
  ${weeks.map(w => {
    const ws = E.mergeDefaults(w.settings || SS());
    const rows = w.trips.slice().sort((a, b) => a.day - b.day).map(t => `<tr><td>${t.day}</td><td>${esc(t.origin)}</td><td>${esc(t.dest)}</td><td>${t.type === 'borrowed' ? 'Carro' : 'Caminhão'}</td><td>${esc(t.status)}</td><td class="num">${fmtN(t.miles)}</td><td class="num">${fmt(t.freight)}</td><td class="num">${fmt(t.bonus || 0)}</td><td class="num">${[t.breakfast, t.lunch, t.dinner, t.hotel].map(x => E.n(x)).join('/')}</td><td class="num">${fmt(t.fines || 0)}</td><td class="num">${t.type === 'borrowed' ? fmt(E.borrowedValue(t, ws)) : fmt(E.tripPay(t, ws).total)}</td></tr>`).join('');
    return `<details class="week"><summary><div><b>Semana ${weekLabel(w.start).toLowerCase()}</b><div class="muted" style="font-size:13px">${w.trips.length} viage${w.trips.length === 1 ? 'm' : 'ns'} · ${fmtN(w.dre.miles)} mi · bruto ${fmt(w.dre.revenue)}</div></div><b class="${w.dre.net < 0 ? 'neg' : 'pos'}" style="font-size:20px">${fmt(w.dre.net)}</b></summary>
      <div class="body">${dreTable(w.dre, ws)}
        <div class="scroll"><table class="tbl"><thead><tr><th>Dia</th><th>Origem</th><th>Destino</th><th>Tipo</th><th>Status</th><th class="num">mi</th><th class="num">Frete</th><th class="num">Bônus</th><th class="num" title="Cafés / almoços / jantas / noites em hotel">C/A/J/H</th><th class="num">Multas</th><th class="num">Ganho / resultado</th></tr></thead><tbody>${rows}</tbody></table></div>
        <div class="row"><button class="btn sm danger" data-delweek="${esc(w.id)}">Excluir semana</button></div>
      </div></details>`;
  }).join('')}`;
}

function ruleHelp(code, label) {
  const txt = ruleHtml(code); if (!txt) return { btn: '', box: '' };
  const id = 'hp' + (++_hid);
  return { id, box: `<div class="help" id="${id}" hidden>${txt}</div>` };
}

let _hid = 0;
// Título curto (eyebrow) com ajuda, para cartões e totais
const eyeH = (key, label) => { const h = help(key, label); return `<div class="lab-row"><div class="eyebrow">${label}</div>${h.btn}</div>${h.box}`; };
const helpKey = p => String(p || '').replace(/^contracts\.\d+\./, 'contract.');
function helpFor(key) {
  const k = helpKey(key);
  const txt = HELP[k] || HELP[k.replace(/\.(on|val)$/, '')];
  return txt || '';
}
// Botão "?" + caixa de ajuda (fechada). Retorna { btn, box }
function help(key, label = '') {
  const txt = helpFor(key);
  if (!txt) return { btn: '', box: '' };
  const id = 'hp' + (++_hid);
  return { btn: `<button type="button" class="help-btn" data-help="${id}" aria-expanded="false" aria-controls="${id}" aria-label="Ajuda: ${esc(String(label).replace(/<[^>]+>/g, ''))}">?</button>`, box: `<div class="help" id="${id}" hidden>${txt}</div>` };
}
// Linha de rótulo com o botão de ajuda
function labRow(key, label, forId) {
  const h = help(key, label);
  return { row: `<div class="lab-row">${forId ? `<label for="${forId}">${label}</label>` : `<span class="lab">${label}</span>`}${h.btn}</div>`, box: h.box };
}

/* Componentes de formulário: campos ligados ao estado, blocos recolhíveis */
const getP = (path) => path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), S);
function setP(path, val) { const ks = path.split('.'); let o = S; ks.slice(0, -1).forEach(k => { if (o[k] == null) o[k] = {}; o = o[k]; }); o[ks.at(-1)] = val; }
const fid = p => 'f_' + p.replace(/[^a-z0-9]/gi, '_');
const F = {
  num: (path, label, o = {}) => { const L = labRow(o.help || path, label, fid(path)); return `<div class="field ${o.full ? 'full' : ''}">${L.row}<div class="${o.money ? 'money' : o.pct ? 'pctf' : ''}"><input id="${fid(path)}" type="number" inputmode="decimal" step="${o.step || 'any'}" data-bind="${path}" data-type="num" value="${esc(o.value !== undefined ? o.value : getP(path))}" ${o.disabled ? 'disabled' : ''}></div>${o.hint ? `<span class="muted" style="font-size:12px">${o.hint}</span>` : ''}${L.box}</div>`; },
  text: (path, label, o = {}) => { const L = labRow(path, label, fid(path)); return `<div class="field ${o.full ? 'full' : ''}">${L.row}<input id="${fid(path)}" type="text" data-bind="${path}" value="${esc(getP(path))}" placeholder="${esc(o.ph || '')}">${L.box}</div>`; },
  sel: (path, label, opts, o = {}) => { const L = labRow(path, label, fid(path)); return `<div class="field ${o.full ? 'full' : ''}">${L.row}<select id="${fid(path)}" data-bind="${path}" data-type="${o.num ? 'num' : 'str'}" data-rerender>${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(getP(path)) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>${L.box}</div>`; },
  chk: (path, label, hkey = path) => { const h = help(hkey, label); return `<span class="chk-row"><label class="inline-opt"><input type="checkbox" id="${fid(path)}" data-bind="${path}" data-type="bool" data-rerender ${getP(path) ? 'checked' : ''}> ${label}</label>${h.btn}</span>${h.box}`; }
};
const sw = (path, label) => `<span class="switch"><input type="checkbox" id="${fid(path)}" aria-label="${esc(label)}" data-bind="${path}" data-type="bool" data-rerender ${getP(path) ? 'checked' : ''}><span></span></span>`;
// Blocos recolhíveis: fechados mostram um resumo; o estado aberto sobrevive ao re-render
const openMods = new Set(['Dados pessoais']);
const mod = (title, desc, path, body, sum = '') => {
  const open = openMods.has(title), on = !path || getP(path);
  const line = !open && sum ? sum : desc;
  const hb = path ? help(path, title) : { btn: '', box: '' };
  return `<section class="mod ${path && !on ? 'off' : ''}"><div class="mod-h"><button type="button" class="mod-t" data-modt="${esc(title)}" aria-expanded="${open}" data-desc="${esc(desc)}" data-sum="${esc(sum)}"><span class="t"><h3>${title}</h3><p>${esc(line)}</p></span><span class="caret" aria-hidden="true"></span></button>${hb.btn}${path ? sw(path, title) : ''}</div>${hb.box ? `<div style="padding:0 14px 10px">${hb.box}</div>` : ''}<div class="mod-b" ${open ? '' : 'hidden'}>${body}</div></section>`;
};
const costField = (key, label, hint) => `<div class="field">${F.chk(`settings.costs.${key}.on`, label)}<div class="money"><input id="${fid('settings.costs.' + key + '.val')}" aria-label="${label} (valor)" type="number" inputmode="decimal" step="any" data-bind="settings.costs.${key}.val" data-type="num" value="${getP('settings.costs.' + key + '.val')}" ${getP('settings.costs.' + key + '.on') ? '' : 'disabled'}></div><span class="muted" style="font-size:12px">${hint}</span></div>`;

  const items = S.settings.lists[key];
  const LR = labRow('lists.' + key, label);
  return `<div class="full field">${LR.row}${LR.box}<div class="cities">${items.map((c, i) => `<span class="chip">${esc(c)}<button type="button" data-dellist="${key}:${i}" aria-label="Remover ${esc(c)}">×</button></span>`).join('')}</div>
    <div class="row" style="flex-wrap:nowrap"><input id="new_${key}" type="text" placeholder="${esc(ph)}" style="flex:1;min-width:0;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:8px 10px;min-height:40px"><button class="btn" data-addlist="${key}">Adicionar</button></div></div>`;
}

// Ajustes = regras gerais do jogo. Tudo que depende do empregador fica no contrato (aba Carreira).
function carModule() {
  const s = S.settings, b = s.borrowed;
  // Comparação por viagem: uma viagem de carro típica (distância e frete médios das suas viagens de carro)
  // contra o salário bruto médio por viagem de caminhão da semana atual.
  const carTrips = [...H.flatMap(w => w.trips || []), ...S.week.trips].filter(t => t.type === 'borrowed' && E.n(t.miles) > 0);
  const mi = carTrips.length ? Math.round(carTrips.reduce((a, t) => a + E.n(t.miles), 0) / carTrips.length) : 200;
  const gpm = carTrips.length ? carTrips.reduce((a, t) => a + E.n(t.freight), 0) / carTrips.reduce((a, t) => a + E.n(t.miles), 0) : 3.7;
  const mkt = mi * gpm * E.n(b.factor);
  const lent = mkt * E.n(b.pct) / 100, own = mkt - mi * E.n(b.costPerMile) - mi * 0.2;
  const wk = E.dre(S.week.trips.filter(t => t.type !== 'borrowed'), SS());
  const truckTrip = wk.counts.company ? wk.revenue / wk.counts.company : null;
  const cmp = v => truckTrip ? ` (${fmtN(v / truckTrip * 100)}% de uma viagem de caminhão)` : '';
  return mod('Viagens de carro', 'Fretes fora do contrato. Emprestado: % do frete, sem custos do veículo. Próprio: 100% do frete, com todos os custos.', 'settings.borrowed.on',
    F.num('settings.borrowed.factor', 'Fator sobre o frete do jogo', { hint: `Frete de mercado do carro = frete do jogo × ${fmtN(b.factor)}.` }) +
    `<div class="field">${F.chk('settings.borrowed.bonusFactor', 'Aplicar o fator também ao bônus')}</div>` +
    F.num('settings.borrowed.pct', 'Emprestado: comissão do motorista', { pct: true, hint: 'O dono do carro paga combustível, pedágio e danos.' }) +
    `<div class="field">${F.chk('settings.borrowed.personal', 'Emprestado: refeições, hotel e multas continuam com o motorista')}</div>` +
    `<div class="field">${F.chk('settings.borrowed.ownOn', 'Tenho carro próprio')}</div>` +
    (b.ownOn ? F.num('settings.borrowed.costPerMile', 'Próprio: custo do carro por milha', { money: true, hint: 'Manutenção, pneus, seguro e depreciação. Combustível e pedágio são lançados na viagem.' }) : '') +
    F.sel('settings.borrowed.settle', 'Quando o resultado cai no saldo', [['immediate', 'Na hora do lançamento'], ['payroll', 'Junto com o holerite da semana']]) +
    hint(`<b>Viagem de carro típica</b> (${mi} mi, frete do jogo ${fmt(gpm)}/mi, sem bônus): emprestado ${fmt(lent)}${cmp(lent)}${b.ownOn ? ` · próprio ${fmt(own)} com combustível estimado em $0,20/mi${cmp(own)}` : ''}.${truckTrip ? ` Caminhão na semana atual: ${fmt(truckTrip)} de salário bruto por viagem.` : ''} Alvo: carro emprestado entre 35% e 50% e próprio entre 55% e 75% de uma viagem de caminhão.`),
    `Emprestado ${fmtN(b.pct)}% · ${b.ownOn ? `próprio ${fmt(b.costPerMile)}/mi · ` : ''}frete × ${fmtN(b.factor)}`);
}

function startModule() {
  const s = S.settings, C = S.career, L = s.loan, wd = E.WEEKDAYS_FULL.map((l, i) => [i, l]), eff = SS();

  const sum = [`saldo inicial ${fmt(S.bank.opening)}`, s.bills.on ? `contas toda ${E.WEEKDAYS_FULL[s.bills.weekday].toLowerCase()}` : 'contas no fechamento', L.on ? `empréstimo ${fmt(S.bank.loanTotal)}` : 'sem empréstimo'].join(' · ');
